name: M5 R61 Strict Physical DPR Oracle RTX
on:
  push:
    branches: [m5/r46-distinct-mvt-32-20261023]
    paths:
      - 'm5-gpu/r61/run_strict_physical_dpr_oracle.mjs'
      - '.github/workflows/m5-r61-strict-physical-dpr-rtx.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r61-strict-physical-dpr
  cancel-in-progress: true
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 50
    env:
      R35_ZIP_PATH: 'C:\M5_R35\M5_R35_RTX_READY_SELF_CONTAINED_2026-10-22.zip'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert RTX hardware and pinned source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force R61-EVIDENCE | Out-Null
          $g=@(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion)
          $g | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 R61-EVIDENCE\gpu.json
          if($env:OS -ne 'Windows_NT' -or -not ($g | Where-Object {$_.Name -match 'NVIDIA.*RTX 5060 Ti'})){throw 'physical RTX 5060 Ti required'}
          $hash=(Get-FileHash -Algorithm SHA256 $env:R35_ZIP_PATH).Hash.ToLowerInvariant()
          if($hash -ne '3e5d3cb5d525b818a3b560731dac0ae17ce734ab5a96057c67c546c4b7cb2776'){throw 'R35 seed SHA mismatch'}
          $hash | Set-Content R61-EVIDENCE\r35-sha256.txt
      - name: Reconstruct R48 actual OL application
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R61-SOURCE'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive -LiteralPath $env:R35_ZIP_PATH -DestinationPath $dest -Force
          git -C $dest init -q
          if($LASTEXITCODE -ne 0){throw 'git init failed'}
          node m5-gpu/r45/apply_r45.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R45 apply failed'}
          node m5-gpu/r48/apply_cpu_join_fallback.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R48 apply failed'}
          New-Item -ItemType Directory -Force (Join-Path $dest 'm5-gpu\r53'),(Join-Path $dest 'm5-gpu\r61') | Out-Null
          Copy-Item .\m5-gpu\r53\actual_32_ol_ui.html (Join-Path $dest 'm5-gpu\r53\')
          Copy-Item .\m5-gpu\r61\run_strict_physical_dpr_oracle.mjs (Join-Path $dest 'm5-gpu\r61\')
          Push-Location $dest
          try {
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
            if($LASTEXITCODE -ne 0){throw 'playwright install failed'}
          } finally {Pop-Location}
      - name: Fetch 32 distinct MVT fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R61-SOURCE'
          New-Item -ItemType Directory -Force (Join-Path $dest 'm5-gpu\r46') | Out-Null
          Copy-Item .\m5-gpu\r46\download_unique_tiles.mjs (Join-Path $dest 'm5-gpu\r46\')
          node (Join-Path $dest 'm5-gpu\r46\download_unique_tiles.mjs') (Join-Path $dest 'tests\fixtures\r46-data')
          if($LASTEXITCODE -ne 0){throw 'fixture fetch failed'}
      - name: Exhaustive 8/16/32 x DPR1/2 x two deterministic delay seeds
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R61-SOURCE'
          $failed=@()
          $checked=0
          foreach($sourceCount in @(8,16,32)){
            foreach($dpr in @(1,2)){
              foreach($seed in @(1,2)){
                $env:M5_R57_SOURCES=[string]$sourceCount
                $env:M5_R57_DPR=[string]$dpr
                $env:M5_R57_SEED=[string]$seed
                $case=('sources'+$sourceCount+'-dpr'+$dpr+'-seed'+$seed)
                $out=Join-Path $env:GITHUB_WORKSPACE ('R61-EVIDENCE\cases\'+$case)
                $script=Join-Path $dest 'm5-gpu\r61\run_strict_physical_dpr_oracle.mjs'
                $node=(Get-Command node).Source
                # Windows PowerShell Start-Process -PassThru can expose a
                # null ExitCode even after WaitForExit; use the .NET process
                # object directly to retain the native exit status.
                $psi=New-Object System.Diagnostics.ProcessStartInfo
                $psi.FileName=$node
                $psi.Arguments=('"'+$script+'" "'+$dest+'" "'+$out+'"')
                $psi.UseShellExecute=$false
                $psi.CreateNoWindow=$true
                $p=[System.Diagnostics.Process]::Start($psi)
                if(-not $p.WaitForExit(90000)){
                  Write-Warning ('R61_CASE_TIMEOUT '+$case)
                  try{& taskkill.exe /PID $p.Id /T /F | Out-Null}catch{}
                  $exit=124
                }else{
                  $p.Refresh()
                  $exit=$p.ExitCode
                }
                $resultFile=Join-Path $out 'result.json'
                if(-not (Test-Path $resultFile)){
                  $failed+=($case+': missing JSON')
                  continue
                }
                $r=Get-Content $resultFile -Raw | ConvertFrom-Json
                $isNodeExitZero=($null -ne $exit -and [int]$exit -eq 0)
                $isCaseExact=($r.pass -eq $true -and @($r.checks).Count -ge 4 -and $r.pixelAudit.diffPixels -eq 0 -and $r.pixelAudit.changedChannels -eq 0 -and [int]$r.pixelAudit.sources -eq $sourceCount -and [int]$r.pixelAudit.dpr -eq $dpr -and [int]$r.pixelAudit.seed -eq $seed -and $r.tileAudit.exact -eq $true)
                Write-Host ('R61_GATE_DIAGNOSTIC '+$case+' nodeExit='+[string]$exit+' nodeExitZero='+$isNodeExitZero+' exact='+$isCaseExact+' resultPass='+$r.pass+' pixelSources='+$r.pixelAudit.sources+' expectedSources='+$sourceCount+' tileExact='+$r.tileAudit.exact)
                if(-not $isNodeExitZero -or -not $isCaseExact){
                  $failed+=($case+': failed gate')
                }else{
                  $checked++
                  Write-Host ('R61_EXACT_PASS '+$case)
                }
              }
            }
          }
          if($checked -ne 12 -or $failed.Count -gt 0){throw ('R61 gating failed passed='+$checked+' failed='+($failed -join '; '))}
          Write-Host 'R61_STRICT_DPR_TILE_ORACLE_12_OF_12_PASS'
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r61-strict-physical-dpr-probe
          path: R61-EVIDENCE/**
          retention-days: 30
          if-no-files-found: warn
