name: Round16 M5 MSAA Opt-in RTX Parity
on:
  push:
    paths:
      - .github/workflows/m5-round16-msaa-optin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load unchanged Round14 into isolated workspace and patch comparator
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare'
          if (-not (Test-Path (Join-Path $source 'tests\round14_gpu_compare\oneclick.mjs'))) { throw 'Original Round14 project missing' }
          $dest=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item (Join-Path $source '*') $dest -Recurse -Force
          if(Test-Path (Join-Path $dest 'RESULTS')){Remove-Item (Join-Path $dest 'RESULTS') -Recurse -Force}
          node m5-gpu/round14_apply_capture_fix.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'OL capture patch failed'}
          node m5-gpu/apply_backend_msaa_optin.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'MSAA opt-in patch failed'}
          Copy-Item m5-gpu/verify_round16_context_optin.mjs (Join-Path $dest 'tests\verify_round16_context_optin.mjs')
          "R16_PROJECT=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: CPU and GL API regression
        shell: powershell
        run: |
          Set-Location $env:R16_PROJECT
          node tests/verify_round16_context_optin.mjs
          if($LASTEXITCODE -ne 0){throw 'Context opt-in regression failed'}
          node tests/verify_round14_loop_and_style.mjs
          if($LASTEXITCODE -ne 0){throw 'Round14 geometry parity failed'}
          node tests/verify_direct_feature_gpu_draw.mjs
          if($LASTEXITCODE -ne 0){throw 'GPU draw regression failed'}
          node tests/round14_gpu_compare/oneclick.mjs --self-test
          if($LASTEXITCODE -ne 0){throw 'GPU comparator self-test failed'}
      - name: RTX GPU hardware and full pixel A/B
        shell: powershell
        run: |
          $g=Get-CimInstance Win32_VideoController | Where-Object {$_.Name -match 'NVIDIA.*RTX'}
          if(-not $g){throw 'RTX GPU missing'}
          $g|Select-Object Name, DriverVersion|Format-List
          Set-Location $env:R16_PROJECT
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if($LASTEXITCODE -ne 0){throw 'RTX candidate A/B failed to capture frames'}
      - name: RTX corrected default round cap and join style
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $variant = Join-Path $env:GITHUB_WORKSPACE 'candidate-stroke-defaults'
          New-Item -ItemType Directory -Path $variant -Force | Out-Null
          Copy-Item -Path (Join-Path $env:R16_PROJECT '*') -Destination $variant -Recurse -Force
          if (Test-Path (Join-Path $variant 'RESULTS')) { Remove-Item (Join-Path $variant 'RESULTS') -Recurse -Force }
          node (Join-Path $env:GITHUB_WORKSPACE 'm5-gpu\apply_ol_stroke_defaults_variant.mjs') $variant
          if ($LASTEXITCODE -ne 0) { throw 'OL stroke style default patch failed' }
          Copy-Item m5-gpu/verify_round16_stroke_defaults.mjs (Join-Path $variant 'tests\verify_round16_stroke_defaults.mjs')
          Set-Location $variant
          node tests/verify_round16_stroke_defaults.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Default stroke test failed' }
          node tests/verify_round14_loop_and_style.mjs
          if ($LASTEXITCODE -ne 0) { throw '68 byte-parity test failed' }
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if ($LASTEXITCODE -ne 0) { throw 'OL round style parity A/B failed' }
      - name: RTX corrected styles plus subthreshold alpha preservation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $variant = Join-Path $env:GITHUB_WORKSPACE 'candidate-stroke-alpha'
          New-Item -ItemType Directory -Path $variant -Force | Out-Null
          Copy-Item -Path (Join-Path $env:R16_PROJECT '*') -Destination $variant -Recurse -Force
          if (Test-Path (Join-Path $variant 'RESULTS')) { Remove-Item (Join-Path $variant 'RESULTS') -Recurse -Force }
          node (Join-Path $env:GITHUB_WORKSPACE 'm5-gpu\apply_ol_stroke_defaults_variant.mjs') $variant
          if ($LASTEXITCODE -ne 0) { throw 'OL default patch failed' }
          node (Join-Path $env:GITHUB_WORKSPACE 'm5-gpu\apply_no_line_discard_variant.mjs') $variant
          if ($LASTEXITCODE -ne 0) { throw 'OL edge alpha patch failed' }
          Set-Location $variant
          node tests/verify_round14_loop_and_style.mjs
          if ($LASTEXITCODE -ne 0) { throw '68 byte-parity test failed' }
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if ($LASTEXITCODE -ne 0) { throw 'OL round plus alpha RTX A/B failed' }
      - name: Preserve strict pixel and GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round16-msaa-optin-rtx
          retention-days: 30
          if-no-files-found: warn
          path: |
            candidate/RESULTS/**
            candidate-stroke-defaults/RESULTS/**
            candidate-stroke-alpha/RESULTS/**
