name: UMAA ICD Studio - browser screenshots
on:
  push:
    branches: [mvp/umaa-icd-studio-20261124]
    paths:
      - 'umaa-icd-studio/**'
      - '.github/workflows/umaa-icd-screenshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: umaa-icd-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium and Korean fonts
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run browser smoke test and capture
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/umaa-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node ci/capture.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umaa-icd-screenshots
          path: umaa-icd-studio/screenshots/
          if-no-files-found: warn
