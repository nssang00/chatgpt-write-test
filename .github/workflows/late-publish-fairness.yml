name: Late-Publish Fairness Control
on:
  push:
    branches: [benchmark/vendor-threshold-matched-20261029]
    paths: [.github/workflows/late-publish-fairness.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    name: '${{ matrix.backend }} n=${{ matrix.nodes }} loss=${{ matrix.loss }} late-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {backend: cyclone, nodes: 30, loss: 10}
          - {backend: zenoh, nodes: 30, loss: 10}
          - {backend: multicast, nodes: 30, loss: 10}
          - {backend: hybrid, nodes: 30, loss: 10}
          - {backend: cyclone, nodes: 40, loss: 0}
          - {backend: zenoh, nodes: 40, loss: 0}
          - {backend: multicast, nodes: 40, loss: 0}
          - {backend: hybrid, nodes: 40, loss: 0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Set vendor packages and UDP max buffers
        run: |
          python -m pip install eclipse-zenoh==1.10.1 cyclonedds==11.0.1
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Match publication after 38 seconds of convergence opportunities
        run: |
          set -euo pipefail
          case '${{ matrix.backend }}' in
            zenoh|cyclone)
              sudo -E "$(which python)" bench/discovery/vendor_threshold_run.py \
                --backend '${{ matrix.backend }}' \
                --nodes '${{ matrix.nodes }}' --loss '${{ matrix.loss }}' \
                --warmup 38 --spread 4 --timeout 75 \
                --messages 2 --seed 1 --output late-publish-out
              ;;
            multicast|hybrid)
              sudo -E "$(which python)" bench/discovery/pubsub_run.py \
                --sizes '${{ matrix.nodes }}' --modes '${{ matrix.backend }}' \
                --losses '${{ matrix.loss }}' --discovery 38 --timeout 37 \
                --messages 2 --publishers '${{ matrix.nodes }}' \
                --publish-spread 4 --seeds 1 --repair-fanout 4 \
                --repair-interval 1.2 --output late-publish-out
              ;;
          esac
          cat late-publish-out/results.csv
      - name: Archive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'late-${{ matrix.backend }}-${{ matrix.nodes }}-loss-${{ matrix.loss }}'
          path: late-publish-out/
          if-no-files-found: warn
