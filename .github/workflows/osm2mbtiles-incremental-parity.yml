name: osm2mbtiles Incremental OSM Diff Full-Rebuild Parity

on:
  push:
    branches: [ci/osm2mbtiles-incremental-parity]
    paths:
      - '.github/workflows/osm2mbtiles-incremental-parity.yml'
      - 'experiments/osm2mbtiles/prototype/src/osm2mbtiles/vector_incremental.py'
      - 'experiments/osm2mbtiles/prototype/benchmarks/incremental_parity_e2e.py'
      - 'experiments/osm2mbtiles/prototype/tests/test_vector_incremental.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-append-vs-full-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL/PostGIS, osm2pgsql and MVT decoder
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql \
            python3-psycopg2 python3-pip python3-pytest curl ca-certificates
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
          osm2pgsql --version
          /usr/bin/python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["WORK"])
          j = json.loads((work / "incremental-results.json").read_text())
          assert j["parity"]["equal"] and j["delta"]["dirty_covers_all_changes"]
          assert j["delta"]["actual_changed_tiles"] > 0
          summary = (
              "# Incremental vs full rebuild\\n\\n"
              "Real osm2pgsql --slim create / --append on synthetic OSM XML/OSC.\\n\\n"
              "Full-rebuild semantic parity: **{}**. Dirty-tile coverage: **{}**.\\n\\n"
              "Changed: {}, expired: {}, uncovered: {}.\\n\\n"
              "Measured seconds: init {}, append {}, flush {}, fresh full render {}.\\n\\n"
              "PNG incrementals, upstream replication ingestion and nationwide RAM are not tested.\\n"
          ).format(
              j["parity"]["equal"], j["delta"]["dirty_covers_all_changes"],
              j["delta"]["actual_changed_tiles"], j["delta"]["expired_tiles"],
              len(j["delta"]["changed_not_expired"]),
              j["init_sec"], j["append_sec"], j["flush_sec"], j["reference_render_sec"])
          (work / "summary.md").write_text(summary)
          PY
          cat "$WORK/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo INCREMENTAL_FULL_REBUILD_PARITY_VERIFIED
      - name: Preserve results even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p incremental-evidence
          WORK="$RUNNER_TEMP/osm2mbtiles-incremental"
          for name in incremental-results.json summary.md initial.osm final.osm change.osc postgres.log; do
            cp "$WORK/$name" incremental-evidence/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-incremental-parity-evidence
          path: incremental-evidence/
          retention-days: 14
          if-no-files-found: warn
