name: Recovery Workbench v10.4 - strict nonresident NTFS recovery
on:
  push:
    branches:
      - ci/recovery-workbench-v10-4-nonresident
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-live-ntfs:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and extract v10.3 C++ source with Python xz reader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, pathlib, tarfile
          src = pathlib.Path("rw-v103-native.tar.xz")
          expected = "7a9ad8dcacc10028b9698c9d5e5a2d56be9826d173885915e4fbe71b63082170"
          actual = hashlib.sha256(src.read_bytes()).hexdigest()
          assert actual == expected, f"SHA256 mismatch {actual}"
          dest = pathlib.Path("rw-v103")
          dest.mkdir(exist_ok=True)
          with tarfile.open(src, mode="r:xz") as archive:
              files = archive.getmembers()
              assert files and all(f.isfile() and not f.name.startswith("/") and ".." not in pathlib.PurePosixPath(f.name).parts for f in files)
              archive.extractall(dest, filter="data")
          assert (dest / "src/recovery.cpp").is_file()
          print(f"Verified source payload and extracted {len(files)} C++ and test files")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Python source extraction failed with exit code $LASTEXITCODE" }
      - name: Apply fixed-VHD nonresident strict SHA regression
        shell: pwsh
        run: |
          python v104-rewrite-test.py
          if ($LASTEXITCODE -ne 0) { throw 'Failed to apply v10.4 diagnostic test modifications' }
      - name: Add read-only NTFS runlist diagnostic executable
        shell: pwsh
        run: |
          Copy-Item -LiteralPath v104-diag-runs.cpp -Destination rw-v103/src/diag_runs.cpp
          Add-Content -LiteralPath rw-v103/CMakeLists.txt -Value 'add_executable(ntfs_diag_runs src/diag_runs.cpp)'
          Add-Content -LiteralPath rw-v103/CMakeLists.txt -Value 'target_link_libraries(ntfs_diag_runs PRIVATE ntfs_recovery)'
      - name: MSVC x64 CMake configure
        shell: pwsh
        run: cmake -S rw-v103 -B rw-v103/build-ci -A x64 -DBUILD_TESTING=OFF
      - name: MSVC x64 Release compile with warning-as-error
        shell: pwsh
        run: cmake --build rw-v103/build-ci --config Release --parallel 2
      - name: Check VHD test script syntax
        shell: pwsh
        run: |
          foreach ($p in @('rw-v103/scripts/windows-live-ntfs-vhd-test.ps1','rw-v103/scripts/assert-windows-live-evidence.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Mount disposable NTFS VHD, delete files, raw-volume scan, extract, SHA256
        shell: pwsh
        working-directory: rw-v103
        run: ./scripts/windows-live-ntfs-vhd-test.ps1 -Engine 'build-ci/Release/ntfsrecover.exe'
      - name: Assert search, extraction, source protection, VHD detach
        shell: pwsh
        working-directory: rw-v103
        run: ./scripts/assert-windows-live-evidence.ps1
      - name: Upload live NTFS validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-v103-windows-vhd-ntfs-results
          if-no-files-found: warn
          path: |
            rw-v103/build-logs/
            rw-v103/build-ci/Testing/Temporary/
