name: Aplus V2 Watermark Repair Regression
on:
  push:
    branches: [experiment/a-plus-v2-incremental-repair-20261030]
    paths: [.github/workflows/a-plus-v2-watermark-regression.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {n: 20, m: 20, loss: 10, seed: 1, incremental: true}
          - {n: 100, m: 100, loss: 10, seed: 1, incremental: true}
          - {n: 200, m: 100, loss: 10, seed: 1, incremental: true}
          - {n: 200, m: 100, loss: 10, seed: 2, incremental: true}
          - {n: 200, m: 100, loss: 10, seed: 3, incremental: true}
          - {n: 200, m: 100, loss: 10, seed: 1, incremental: false}
    name: 'N=${{ matrix.n }} M=${{ matrix.m }} seed=${{ matrix.seed }} wm=${{ matrix.incremental }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build and environment
        run: |
          python -m py_compile bench/discovery/pubsub_node.py bench/discovery/pubsub_run.py
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Strict real netns test
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.n }}' in
            20) disc=6; timeout=35; spread=2 ;;
            100) disc=18; timeout=105; spread=12 ;;
            200) disc=27; timeout=125; spread=18 ;;
          esac
          args=()
          if [ '${{ matrix.incremental }}' = 'true' ]; then args+=(--incremental-repair --nack-batch-limit 32); fi
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
             --sizes '${{ matrix.n }}' --modes multicast --losses '${{ matrix.loss }}' \
             --v4 --messages '${{ matrix.m }}' --publishers '${{ matrix.n }}' \
             --payload-bytes 128 --publish-interval 0.06 \
             --discovery "$disc" --timeout "$timeout" --publish-spread "$spread" \
             --repair-fanout 6 --repair-interval 0.9 --seeds '${{ matrix.seed }}' \
             "${args[@]}" --output wm-results
          python - <<'PY'
          import json
          r=json.load(open('wm-results/results.json'))[0]
          print('WATERMARK_RESULT '+json.dumps(r))
          assert r['status'] in ('PASS','FAIL'),r
          assert r['reported']==r['nodes'],r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'watermark-N${{ matrix.n }}-m${{ matrix.m }}-seed${{ matrix.seed }}-inc${{ matrix.incremental }}'
          path: wm-results/
