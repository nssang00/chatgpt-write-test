name: M5 Round14 vs OL RTX Self-hosted ABBA
on:
  push:
    paths:
      - .github/workflows/m5-round14-selfhosted-abba.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ol-round14-rtx:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check RTX and locate previously downloaded Round14 project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            'C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare',
            'C:\Users\user\Downloads\M5_Round14_OL_GPU_Compare',
            (Join-Path $env:USERPROFILE 'Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare')
          )
          $source = $null
          foreach ($candidate in $roots) {
            if (Test-Path (Join-Path $candidate 'tests\round14_gpu_compare\oneclick.mjs')) {
              $source = $candidate
              break
            }
          }
          Write-Host "Runner: $env:RUNNER_NAME / $env:RUNNER_OS"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table | Out-String | Write-Host
          $gpu = @(Get-CimInstance Win32_VideoController | Where-Object { $_.Name -match 'NVIDIA.*RTX' })
          if ($gpu.Count -eq 0) { throw 'No NVIDIA RTX device detected. GPU results invalid.' }
          $smi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if ($smi) { & $smi.Source --query-gpu=name,driver_version,memory.total --format=csv }
          if (-not $source) {
            throw 'M5 Round14 project not found at prior Windows Downloads path. Copy the extracted M5_Round14_OL_GPU_Compare folder there.'
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'm5-round14-run'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $dest -Recurse -Force -ErrorAction Stop
          # Apply source-equivalent FIX01 only to the runner workspace copy.
          $olPage = Join-Path $dest 'tests\round14_gpu_compare\ol_stock.html'
          if ((Get-Content $olPage -Raw) -match 'function waitForPresentedOlFrame') {
            Write-Host 'FIX01 canvas capture already present in project'
          } else {
            node (Join-Path $env:GITHUB_WORKSPACE 'm5-gpu\round14_apply_capture_fix.mjs') $dest
            if ($LASTEXITCODE -ne 0) { throw 'Unable to apply OL/M5 screenshot fix' }
          }
          "M5_PROJECT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Prepared Round14 comparison at $dest"
      - name: CPU/HTML/GPU runner preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:M5_PROJECT
          node --version
          if (Test-Path 'tests/round14_gpu_compare/verify_async_paint.mjs') {
            node tests/round14_gpu_compare/verify_async_paint.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Async capture tests failed' }
          }
          node tests/round14_gpu_compare/oneclick.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Comparator selftest failed' }
          node tests/round14_gpu_compare/oneclick.mjs --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Missing benchmark assets / wrong OpenLayers version' }
      - name: RTX quick ABBA (2 cold samples per campaign)
        shell: powershell
        run: |
          Set-Location $env:M5_PROJECT
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if ($LASTEXITCODE -ne 0) { throw 'Quick RTX A/B did not complete. Inspect RESULTS artifact.' }
      - name: RTX full ABBA (5 cold samples per campaign)
        shell: powershell
        run: |
          Set-Location $env:M5_PROJECT
          node tests/round14_gpu_compare/oneclick.mjs --rounds=5 --headless
          if ($LASTEXITCODE -ne 0) { throw 'Full RTX A/B did not complete. Inspect RESULTS artifact.' }
      - name: RTX geometry vs style isolation (six diagnostic scenes)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'm5-round14-diag'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null
          Copy-Item -Path (Join-Path $env:M5_PROJECT '*') -Destination $diag -Recurse -Force
          node m5-gpu/apply_parity_isolation.mjs $diag
          if ($LASTEXITCODE -ne 0) { throw 'Could not isolate renderer/style paths' }
          Set-Location $diag
          node tests/round14_gpu_compare/oneclick.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic self test failed' }
          node tests/round14_gpu_compare/oneclick.mjs --rounds=1 --headless
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic GPU captures incomplete' }
      - name: Upload raw results, browser logs and PNG pixel differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-round14-ol-rtx-abba
          path: |
            m5-round14-run/RESULTS/**
            m5-round14-diag/RESULTS/**
          if-no-files-found: warn
          retention-days: 30
