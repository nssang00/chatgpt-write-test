name: Candidate Threshold PubSub Comparison
on:
  push:
    branches: [benchmark/vendor-threshold-matched-20261029]
    paths: [.github/workflows/candidate-threshold-comparison.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  comparison:
    name: '${{ matrix.mode }} n=${{ matrix.nodes }} loss=${{ matrix.loss }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [multicast, hybrid]
        nodes: [20, 30, 50, 80]
        loss: [0, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Equal socket buffer ceilings
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Run matched presence and all-publisher data workload
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes '${{ matrix.nodes }}' --modes '${{ matrix.mode }}' \
            --losses '${{ matrix.loss }}' --discovery 17 --timeout 31 \
            --messages 2 --publishers '${{ matrix.nodes }}' \
            --publish-spread 4 --seeds 1 --repair-fanout 4 \
            --repair-interval 1.2 --output candidate-out
          cat candidate-out/results.csv
      - name: Upload detailed data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'candidate-${{ matrix.mode }}-${{ matrix.nodes }}-loss-${{ matrix.loss }}'
          path: candidate-out/
          if-no-files-found: warn
