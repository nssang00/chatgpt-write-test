name: R82 RTX GPU timer and Windows display capability probe
on:
  push:
    branches: [ci/r82-gpu-present-probe-20261108]
    paths:
      - '.github/workflows/r82-gpu-present-probe.yml'
      - 'tools/run_r82_capability_probe.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olvt-r82-gpu-probe
  cancel-in-progress: false
jobs:
  capability:
    runs-on: [self-hosted, Windows, X64, m5-gpu]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout independent diagnostic harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout immutable R81 diagnostic source with unchanged R79 runtime
        uses: actions/checkout@v4
        with:
          repository: rydolabs/ol-vt-gl-boost
          ref: 5441ca870b94f89a89a1ac77ca8d30a252295571
          path: candidate
          persist-credentials: false
      - name: Collect GPU, desktop session, monitor and PresentMon prerequisites
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'harness/artifacts/r82-probe' | Out-Null
          $sha=(git -C candidate rev-parse HEAD).Trim()
          if($sha -ne '5441ca870b94f89a89a1ac77ca8d30a252295571'){throw "Unexpected renderer SHA: $sha"}
          $gpu=@(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution,CurrentRefreshRate)
          if(-not ($gpu | Where-Object {$_.Name -match 'NVIDIA.*RTX 5060 Ti'})){throw 'Physical RTX 5060 Ti not present'}
          $monitors=@(Get-CimInstance Win32_DesktopMonitor | Select-Object Name,Status,ScreenWidth,ScreenHeight,PNPDeviceID)
          $sessions=(& query session 2>&1 | Out-String)
          # Windows query.exe may return nonzero even when listing a valid active session.
          # Preserve its text but do not accidentally fail the entire diagnostics step.
          $global:LASTEXITCODE=0
          $presentCandidates=@('C:\Program Files\Intel\PresentMon\PresentMon.exe','C:\Program Files\PresentMon\PresentMon.exe')
          $pm=(Get-Command PresentMon.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if(-not $pm){$pm=$presentCandidates | Where-Object {Test-Path $_} | Select-Object -First 1}
          $data=[ordered]@{
            measured_at_utc=[DateTime]::UtcNow.ToString('o')
            candidate_sha=$sha
            runner_name=$env:RUNNER_NAME
            runner_os=$env:RUNNER_OS
            username=$env:USERNAME
            session_name=$env:SESSIONNAME
            gpu=$gpu
            monitors=$monitors
            sessions=$sessions
            presentmon_path=$pm
            presentmon_available=[bool]$pm
            note='Desktop availability and PresentMon capture have NOT been proven by this environment probe.'
          }
          $data | ConvertTo-Json -Depth 8 | Set-Content 'harness/artifacts/r82-probe/environment.json'
          $data | ConvertTo-Json -Depth 8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned candidate and browser driver
        run: |
          $ErrorActionPreference='Stop'
          Push-Location candidate
          try {
            npm ci --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
            if($LASTEXITCODE -ne 0){throw 'playwright install failed'}
          } finally {Pop-Location}
      - name: Probe asynchronous WebGL1 GPU timer query and headed Chrome
        env:
          R82_CANDIDATE_SHA: '5441ca870b94f89a89a1ac77ca8d30a252295571'
        run: |
          $ErrorActionPreference='Stop'
          node harness/tools/run_r82_capability_probe.mjs candidate harness/artifacts/r82-probe
          if($LASTEXITCODE -ne 0){throw 'Hardware WebGL capability probe failed; inspect artifact'}
      - name: Prepare 32 unique identical MVT fixtures for real 32-layer GPU tests
        run: |
          $ErrorActionPreference='Stop'
          Push-Location candidate
          try{
            npm run test:rtx:prepare
            if($LASTEXITCODE -ne 0){throw 'MVT fixtures unavailable'}
          }finally{Pop-Location}
      - name: Measure OL 10.10.0 and Boost WebGL GPU time with asynchronous disjoint timer queries
        env:
          R82_CANDIDATE_SHA: '5441ca870b94f89a89a1ac77ca8d30a252295571'
        run: |
          $ErrorActionPreference='Stop'
          node harness/tools/run_r82_gpu_scene_timers.mjs candidate harness/artifacts/r82-probe/gpu-scenes
          if($LASTEXITCODE -ne 0){throw 'R82 GPU-scene comparison failed; inspect raw artifacts'}
      - name: Obtain official portable PresentMon v2.6.0 with pinned SHA256
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe'
          $exe='harness/tools/PresentMon-2.6.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -MaximumRedirection 8
          $sha=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $expected='b2a706bc6ad475749e3b7e3409263aa1e6906d45bdcf993f6dbc0f660188f1af'
          if($sha -ne $expected){throw "PresentMon SHA256 mismatch $sha"}
          Write-Host "PRESENTMON_OFFICIAL_RELEASE_HASH_VERIFIED=$sha"
      - name: Capture Windows ETW presentation over 32-layer Stock versus Boost ABBA
        env:
          R82_CANDIDATE_SHA: '5441ca870b94f89a89a1ac77ca8d30a252295571'
        run: |
          $ErrorActionPreference='Stop'
          node harness/tools/run_r82_presentmon_compare.mjs candidate harness/artifacts/r82-probe/presentmon harness/tools/PresentMon-2.6.0-x64.exe
          if($LASTEXITCODE -ne 0){throw 'ETW capture failed; review raw results and preserve prior GPU timings'}
      - name: Preserve capability evidence even if not supported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r82-rtx5060ti-gpu-and-present-preflight
          path: harness/artifacts/r82-probe/**
          retention-days: 30
          if-no-files-found: warn
