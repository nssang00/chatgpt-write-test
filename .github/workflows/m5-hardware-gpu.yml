name: M5 GPU Layer Feature Bench
on:
  workflow_dispatch:
    inputs:
      project_archive_url:
        description: "HTTPS ZIP URL of M5 4-stage test project (optional if m5-ci/project.zip is committed)"
        type: string
        required: false
      run_full:
        description: "Include full 4/8-layer and 8-style benchmark (longer)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: m5-hardware-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gpu-render:
    name: Real Windows GPU / layer and feature gates
    runs-on: [self-hosted, Windows, X64, m5-gpu]
    timeout-minutes: 90
    env:
      CHROME_HEADLESS: "0"
      SOURCE_URL: ${{ inputs.project_archive_url || vars.M5_PROJECT_ARCHIVE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate package and installed browser (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'm5-ci-run-project'
          New-Item -Type Directory -Path $dest -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'm5-project.zip'
          if (Test-Path 'm5-ci/project.zip') {
            Copy-Item 'm5-ci/project.zip' $archive -Force
            Expand-Archive $archive -DestinationPath $dest -Force
          } elseif (Test-Path 'm5-ci/project') {
            Copy-Item 'm5-ci/project/*' $dest -Recurse -Force
          } elseif ($env:SOURCE_URL) {
            if (-not $env:SOURCE_URL.StartsWith('https://')) { throw 'Project URL must be HTTPS' }
            Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile $archive -MaximumRedirection 5
            Expand-Archive $archive -DestinationPath $dest -Force
          } else {
            throw 'M5 source/fixtures missing. Commit m5-ci/project.zip or pass project_archive_url.'
          }
          $project = Get-ChildItem $dest -Filter diag-app.js -File -Recurse | Select-Object -First 1
          if (-not $project) { throw 'diag-app.js missing from archive' }
          $root = $project.Directory.FullName
          foreach ($f in @('package.json','run-m5-ci-render-gate.mjs','run-m5-uninstrumented-benchmark.mjs')) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "Required file missing: $f" }
          }
          if (-not (Test-Path (Join-Path $root 'our-renderer'))) { throw 'M5 source missing' }
          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          )
          $chrome = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Hardware GPU runner has no installed Chrome/Edge' }
          "PROJECT_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CHROME_PATH=$chrome" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "M5 project: $root ; Chromium: $chrome"
          if (Test-Path $archive) { Get-FileHash $archive -Algorithm SHA256 }
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Stage 0 - M5 regression tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          npm run test:regression
          if ($LASTEXITCODE -ne 0) { throw 'Source regression failed' }
      - name: Stage 1 + 4 - GPU rendered pixels per feature/layer/style
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          node run-m5-ci-render-gate.mjs --gpu-matrix
          if ($LASTEXITCODE -ne 0) { throw 'GPU per-layer / per-feature render gate failed' }
      - name: Stage 2 + 3 - Hardware GPU OL vs M5 uninstrumented benchmark
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          node run-m5-uninstrumented-benchmark.mjs --suite=full --rounds=5
          if ($LASTEXITCODE -ne 0) { throw 'Hardware GPU OL/M5 benchmark invalid' }
      - name: Normal blending pixel-determinism diagnostic (not a timing score)
        shell: pwsh
        if: success()
        run: |
          Set-Location $env:PROJECT_ROOT
          node run-m5-same-context.mjs --rounds=5
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Pixel determinism diagnostic did not pass; see artifact. Performance is NOT visual equivalence.' }
      - name: Upload real GPU screenshots and performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-hardware-gpu-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            m5-ci-run-project/**/m5-render-smoke-results/**
            m5-ci-run-project/**/m5-ci-benchmark-results/**
            m5-ci-run-project/**/visual-same-context-results/**
