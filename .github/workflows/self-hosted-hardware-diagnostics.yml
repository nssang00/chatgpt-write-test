name: Self-hosted OS GPU CUDA diagnostics
on:
  push:
    paths:
      - .github/workflows/self-hosted-hardware-diagnostics.yml
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: OS GPU CUDA diagnostics on Windows
        shell: powershell
        run: |
          Write-Output "=== OS ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Write-Output "=== GPU ==="
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM | Format-List
          Write-Output "=== NVIDIA SMI ==="
          $smi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if (-not $smi) {
            $p = "$env:ProgramFiles\NVIDIA Corporation\NVSMI\nvidia-smi.exe"
            if (Test-Path $p) { $smi = $p }
          }
          if ($smi) { & $smi } else { Write-Output "nvidia-smi unavailable" }
          Write-Output "=== CUDA Toolkit ==="
          $nvcc = Get-Command nvcc.exe -ErrorAction SilentlyContinue
          if ($nvcc) { & $nvcc.Source --version } else { Write-Output "nvcc unavailable in PATH" }
          Get-ChildItem Env:CUDA* -ErrorAction SilentlyContinue | Format-Table -AutoSize
