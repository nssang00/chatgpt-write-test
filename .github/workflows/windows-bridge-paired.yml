name: Windows Bridge Paired Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-bridge-paired.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/integration/cef/**'
      - 'tests/integration/webview2/**'
      - 'tools/run_bridge_benchmark.py'
      - 'tools/compare_bridge_benchmarks.py'

permissions:
  contents: read

jobs:
  paired:
    name: windows-2022-cef-webview2-paired
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Windows CEF cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/cef/windows/archive
            .cache/cef/windows/extracted
          key: cef-windows64-144.0.36-g78619fd-runtime-v2
          restore-keys: |
            cef-windows64-144.0.36-g78619fd
      - name: Download pinned Windows CEF
        shell: pwsh
        timeout-minutes: 20
        run: |
          $cef = & ./tools/bootstrap_windows.ps1 | Select-Object -Last 1
          "CEF_ROOT=$cef" >> $env:GITHUB_ENV
      - name: Download pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory .cache/webview2 -NonInteractive
          $sdk = (Resolve-Path .cache/webview2/Microsoft.Web.WebView2.1.0.4258.31).Path
          "WEBVIEW2_ROOT=$sdk" >> $env:GITHUB_ENV
      - name: Build both engines on SAME runner
        shell: pwsh
        run: |
          cmake -S tests/integration/cef -B build/cef "-DCEF_ROOT=$env:CEF_ROOT"
          cmake --build build/cef --config Release --parallel 4
          cmake -S tests/integration/webview2 -B build/webview2 "-DWEBVIEW2_ROOT=$env:WEBVIEW2_ROOT"
          cmake --build build/webview2 --config Release --parallel 4
      - name: Native-to-JS SharedBuffer probe (experimental)
        shell: pwsh
        run: |
          & build/webview2/bin/nativeweb_webview2_sharedbuffer_probe.exe |
            Tee-Object -FilePath build/sharedbuffer-probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize same-page SharedBuffer vs Base64 transport
        shell: pwsh
        run: |
          python tools/summarize_sharedbuffer_probe.py --log build/sharedbuffer-probe.log --output-dir build/bridge-paired
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three paired rounds, alternating engine order
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $orders = @(
            @('cef','webview2'),
            @('webview2','cef'),
            @('cef','webview2')
          )
          for ($i=0; $i -lt $orders.Count; $i++) {
            $round = $i + 1
            foreach ($engine in $orders[$i]) {
              $out = "build/bridge-paired/round-$round-$engine"
              python tools/run_bridge_benchmark.py --engine $engine --build-dir "build/$engine" --output-dir $out --warmup 100 --samples 300 --timeout 130
              if ($LASTEXITCODE -ne 0) { throw "Bridge benchmark failed: $engine round $round" }
            }
          }
      - name: Summarize matched-runner sample pairs
        shell: pwsh
        run: |
          python tools/compare_bridge_benchmarks.py --root build/bridge-paired --rounds 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw samples and paired comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xytron-windows-cef-webview2-paired-${{ github.sha }}
          path: |
            build/bridge-paired/**
            build/sharedbuffer-probe.log
          if-no-files-found: warn
