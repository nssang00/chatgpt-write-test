name: Round18 Layer RGBA8 FBO and Tile Scissor RTX
on:
  push:
    paths:
      - .github/workflows/m5-round18-layer-fbo-rtx.yml
      - m5-gpu/apply_round18_layer_fbo.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare scissor and per-layer FBO variants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare'
          if(-not (Test-Path (Join-Path $source 'tests\round14_gpu_compare\oneclick.mjs'))){throw 'Round14 source missing'}
          $gpu=Get-CimInstance Win32_VideoController|Where-Object{$_.Name -match 'NVIDIA.*RTX'}
          if(-not $gpu){throw 'NVIDIA RTX missing'}
          foreach($kind in @('scissor','layer-fbo','stroke-unclipped')){
            $dest=Join-Path $env:GITHUB_WORKSPACE ('r18-'+$kind)
            New-Item -ItemType Directory -Path $dest -Force|Out-Null
            Copy-Item (Join-Path $source '*') $dest -Recurse -Force
            if(Test-Path (Join-Path $dest 'RESULTS')){Remove-Item (Join-Path $dest 'RESULTS') -Recurse -Force}
            $patches=@('round14_apply_capture_fix.mjs','apply_backend_msaa_optin.mjs','apply_ol_stroke_defaults_variant.mjs','apply_no_line_discard_variant.mjs','apply_round18_tile_scissor.mjs')
            if($kind -ne 'scissor'){$patches+=('apply_round18_layer_fbo.mjs')}
            if($kind -eq 'stroke-unclipped'){$patches+=('apply_round18_polygon_stroke_noclip.mjs')}
            foreach($patch in $patches){
              node --check (Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch))
              if($LASTEXITCODE -ne 0){throw "Syntax error $patch"}
              node (Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch)) $dest
              if($LASTEXITCODE -ne 0){throw "Patch error $patch"}
            }
            Push-Location $dest
            node tests/verify_round14_loop_and_style.mjs
            if($LASTEXITCODE -ne 0){throw "68 packet parity failed $kind"}
            node tests/verify_direct_feature_gpu_draw.mjs
            if($LASTEXITCODE -ne 0){throw "GPU draw regression failed $kind"}
            node tests/round14_gpu_compare/oneclick.mjs --self-test
            if($LASTEXITCODE -ne 0){throw "GPU comparator selftest failed $kind"}
            Pop-Location
          }
      - name: Scissor-only real RTX A/B
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'r18-scissor')
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if($LASTEXITCODE -ne 0){throw 'Scissor RTX test failed'}
      - name: Scissor plus per-layer RGBA8 real RTX A/B
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'r18-layer-fbo')
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if($LASTEXITCODE -ne 0){throw 'FBO RTX test failed'}
      - name: RTX no CPU polygon stroke clipping with tile scissor and FBO
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'r18-stroke-unclipped')
          node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
          if($LASTEXITCODE -ne 0){throw 'RTX no-clip stroke run failed'}
      - name: Preserve performance, canvases and RGBA8 diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-layer-fbo-rtx
          if-no-files-found: warn
          retention-days: 30
          path: |
            r18-scissor/RESULTS/**
            r18-layer-fbo/RESULTS/**
            r18-stroke-unclipped/RESULTS/**
      - name: Strict acceptance of actual rendered RGBA8 equality
        shell: powershell
        run: |
          $dir=Join-Path $env:GITHUB_WORKSPACE 'r18-stroke-unclipped\RESULTS'
          $f=Get-ChildItem $dir -Recurse -Filter manifest.json|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if(-not $f){throw 'No GPU manifest'}
          $m=Get-Content $f.FullName -Raw|ConvertFrom-Json
          $m.rows|Format-Table scene,olMedianMs,m5MedianMs,pixelDiffRuns,pixelExact
          if(-not $m.complete){throw 'RTX A/B incomplete'}
          if(-not $m.pixelParityAll){throw 'RGBA8 all-scenes parity FAIL'}
          if(-not $m.withinRendererStable){throw 'Nondeterministic renderer output'}
