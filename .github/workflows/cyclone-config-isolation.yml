name: Cyclone DDS SPDP vs Interface Data-Path Isolation
on:
  push:
    branches: [diagnostic/cyclone-discovery-10nodes-20261029]
    paths: [.github/workflows/cyclone-config-isolation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    name: 'N=${{ matrix.nodes }} ${{ matrix.config }} seed=${{ matrix.seed }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {nodes: 10, config: eth0, seed: 2}
          - {nodes: 10, config: eth0, seed: 3}
          - {nodes: 10, config: eth0-fastspdp, seed: 2}
          - {nodes: 10, config: eth0-fastspdp, seed: 3}
          - {nodes: 10, config: auto-fastspdp, seed: 1}
          - {nodes: 10, config: auto-fastspdp, seed: 2}
          - {nodes: 10, config: auto-fastspdp, seed: 3}
          - {nodes: 10, config: eth0-multicast, seed: 1}
          - {nodes: 10, config: eth0-multicast, seed: 2}
          - {nodes: 10, config: eth0-250ms, seed: 1}
          - {nodes: 20, config: eth0-fastspdp, seed: 1}
          - {nodes: 20, config: auto-fastspdp, seed: 1}
          - {nodes: 40, config: auto-fastspdp, seed: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Cyclone DDS 11.0.1
        run: python -m pip install cyclonedds==11.0.1
      - name: Controlled Cyclone config experiment
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/cyclone_diag_run.py \
            --nodes '${{ matrix.nodes }}' --batch 256 \
            --config '${{ matrix.config }}' \
            --seed '${{ matrix.seed }}' --timeout 27 \
            --output cyclone-config-out
          cat cyclone-config-out/summary.json
      - name: Keep endpoint and sample timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'cyclone-config-${{ matrix.nodes }}-${{ matrix.config }}-seed-${{ matrix.seed }}'
          path: cyclone-config-out/
          if-no-files-found: warn
