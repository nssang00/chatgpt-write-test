name: CompanyWebView P0-1 / Windows private-kit gate
on:
  push:
    branches:
      - verify/cwv-p01-windows-20261029
    paths:
      - .github/workflows/cwv-p01-private-windows.yml
permissions:
  contents: read
concurrency:
  group: cwv-p01-safe-windows
  cancel-in-progress: false
jobs:
  hosted-p01:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify hosted Windows toolchain without private source
        shell: pwsh
        run: |
          ./companywebview/ci/Test-WindowsToolchain.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows toolchain check failed' }
      - name: Verify private P0-1 archive and perform fail-closed compiles
        shell: pwsh
        env:
          KIT_URL: ${{ secrets.CWV_KIT_URL }}
          KIT_SHA: ${{ vars.CWV_KIT_SHA256 }}
          WEBVIEW2_URL: ${{ vars.CWV_WEBVIEW2_SDK_URL }}
          WEBVIEW2_SHA: ${{ vars.CWV_WEBVIEW2_SDK_SHA256 }}
          CEF_URL: ${{ vars.CWV_CEF_SDK_URL }}
          CEF_SHA: ${{ vars.CWV_CEF_SDK_SHA256 }}
          UNITY_URL: ${{ vars.CWV_UNITY_API_URL }}
          UNITY_SHA: ${{ vars.CWV_UNITY_API_SHA256 }}
        run: |
          $ErrorActionPreference='Stop'
          $report=[ordered]@{
            status='BLOCKED'
            stage='P0-1 exact archive / MSVC / UPM verification'
            verifiedExactP01Archive=$false
            managedCompiled=$false
            webView2NativeCompiled=$false
            cefNativeCompiled=$false
            upmAssembled=$false
            unityPlayerExecuted=$false
            gpuVerified=$false
            failedGate='prerequisites'
          }
          $reportPath=Join-Path $env:RUNNER_TEMP 'cwv-p01-safe.json'
          $logPath=Join-Path $env:RUNNER_TEMP 'cwv-p01-private-build.log'
          try {
            $expected='5a6e9857031325b08571762e0fe32123cbf62944d9b8199d435564a9dba43d1c'
            $report.failedGate='exact_p01_kit'
            if ($env:KIT_SHA -ine $expected -or [string]::IsNullOrWhiteSpace($env:KIT_URL)) {
              throw 'The exact P0-1 archive is not staged in the private kit configuration'
            }
            & ./companywebview/ci/Fetch-VerifiedKit.ps1 -Url $env:KIT_URL -Sha256 $env:KIT_SHA -Destination "$env:RUNNER_TEMP/cwv-private-p01" *> $logPath
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($env:CWV_KIT_ROOT)) {
              throw 'Private kit retrieval failed'
            }
            $report.verifiedExactP01Archive=$true
            $report.failedGate='managed_compile'
            Push-Location $env:CWV_KIT_ROOT
            try {
              dotnet build Validation/AutoBuildCompile.csproj -c Release -v:q *>> $logPath
              if ($LASTEXITCODE -ne 0) { throw 'Editor C# compilation failed' }
              dotnet build Validation/ProductPanelCompile.csproj -c Release -v:q *>> $logPath
              if ($LASTEXITCODE -ne 0) { throw 'Panel C# compilation failed' }
              $report.managedCompiled=$true

              $report.failedGate='sdk_variables'
              foreach($v in @($env:WEBVIEW2_URL,$env:WEBVIEW2_SHA,$env:CEF_URL,$env:CEF_SHA,$env:UNITY_URL,$env:UNITY_SHA)){
                if ([string]::IsNullOrWhiteSpace($v)) { throw 'An SDK pin is missing' }
              }
              $report.failedGate='webview2_msvc'
              & ./CI/Run-V8HostedCompileGates.ps1 -OutputJson "$env:RUNNER_TEMP/cwv-p01-v8-compile.json" -WebView2SdkUrl $env:WEBVIEW2_URL -WebView2SdkSha256 $env:WEBVIEW2_SHA *>> $logPath
              $gate=Get-Content "$env:RUNNER_TEMP/cwv-p01-v8-compile.json" -Raw | ConvertFrom-Json
              if ($gate.status -ne 'PASS' -or -not $gate.webView2V8NativeCompiled) { throw 'WebView2 MSVC gate failed' }
              $report.webView2NativeCompiled=$true

              $report.failedGate='cef_sdk'
              & ./CI/Fetch-VerifiedSdk.ps1 -Url $env:CEF_URL -Sha256 $env:CEF_SHA -Destination "$env:RUNNER_TEMP/cwv-cef" -Kind CEF *>> $logPath
              & ./CI/Fetch-VerifiedSdk.ps1 -Url $env:UNITY_URL -Sha256 $env:UNITY_SHA -Destination "$env:RUNNER_TEMP/cwv-unity-api" -Kind UNITY_API *>> $logPath

              $report.failedGate='cef_msvc'
              & ./Build-Native-Rpc.ps1 -CefRoot $env:CWV_CEF_ROOT -UnityPluginApi $env:CWV_UNITY_PLUGIN_API -OutputStage "$env:RUNNER_TEMP/cwv-native-stage" -BuildDir "$env:RUNNER_TEMP/cwv-native-build" *>> $logPath
              if (-not (Test-Path "$env:RUNNER_TEMP/cwv-native-stage/rpc-bridge-build.json")) { throw 'CEF build evidence missing' }
              $report.cefNativeCompiled=$true

              $report.failedGate='upm_assembly'
              & ./Build-UnityProduct.ps1 -CefStage "$env:RUNNER_TEMP/cwv-native-stage" -SecureWebView2V8Dll ./CompanyWebView2SecureV8.dll -OutputRoot "$env:RUNNER_TEMP/cwv-upm" *>> $logPath
              $pkg=Join-Path $env:RUNNER_TEMP 'cwv-upm/com.company.webview'
              foreach($file in @('package.json','Runtime/Plugins/x86_64/CompanyWebView2SecureV8.dll','Runtime/Plugins/x86_64/CompanyWebViewCefTextureProbe.dll')){
                if (-not (Test-Path (Join-Path $pkg $file) -PathType Leaf)) { throw 'UPM required output missing' }
              }
              $report.upmAssembled=$true
              $report.status='HOSTED_P01_BUILD_PASS'
              $report.failedGate=''
            } finally { Pop-Location }
          } catch {
            # Never emit private build output, paths, URLs or source excerpts to a public Actions log.
            Write-Host ("P0-1 gate blocked/failed at: " + $report.failedGate)
            $report.status='BLOCKED_OR_FAIL'
          } finally {
            $report | ConvertTo-Json -Depth 4 | Set-Content $reportPath -Encoding utf8
            Remove-Item $logPath -Force -ErrorAction SilentlyContinue
          }
          if ($report.status -ne 'HOSTED_P01_BUILD_PASS') { exit 1 }
      - name: Upload safe status only (no private source or logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwv-p01-safe-hosted-evidence
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/cwv-p01-safe.json
