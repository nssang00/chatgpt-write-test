name: Self-hosted runner smoke test
on:
  push:
    paths:
      - .github/workflows/self-hosted-smoke-test.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Basic Windows runner test
        shell: powershell
        run: |
          Write-Output "SELF_HOSTED_RUNNER_OK"
          Write-Output "Runner name: $env:RUNNER_NAME"
          Write-Output "Runner OS: $env:RUNNER_OS"
          [System.Environment]::OSVersion.VersionString
          Write-Output "Smoke test completed"
