name: Vendor Discovery and PubSub Failure Boundary
on:
  push:
    branches: [benchmark/vendor-threshold-matched-20261029]
    paths: [.github/workflows/vendor-threshold-boundary.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    name: '${{ matrix.backend }} n=${{ matrix.nodes }} loss=${{ matrix.loss }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {backend: cyclone, nodes: 10, loss: 0}
          - {backend: cyclone, nodes: 20, loss: 0}
          - {backend: cyclone, nodes: 30, loss: 0}
          - {backend: cyclone, nodes: 50, loss: 0}
          - {backend: cyclone, nodes: 80, loss: 0}
          - {backend: zenoh, nodes: 10, loss: 0}
          - {backend: zenoh, nodes: 20, loss: 0}
          - {backend: zenoh, nodes: 30, loss: 0}
          - {backend: zenoh, nodes: 50, loss: 0}
          - {backend: zenoh, nodes: 80, loss: 0}
          - {backend: cyclone, nodes: 20, loss: 10}
          - {backend: cyclone, nodes: 30, loss: 10}
          - {backend: cyclone, nodes: 50, loss: 10}
          - {backend: zenoh, nodes: 20, loss: 10}
          - {backend: zenoh, nodes: 30, loss: 10}
          - {backend: zenoh, nodes: 50, loss: 10}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned vendor implementations
        run: |
          python -m pip install eclipse-zenoh==1.10.1 cyclonedds==11.0.1
          python -c "import zenoh, cyclonedds; print('vendor imports OK')"
      - name: Raise UDP receive limits
        run: |
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Common cold-start, presence, and PubSub load
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/vendor_threshold_run.py \
            --backend '${{ matrix.backend }}' \
            --nodes '${{ matrix.nodes }}' --loss '${{ matrix.loss }}' \
            --warmup 17 --spread 4 --timeout 48 --messages 2 \
            --seed 1 --output threshold-out
          cat threshold-out/results.csv
      - name: Upload all per-node evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'threshold-${{ matrix.backend }}-${{ matrix.nodes }}-loss-${{ matrix.loss }}'
          path: threshold-out/
          if-no-files-found: warn
