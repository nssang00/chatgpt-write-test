name: osm2pgsql-version-test
on:
  workflow_dispatch:
  push:
    branches: [ci/osm2mbtiles-native-test]
    paths: ['.github/workflows/osm2pgsql-version-test.yml']
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream 22.04 installed version and private build
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y osm2pgsql
          osm2pgsql --version
          bash experiments/osm2mbtiles/prototype/tools/ensure_osm2pgsql.sh "$RUNNER_TEMP/osm2mbtiles"
