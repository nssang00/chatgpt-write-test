name: Cito QUIC

on:
  push:
    branches: [cito-dev]
    paths:
      - "cito/CMakeLists.txt"
      - "cito/include/cito/data_packet.hpp"
      - "cito/include/cito/detail/transport_selector.hpp"
      - "cito/include/cito/detail/request_reply_core.hpp"
      - "cito/include/cito/detail/request_transport.hpp"
      - "cito/include/cito/detail/request_session_lifecycle.hpp"
      - "cito/include/cito/detail/msquic_request_session_manager.hpp"
      - "cito/include/cito/detail/posix_udp_control_manager.hpp"
      - "cito/include/cito/detail/linux_request_runtime_driver.hpp"
      - "cito/src/msquic_request_session_manager.cpp"
      - "cito/src/posix_udp_control_manager.cpp"
      - "cito/src/linux_request_runtime_driver.cpp"
      - "cito/tests/net/quic_msquic_node.cpp"
      - "cito/tests/net/quic_public_request_node.cpp"
      - "cito/tests/net/quic_request_node.cpp"
      - "cito/tests/transport_selector_test.cpp"
      - ".github/workflows/cito-quic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cito-quic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msquic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16

    steps:
      - uses: actions/checkout@v4

      # The runtime package intentionally does not provide an unversioned
      # development link/header surface. Pin headers to the same release.
      - name: Install MsQuic 2.6.1
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          sudo curl -fsSL https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/msquic.h -o /usr/local/include/msquic.h
          sudo curl -fsSL https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/msquic_posix.h -o /usr/local/include/msquic_posix.h
          sudo curl -fsSL https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/quic_sal_stub.h -o /usr/local/include/quic_sal_stub.h
          MSQUIC_SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$MSQUIC_SO"
          sudo ln -sf "$MSQUIC_SO" /usr/local/lib/libmsquic.so
          sudo ldconfig

      - name: Configure and build QUIC smoke
        run: |
          cmake -S cito -B build-quic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCITO_ENABLE_MSQUIC=ON
          cmake --build build-quic --target cito_quic_msquic_node cito_quic_request_node cito_quic_public_request_node -j2

      - name: Generate test certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout quic-key.pem -out quic-cert.pem -subj "/CN=10.202.0.12"

      - name: Two-node QUIC stream and datagram smoke
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            sudo ip netns del cito-quic-c 2>/dev/null || true
            sudo ip netns del cito-quic-s 2>/dev/null || true
            sudo ip link del br-quic 2>/dev/null || true
          }
          trap cleanup EXIT
          cleanup

          sudo ip link add br-quic type bridge
          sudo ip link set br-quic up

          add_node() {
            local ns="$1"
            local host="$2"
            local peer="$3"
            local addr="$4"

            sudo ip netns add "$ns"
            sudo ip link add "$host" type veth peer name "$peer"
            sudo ip link set "$host" master br-quic
            sudo ip link set "$host" up
            sudo ip link set "$peer" netns "$ns"
            sudo ip netns exec "$ns" ip link set lo up
            sudo ip netns exec "$ns" ip link set "$peer" name eth0
            sudo ip netns exec "$ns" ip addr add "$addr"/24 dev eth0
            sudo ip netns exec "$ns" ip link set eth0 up
          }

          add_node cito-quic-c veth-qc veth-qc-ns 10.202.0.11
          add_node cito-quic-s veth-qs veth-qs-ns 10.202.0.12

          BIN="$GITHUB_WORKSPACE/build-quic/cito_quic_msquic_node"

          sudo ip netns exec cito-quic-s "$BIN" server 4433 \
            "$GITHUB_WORKSPACE/quic-cert.pem" "$GITHUB_WORKSPACE/quic-key.pem" \
            >quic-server.log 2>&1 &
          SERVER_PID=$!

          sleep 0.5

          client_status=0
          sudo ip netns exec cito-quic-c "$BIN" client 10.202.0.12 4433 \
            >quic-client.log 2>&1 || client_status=$?

          server_status=0
          wait "$SERVER_PID" || server_status=$?

          echo "=== QUIC client ==="
          cat quic-client.log
          echo "=== QUIC server ==="
          cat quic-server.log

          test "$client_status" -eq 0
          test "$server_status" -eq 0
          grep -q "quic_client stream=1 datagram=1" quic-client.log
          grep -q "quic_server stream=1 datagram=1" quic-server.log

          RQBIN="$GITHUB_WORKSPACE/build-quic/cito_quic_request_node"

          sudo ip netns exec cito-quic-s "$RQBIN" server 4434 \
            "$GITHUB_WORKSPACE/quic-cert.pem" "$GITHUB_WORKSPACE/quic-key.pem" \
            >quic-request-server.log 2>&1 &
          REQUEST_SERVER_PID=$!

          sleep 0.3

          request_client_status=0
          sudo ip netns exec cito-quic-c "$RQBIN" client 10.202.0.12 4434 \
            >quic-request-client.log 2>&1 || request_client_status=$?

          request_server_status=0
          wait "$REQUEST_SERVER_PID" || request_server_status=$?

          echo "=== QUIC request client ==="
          cat quic-request-client.log
          echo "=== QUIC request server ==="
          cat quic-request-server.log

          test "$request_client_status" -eq 0
          test "$request_server_status" -eq 0
          grep -q "quic_request_client request=1 reply=1 loop=1" quic-request-client.log
          grep -q "quic_request_server request=1 reply=1 loop=1" quic-request-server.log

          PUBBIN="$GITHUB_WORKSPACE/build-quic/cito_quic_public_request_node"

          sudo ip netns exec cito-quic-s "$PUBBIN" server 4435 47350 \
            10.202.0.11 47320 \
            "$GITHUB_WORKSPACE/quic-cert.pem" "$GITHUB_WORKSPACE/quic-key.pem" \
            >quic-public-server.log 2>&1 &
          PUBLIC_SERVER_PID=$!

          sleep 0.3

          public_client_status=0
          sudo ip netns exec cito-quic-c "$PUBBIN" client 47320 \
            >quic-public-client.log 2>&1 || public_client_status=$?

          public_server_status=0
          wait "$PUBLIC_SERVER_PID" || public_server_status=$?

          echo "=== QUIC public request client ==="
          cat quic-public-client.log
          echo "=== QUIC public request server ==="
          cat quic-public-server.log

          test "$public_client_status" -eq 0
          test "$public_server_status" -eq 0
          grep -q "quic_public_request_client result=42 lazy=1 deadline=1 discovery=udp run=context" quic-public-client.log
          grep -q "quic_public_request_server handler=1 reply=1 discovery=udp run=context" quic-public-server.log


      - name: Configure sanitized public Request/Reply smoke
        run: |
          cmake -S cito -B build-quic-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCITO_ENABLE_MSQUIC=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-quic-san --target cito_quic_public_request_node -j2

      - name: Sanitized public Request/Reply smoke
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            sudo ip netns del cito-quic-san-c 2>/dev/null || true
            sudo ip netns del cito-quic-san-s 2>/dev/null || true
            sudo ip link del br-quic-san 2>/dev/null || true
          }
          trap cleanup EXIT
          cleanup

          sudo ip link add br-quic-san type bridge
          sudo ip link set br-quic-san up

          add_node() {
            local ns="$1"
            local host="$2"
            local peer="$3"
            local addr="$4"

            sudo ip netns add "$ns"
            sudo ip link add "$host" type veth peer name "$peer"
            sudo ip link set "$host" master br-quic-san
            sudo ip link set "$host" up
            sudo ip link set "$peer" netns "$ns"
            sudo ip netns exec "$ns" ip link set lo up
            sudo ip netns exec "$ns" ip link set "$peer" name eth0
            sudo ip netns exec "$ns" ip addr add "$addr"/24 dev eth0
            sudo ip netns exec "$ns" ip link set eth0 up
          }

          add_node cito-quic-san-c veth-qsc veth-qsc-ns 10.203.0.11
          add_node cito-quic-san-s veth-qss veth-qss-ns 10.203.0.12

          BIN="$GITHUB_WORKSPACE/build-quic-san/cito_quic_public_request_node"
          SAN_ENV="ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"

          sudo ip netns exec cito-quic-san-s env $SAN_ENV "$BIN" server 4436 47360 \
            10.203.0.11 47330 \
            "$GITHUB_WORKSPACE/quic-cert.pem" "$GITHUB_WORKSPACE/quic-key.pem" \
            >quic-public-san-server.log 2>&1 &
          SERVER_PID=$!

          sleep 0.3

          client_status=0
          sudo ip netns exec cito-quic-san-c env $SAN_ENV "$BIN" client 47330 \
            >quic-public-san-client.log 2>&1 || client_status=$?

          server_status=0
          wait "$SERVER_PID" || server_status=$?

          echo "=== sanitized QUIC public request client ==="
          cat quic-public-san-client.log
          echo "=== sanitized QUIC public request server ==="
          cat quic-public-san-server.log

          test "$client_status" -eq 0
          test "$server_status" -eq 0
          grep -q "quic_public_request_client result=42 lazy=1 deadline=1 discovery=udp run=context" quic-public-san-client.log
          grep -q "quic_public_request_server handler=1 reply=1 discovery=udp run=context" quic-public-san-server.log
