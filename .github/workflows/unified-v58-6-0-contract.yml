name: Unity WebView v58.6.0 preview contract (NO UNITY RUNTIME)
on:
  push:
    branches:
      - feature/unified-unity-v58-6-0-integration-preview
      - feature/unified-unity-v58-6-0-dual-player-oneclick
      - feature/unified-unity-v58-6-0-auto-evidence
  workflow_dispatch:

jobs:
  source-contract-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dotnet SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pinned CEF no-prompt auto-bootstrap source guard
        shell: pwsh
        run: |
          python Integration/UnityUnified-v58.6.0-preview/Validation/verify_cef_bootstrap.py
          if($LASTEXITCODE -ne 0){throw 'Pinned CEF bootstrap source check failed'}
      - name: PowerShell CEF bootstrap syntax and offline stage-discovery test
        shell: powershell
        run: |
          $helper=(Resolve-Path 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Ensure-CefRuntime.ps1').Path
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($helper,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw "CEF auto-bootstrap PowerShell syntax errors: $errors"}
          $folder=Join-Path $env:RUNNER_TEMP 'cef-stage-fixture'
          $native=Join-Path $folder 'native\Release'
          $runtime=Join-Path $folder 'runtime\Release'
          $locales=Join-Path $runtime 'locales'
          New-Item -ItemType Directory -Force -Path $native,$locales | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $native 'CompanyWebViewCefTextureProbe.dll') | Out-Null
          foreach($name in @('libcef.dll','CompanyWebViewCefSubprocess.exe','icudtl.dat','resources.pak','chrome_100_percent.pak')){
            New-Item -ItemType File -Force -Path (Join-Path $runtime $name) | Out-Null
          }
          New-Item -ItemType File -Force -Path (Join-Path $locales 'en-US.pak') | Out-Null
          $resolved=@(& $helper -BundleRoot $env:RUNNER_TEMP -ExplicitDir $folder -UnityExe 'unused-in-prebuilt-stage')
          if($resolved.Count -ne 1 -or $resolved[0] -ne [IO.Path]::GetFullPath($folder)){
            throw 'Offline auto-bootstrap failed to reuse valid staged CEF without user prompt'
          }
          # Legacy source bundle can be reused AS-IS, without manually extracting stage.
          $legacy=Join-Path $env:RUNNER_TEMP 'legacy-oneclick\oneclick_bundle'
          $legacyStage=Join-Path $legacy 'Build\cef-native\stage'
          New-Item -ItemType Directory -Force -Path $legacyStage | Out-Null
          Copy-Item -LiteralPath (Join-Path $folder 'native') -Destination (Join-Path $legacyStage 'native') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $folder 'runtime') -Destination (Join-Path $legacyStage 'runtime') -Recurse -Force
          $chosen=@(& $helper -BundleRoot $env:RUNNER_TEMP -ExplicitDir $legacy -UnityExe 'unused-in-prebuilt-stage' -NoAutoDownload)
          if($chosen.Count -ne 1 -or $chosen[0] -ne [IO.Path]::GetFullPath($legacyStage)){
            throw 'Existing oneclick_bundle root cannot be passed directly as CEF runtime'
          }
          $newKit=Join-Path $env:RUNNER_TEMP 'legacy-oneclick\new-unified-kit'
          New-Item -ItemType Directory -Force -Path $newKit | Out-Null
          $automatic=@(& $helper -BundleRoot $newKit -UnityExe 'unused-in-prebuilt-stage' -NoAutoDownload)
          if($automatic.Count -ne 1 -or $automatic[0] -ne [IO.Path]::GetFullPath($legacyStage)){
            throw 'Sibling oneclick_bundle was not discovered automatically'
          }
          Write-Host 'Legacy oneclick_bundle explicit + sibling auto discovery PASS; no network/build'
          Write-Host 'CEF auto-bootstrap fixture path PASS; no CDN download/build was attempted'
      - name: Regression - missing CEF must create one-file results ZIP without StrictMode Count crash
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'dual-preflight-regression'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Run-Dual.ps1' (Join-Path $root 'Run-Dual.ps1')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'Run-Dual.ps1') -BundleRoot $root -TestMissingRuntime
          if($LASTEXITCODE -ne 2){throw "Expected preflight exit 2, got $LASTEXITCODE"}
          $zips=@(Get-ChildItem -LiteralPath (Join-Path $root 'results') -Filter 'dual-*.zip' -File)
          if($zips.Count -ne 1){throw "Preflight must create exactly one result ZIP; got $($zips.Count)"}
          $unzip=Join-Path $root 'verified'
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $unzip
          $parts=@(Get-ChildItem -LiteralPath $unzip -File)
          if($parts.Count -ne 1 -or $parts[0].Name -ne 'summary.json'){throw 'Exactly one summary.json expected'}
          $data=Get-Content -LiteralPath (Join-Path $unzip 'summary.json') -Raw | ConvertFrom-Json
          if($data.status -ne 'FAIL' -or $data.autoChecks -ne 'NOT_RUN' -or $data.problems.Count -lt 1){throw 'Preflight report improperly declares success'}
          Write-Host 'Preflight singleton ZIP regression PASS; Unity/CEF were NOT RUN'
          $global:LASTEXITCODE=0  # Expected nonzero child test must not mark this PASS step failed
          exit 0
      - name: Automatic screenshots and privacy source contract
        shell: pwsh
        run: |
          python Integration/UnityUnified-v58.6.0-preview/Validation/verify_screen_automation_contract.py
          if($LASTEXITCODE -ne 0){throw 'Automatic evidence source contract failed'}
      - name: Auto screenshot PowerShell syntax check
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          $path=(Resolve-Path 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Screen-Automation.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw "Screenshot automation syntax error: $errors"}
      - name: Compile screenshot GDI C# helpers and run no-desktop smoke test
        shell: powershell
        run: |
          . 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Screen-Automation.ps1'
          Start-DualScreenAutomation -Player (Get-Process -Id $PID) -DurationSeconds 0 -OutputFolder $env:RUNNER_TEMP
          $j=Get-Content (Join-Path $env:RUNNER_TEMP 'screen-automation.json') -Raw | ConvertFrom-Json
          if($j.status -eq 'AUTOMATION_ERROR'){throw 'Win32 screenshot helper type compilation failed'}
          if($j.status -eq 'CAPTURED_3_OF_3'){throw 'CI headless process must never be accepted as a Unity screenshot'}
      - name: Dual Unity Player source contract
        shell: pwsh
        run: |
          python Integration/UnityUnified-v58.6.0-preview/Validation/verify_dual_player.py
          if($LASTEXITCODE -ne 0){throw 'Dual Unity Player source contract failed'}
      - name: PowerShell dual runner parser
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          $path=(Resolve-Path 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Run-Dual.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw "Dual Runner PS syntax failure: $errors"}
      - name: Static provenance and fail-closed API contract
        shell: pwsh
        run: |
          python Integration/UnityUnified-v58.6.0-preview/Validation/verify_integration.py
          if($LASTEXITCODE -ne 0){throw 'Source contract failed'}
      - name: Compile and exercise isolated C# API tests
        shell: pwsh
        run: |
          dotnet run --configuration Release --project Integration/UnityUnified-v58.6.0-preview/Tests/UnifiedContract.Tests.csproj
          if($LASTEXITCODE -ne 0){throw 'Unified C# contract failed'}
      - name: Compile Unity Editor/Standalone host conditions against Unity signature stubs
        shell: pwsh
        run: |
          $p='Integration/UnityUnified-v58.6.0-preview/Validation/UnityHostCompile.csproj'
          dotnet build $p --configuration Release --nologo -p:DefineConstants=UNITY_EDITOR
          if($LASTEXITCODE -ne 0){throw 'Unity Editor host compilation failed'}
          dotnet clean $p --configuration Release --nologo
          if($LASTEXITCODE -ne 0){throw 'Unity conditional clean failed'}
          dotnet build $p --configuration Release --nologo -p:DefineConstants=UNITY_STANDALONE_WIN
          if($LASTEXITCODE -ne 0){throw 'Unity Standalone Windows host compilation failed'}
      - name: Compile Unity Editor scene builder against API signatures
        shell: pwsh
        run: |
          dotnet build Integration/UnityUnified-v58.6.0-preview/Validation/UnityEditorBuildStub.csproj --configuration Release --nologo
          if($LASTEXITCODE -ne 0){throw 'Dual Unity Editor builder compile failed'}
      - name: Install pinned Microsoft WebView2 native SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:RUNNER_TEMP/wv2sdk" -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'NuGet WebView2 SDK failed'}
      - name: Build independent x64 WebView2 unified native DLL
        shell: pwsh
        run: |
          $sdk=Join-Path $env:RUNNER_TEMP 'wv2sdk/Microsoft.Web.WebView2.1.0.4258.31'
          cmake -S Integration/UnityUnified-v58.6.0-preview/Native -B build-unified-wv2 -G 'Visual Studio 17 2022' -A x64 "-DWEBVIEW2_SDK_ROOT=$sdk"
          if($LASTEXITCODE -ne 0){throw 'Unified WebView2 CMake configuration failed'}
          cmake --build build-unified-wv2 --config Release --clean-first
          if($LASTEXITCODE -ne 0){throw 'Unified WebView2 native build failed'}
      - name: Run native ABI/invalid-input contract without Unity
        shell: pwsh
        run: |
          ctest --test-dir build-unified-wv2 -C Release --output-on-failure
          if($LASTEXITCODE -ne 0){throw 'Unified native ABI contract failed'}
      - name: Package source and native WebView2 DLL (NOT Unity Player)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/UnityUnified-v58.6.0-preview | Out-Null
          Copy-Item Integration/UnityUnified-v58.6.0-preview/* dist/UnityUnified-v58.6.0-preview -Recurse -Force
          Get-ChildItem dist/UnityUnified-v58.6.0-preview -Include bin,obj -Directory -Recurse | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force -Path dist/UnityUnified-v58.6.0-preview/Plugins/x86_64 | Out-Null
          Copy-Item 'build-unified-wv2/Release/CompanyWebView2UnifiedPreview.dll' 'dist/UnityUnified-v58.6.0-preview/Plugins/x86_64/'
          $problems=@()
          if(Test-Path dist/UnityUnified-v58.6.0-preview/Runtime/CEF.dll){$problems+= 'unexpected CEF binary'}
          if($problems.Count -gt 0){throw ($problems -join '; ')}
      - uses: actions/upload-artifact@v4
        with:
          name: unified-unity-v58-6-0-dual-player-seed
          path: dist/UnityUnified-v58.6.0-preview
          if-no-files-found: error
          retention-days: 30
