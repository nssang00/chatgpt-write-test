name: M5 Basic Render and OL 10.10.0 CPU
on:
  workflow_dispatch:
    inputs:
      project_archive_url:
        description: "HTTPS ZIP URL of the M5 4-stage test project (leave empty if m5-ci/project.zip is committed)"
        type: string
        required: false
  push:
    paths:
      - "m5-ci/project.zip"
      - "m5-ci/project/**"
permissions:
  contents: read
concurrency:
  group: m5-basic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-cpu:
    name: Real pixels -> CPU pressure -> OL WebGL comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME_HEADLESS: "1"
      M5_CHROME_EXTRA_ARGS: "--enable-webgl --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
      SOURCE_URL: ${{ inputs.project_archive_url || vars.M5_PROJECT_ARCHIVE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locate supplied M5 test project (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m5-ci-run-project
          if [ -f m5-ci/project.zip ]; then
            cp m5-ci/project.zip /tmp/m5-project.zip
            unzip -q /tmp/m5-project.zip -d m5-ci-run-project
          elif [ -d m5-ci/project ]; then
            cp -a m5-ci/project/. m5-ci-run-project/
          elif [ -n "${SOURCE_URL:-}" ]; then
            case "$SOURCE_URL" in https://*) ;; *) echo "::error::project_archive_url must use HTTPS"; exit 2 ;; esac
            curl --fail --location --retry 2 --max-time 180 -o /tmp/m5-project.zip "$SOURCE_URL"
            unzip -q /tmp/m5-project.zip -d m5-ci-run-project
          else
            echo "::error::M5 source and fixtures are NOT in this repository. Add m5-ci/project.zip or provide project_archive_url. No fake PASS."
            exit 2
          fi
          if [ -f /tmp/m5-project.zip ]; then
            actual=$(sha256sum /tmp/m5-project.zip | cut -d' ' -f1)
            [ "$actual" = "62c906b8b00bf9cf91752378e0b637aba728500198ec616ca109d62af79a9b88" ] || { echo "::error::M5 ZIP SHA256 mismatch (expected pinned restore baseline)"; exit 2; }
          fi
          testdir=$(find "$PWD/m5-ci-run-project" -type f -name diag-app.js -printf '%h\n' | head -1)
          [ -n "$testdir" ] || { echo "::error::diag-app.js missing"; exit 2; }
          for f in package.json run-m5-ci-render-gate.mjs run-m5-uninstrumented-benchmark.mjs; do
            [ -f "$testdir/$f" ] || { echo "::error::Missing $f"; exit 2; }
          done
          [ -d "$testdir/our-renderer" ] && [ -d "$testdir/tests/fixtures/seoul" ] || { echo "::error::M5 code or offline PBF missing"; exit 2; }
          echo "PROJECT_ROOT=$testdir" >> "$GITHUB_ENV"
          echo "CI project: $testdir"
          if [ -f /tmp/m5-project.zip ]; then sha256sum /tmp/m5-project.zip; fi
      - name: Install pinned dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage 0 - Source / geometry / resource regressions
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          npm run test:regression
      - name: Stage 1 - Real rendered pixels in OL and M5
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          node run-m5-ci-render-gate.mjs
      - name: Stage 2 + 3 - Uninstrumented load and OL 10.10.0 comparison
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          node run-m5-uninstrumented-benchmark.mjs --rounds=3
      - name: Optional CPU self-time hotspot diagnosis (not score)
        if: success()
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          node run-m5-cpu-profile.mjs --samples=1
      - name: Upload screenshots, metrics, and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-basic-render-and-ol1010-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            m5-ci-run-project/**/m5-render-smoke-results/**
            m5-ci-run-project/**/m5-ci-benchmark-results/**
            m5-ci-run-project/**/m5-cpu-profile-results/**
