name: Aplus V2 Distinct Payload Integrity Under Source Crash
on:
  push:
    branches: [experiment/a-plus-v2-payload-integrity-20261030]
    paths: [.github/workflows/a-plus-v2-payload-integrity-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {n: 20, seed: 1}
          - {n: 100, seed: 1}
          - {n: 200, seed: 1}
          - {n: 200, seed: 2}
    name: 'Distinct content + sender crash N=${{ matrix.n }} seed=${{ matrix.seed }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Syntax and Linux network limits
        run: |
          python -m py_compile bench/discovery/pubsub_node.py bench/discovery/pubsub_run.py
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Every receiver must get exact unique origin/sequence bytes
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.n }}' in
            20) disc=6; timeout=55; spread=3 ;;
            100) disc=18; timeout=115; spread=12 ;;
            200) disc=27; timeout=145; spread=18 ;;
          esac
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes '${{ matrix.n }}' --modes multicast --losses 10 \
            --v4 --messages 20 --publishers '${{ matrix.n }}' \
            --sequence-payload --payload-bytes 128 --publish-interval 0.08 \
            --discovery "$disc" --timeout "$timeout" --publish-spread "$spread" \
            --repair-fanout 6 --repair-interval 0.9 --seeds '${{ matrix.seed }}' \
            --fault crash_confirmed --peer-repair --peer-replicas 6 \
            --peer-cache-limit 2048 --backup-quorum 2 --durable-publishers 1 \
            --output integrity-results
          python - <<'PY'
          import json,glob
          r=json.load(open('integrity-results/results.json'))[0]
          print('PAYLOAD_INTEGRITY_RESULT '+json.dumps(r))
          assert r['sequence_payload'] and r['durable_publishers']==1,r
          assert r['status']=='PASS' and r['crashed_nodes']==[0],r
          assert r['killed_source_proof_valid'],r
          assert r['reported']==r['nodes']-1 and r['fully_delivered_nodes']==r['nodes']-1,r
          files=glob.glob('integrity-results/*/backup-proof-0.json')
          assert len(files)==1,files
          p=json.load(open(files[0]))
          assert p['message_count']==20 and p['quorum']==2,p
          assert all(len(set(ids))>=2 and 0 not in ids for ids in p['replica_ids_by_sequence'].values()),p
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'integrity-N${{ matrix.n }}-seed${{ matrix.seed }}'
          path: integrity-results/
