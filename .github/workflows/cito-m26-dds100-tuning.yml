name: Cito M26 DDS Hundred-Node Discovery Tuning
on:
  push:
    branches: [cito-m26-dds-100-tuning]
    paths:
      - '.github/workflows/cito-m26-dds100-tuning.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tuned-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified runtime bundle without apt mirror access
        uses: actions/download-artifact@v4
        with:
          run-id: 39859684030
          name: m26-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: m26-bundle
      - name: Validate binary and network availability
        run: |
          chmod +x m26-bundle/cito_multi_topic_node m26-bundle/dds_multi_topic_node
          command -v ip
          command -v tc
          test -x /usr/bin/time
          python3 -m py_compile cito/tools/m26_efficiency.py
      - name: Test paced 100-node SPDP discovery
        env:
          M26_BUNDLE_LIB: ${{ github.workspace }}/m26-bundle
          M26_DDS_SPDP_INTERVAL: 2s
        run: |
          python3 cito/tools/m26_efficiency.py \
            --cito m26-bundle/cito_multi_topic_node \
            --dds m26-bundle/dds_multi_topic_node \
            --nodes 100 --topics 8 --percent 10 \
            --bytes 64 --samples 8 --hz 10 \
            --repeats 2 --stagger-ms 30 \
            --lifetime-ms 60000 --output m26-tuned-100-results
      - name: Upload all publisher readiness and veth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-tuned-100
          path: m26-tuned-100-results/
          if-no-files-found: warn
