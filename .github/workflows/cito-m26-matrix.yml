name: Cito M26 Selective Efficiency Matrix
on:
  push:
    branches: [cito-m26-selective-efficiency]
    paths:
      - '.github/workflows/cito-m26-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {nodes: 10, topics: 8, percent: 10, profile: baseline, repeats: 5, lifetime: 14000, bytes: 256}
          - {nodes: 10, topics: 8, percent: 100, profile: baseline, repeats: 5, lifetime: 14000, bytes: 256}
          - {nodes: 10, topics: 128, percent: 10, profile: baseline, repeats: 5, lifetime: 22000, bytes: 256}
          - {nodes: 30, topics: 33, percent: 10, profile: baseline, repeats: 5, lifetime: 20000, bytes: 256}
          - {nodes: 30, topics: 33, percent: 100, profile: baseline, repeats: 5, lifetime: 20000, bytes: 256}
          - {nodes: 100, topics: 8, percent: 10, profile: baseline, repeats: 3, lifetime: 28000, bytes: 64}
          - {nodes: 100, topics: 8, percent: 100, profile: baseline, repeats: 3, lifetime: 28000, bytes: 64}
          - {nodes: 10, topics: 8, percent: 10, profile: limited, repeats: 5, lifetime: 18000, bytes: 256}
          - {nodes: 10, topics: 8, percent: 100, profile: limited, repeats: 5, lifetime: 18000, bytes: 256}
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites with bounded apt calls
        run: |
          sudo timeout 120 apt-get update -qq || echo 'cached apt indexes'
          sudo timeout 180 apt-get install -y -qq cmake ninja-build iproute2 time cyclonedds-dev cyclonedds-tools
          python3 -m py_compile cito/tools/m26_efficiency.py
      - name: Build benchmark once per runner
        run: |
          cmake -S cito/tests/bench -B build-m26 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-m26 -j2
      - name: Run matched Cito and DDS selective workloads
        run: |
          python3 cito/tools/m26_efficiency.py \
            --cito build-m26/cito_multi_topic_node \
            --dds build-m26/dds_multi_topic_node \
            --nodes ${{ matrix.nodes }} --topics ${{ matrix.topics }} --percent ${{ matrix.percent }} \
            --profile ${{ matrix.profile }} --bytes ${{ matrix.bytes }} \
            --samples 8 --hz 10 --repeats ${{ matrix.repeats }} \
            --lifetime-ms ${{ matrix.lifetime }} --output m26-results
      - name: Upload raw per-node logs and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m26-${{ matrix.profile }}-n${{ matrix.nodes }}-t${{ matrix.topics }}-p${{ matrix.percent }}
          path: m26-results/
          if-no-files-found: warn
