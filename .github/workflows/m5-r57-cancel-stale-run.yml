name: M5 R57 Cancel Stale Experimental Run
on:
  push:
    branches: [m5/r46-distinct-mvt-32-20261023]
    paths:
      - '.github/workflows/m5-r57-cancel-stale-run.yml'
permissions:
  actions: write
  contents: read
jobs:
  force-cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel only stale experimental run 40150391516
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/40150391516/force-cancel"
          status=$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${url}")
          echo "R57_FORCE_CANCEL_HTTP_STATUS=${status}"
          if [[ "${status}" != "202" && "${status}" != "409" ]]; then
            cat /tmp/cancel-response.txt
            exit 1
          fi
