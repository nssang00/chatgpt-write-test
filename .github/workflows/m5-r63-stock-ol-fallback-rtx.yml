name: M5 R63 Stock OL Fallback RTX E2E
on:
  push:
    branches: [m5/r46-distinct-mvt-32-20261023]
    paths:
      - 'm5-gpu/r63/**'
      - '.github/workflows/m5-r63-stock-ol-fallback-rtx.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m5-r63-ol-fallback
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      R35_ZIP_PATH: 'C:\M5_R35\M5_R35_RTX_READY_SELF_CONTAINED_2026-10-22.zip'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned RTX source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force R63-EVIDENCE | Out-Null
          $g=@(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion)
          $g | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 R63-EVIDENCE\GPU.json
          if($env:OS -ne 'Windows_NT' -or -not ($g|Where-Object{$_.Name -match 'NVIDIA.*RTX 5060 Ti'})){throw 'RTX 5060 Ti required'}
          $sha=(Get-FileHash -Algorithm SHA256 $env:R35_ZIP_PATH).Hash.ToLowerInvariant()
          if($sha -ne '3e5d3cb5d525b818a3b560731dac0ae17ce734ab5a96057c67c546c4b7cb2776'){throw 'R35 baseline changed'}
          $sha | Set-Content R63-EVIDENCE\R35_SHA256.txt
      - name: Reconstruct CPU-first M5 with OL fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R63-SOURCE'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive -LiteralPath $env:R35_ZIP_PATH -DestinationPath $dest -Force
          git -C $dest init -q
          node m5-gpu/r45/apply_r45.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R45 patch failed'}
          node m5-gpu/r48/apply_cpu_join_fallback.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R48 patch failed'}
          New-Item -ItemType Directory -Force (Join-Path $dest 'm5-gpu\r63'),(Join-Path $dest 'm5-gpu\r46') | Out-Null
          Copy-Item .\m5-gpu\r63\real_ol_fallback.html (Join-Path $dest 'm5-gpu\r63\')
          Copy-Item .\m5-gpu\r63\run_real_ol_fallback.mjs (Join-Path $dest 'm5-gpu\r63\')
          Copy-Item .\m5-gpu\r46\download_unique_tiles.mjs (Join-Path $dest 'm5-gpu\r46\')
          Push-Location $dest
          try{
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
            if($LASTEXITCODE -ne 0){throw 'Playwright install failed'}
          }finally{Pop-Location}
      - name: Fetch and verify 32 distinct tiles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R63-SOURCE'
          node (Join-Path $dest 'm5-gpu\r46\download_unique_tiles.mjs') (Join-Path $dest 'tests\fixtures\r46-data')
          if($LASTEXITCODE -ne 0){throw 'MVT fixtures invalid'}
      - name: Demonstrate real stock OL post-failure drag wheel fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R63-SOURCE'
          node (Join-Path $dest 'm5-gpu\r63\run_real_ol_fallback.mjs') $dest (Join-Path $env:GITHUB_WORKSPACE 'R63-EVIDENCE\ui')
          if($LASTEXITCODE -ne 0){throw 'R63 real fallback failed'}
          $r=Get-Content R63-EVIDENCE\ui\result.json -Raw | ConvertFrom-Json
          if(-not $r.pass -or @($r.checks).Count -lt 8){throw 'R63 fallback evidence incomplete'}
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-r63-real-stock-ol-fallback
          path: R63-EVIDENCE/**
          retention-days: 30
          if-no-files-found: warn
