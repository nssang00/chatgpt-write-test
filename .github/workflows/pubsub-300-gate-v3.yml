name: 300-Node All-Publisher Reliability Gate V3
on:
  push:
    branches: [benchmark/pubsub-300-reliability-gate-v3-20261029]
    paths: [.github/workflows/pubsub-300-gate-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-publisher-gate:
    name: '${{ matrix.mode }} loss=${{ matrix.loss }}%'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [multicast, hybrid]
        loss: [0, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make socket buffer limits explicit
        run: |
          set -euxo pipefail
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sysctl net.core.rmem_default net.core.wmem_default net.core.rmem_max net.core.wmem_max
          free -m
          ip -V && tc -V
      - name: Full all-to-all data delivery in 300 isolated nodes, two seeds
        run: |
          set -euxo pipefail
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes 300 --modes '${{ matrix.mode }}' --losses '${{ matrix.loss }}' \
            --seeds 1,2 --discovery 12 --timeout 105 --messages 2 \
            --publishers 300 --publish-spread 30 \
            --repair-fanout 4 --repair-interval 1.2 \
            --output gate-v3-results
          cat gate-v3-results/results.csv
      - name: Archive detailed node records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'gate-v3-${{ matrix.mode }}-loss-${{ matrix.loss }}'
          path: gate-v3-results/
          if-no-files-found: warn
