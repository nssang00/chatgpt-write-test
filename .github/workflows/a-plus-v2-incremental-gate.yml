name: Aplus V2 Incremental Repair Gate
on:
  push:
    branches: [experiment/a-plus-v2-incremental-repair-20261030]
    paths: [.github/workflows/a-plus-v2-incremental-gate.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nodes: 50, messages: 20, loss: 10, seed: 1, incremental: true}
          - {nodes: 100, messages: 100, loss: 10, seed: 1, incremental: true}
          - {nodes: 200, messages: 100, loss: 10, seed: 1, incremental: true}
          - {nodes: 200, messages: 100, loss: 10, seed: 2, incremental: true}
          - {nodes: 200, messages: 100, loss: 10, seed: 3, incremental: true}
          - {nodes: 200, messages: 100, loss: 10, seed: 1, incremental: false}
    name: 'N=${{ matrix.nodes }} m=${{ matrix.messages }} loss=${{ matrix.loss }} seed=${{ matrix.seed }} incremental=${{ matrix.incremental }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m py_compile bench/discovery/pubsub_node.py bench/discovery/pubsub_run.py
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.nodes }}' in
            50) discovery=12; timeout=75; spread=7 ;;
            100) discovery=18; timeout=105; spread=12 ;;
            200) discovery=27; timeout=125; spread=18 ;;
          esac
          args=()
          if [ '${{ matrix.incremental }}' = true ]; then
            args+=(--incremental-repair --nack-batch-limit 32)
          fi
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes '${{ matrix.nodes }}' --modes multicast \
            --losses '${{ matrix.loss }}' --v4 --messages '${{ matrix.messages }}' \
            --payload-bytes 128 --publish-interval 0.06 \
            --publishers '${{ matrix.nodes }}' --discovery "$discovery" \
            --timeout "$timeout" --publish-spread "$spread" \
            --repair-fanout 6 --repair-interval 0.9 --seeds '${{ matrix.seed }}' \
            "${args[@]}" --output v2-results
          python - <<'PY'
          import json
          r=json.load(open('v2-results/results.json'))[0]
          print('V2_RESULT '+json.dumps(r))
          assert r['status'] in ('PASS','FAIL'),r
          assert r['reported']==r['nodes'],r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'v2-N${{ matrix.nodes }}-m${{ matrix.messages }}-s${{ matrix.seed }}-inc${{ matrix.incremental }}'
          path: v2-results/
