name: Cito Discovery High Scale

on:
  push:
    branches: [cito-discovery-scale-actions]
    paths:
      - "cito/tests/net/discovery_highscale.sh"
      - ".github/workflows/cito-discovery-highscale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-256-512:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile Cito runtime
        run: |
          set -euo pipefail
          cmake -S cito -B build-cito-highscale -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cito-highscale --target cito_runtime_udp_node -j2
      - name: Measure 257 and 513 independent nodes
        shell: bash
        run: |
          bash cito/tests/net/discovery_highscale.sh "$GITHUB_WORKSPACE/build-cito-highscale/cito_runtime_udp_node"
      - name: Upload node-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cito-discovery-highscale-evidence
          path: |
            discovery-highscale-results.tsv
            highscale-logs/
          if-no-files-found: warn
          retention-days: 14
