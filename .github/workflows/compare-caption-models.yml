name: Compare image caption models (self-hosted)

on:
  push:
    paths:
      - .github/workflows/compare-caption-models.yml
      - scripts/compare_caption_models.py
      - scripts/requirements-caption.txt
      - prompts/prompts.json
      - inputs/README.md
  workflow_dispatch:
    inputs:
      models:
        description: "Model subset (all runs 3 sequentially)"
        required: true
        type: choice
        default: all
        options:
          - all
          - caprl
          - qwen
          - joycaption
      max_images:
        description: "Maximum images from inputs folder"
        required: true
        type: string
        default: "3"
      prompt_ids:
        description: "all or comma-separated: detailed,short,spatial,ocr,structured"
        required: true
        type: string
        default: all
      max_new_tokens:
        description: "Max generated tokens per model/prompt/image"
        required: true
        type: string
        default: "300"

permissions:
  contents: read

concurrency:
  group: caption-models-self-hosted
  cancel-in-progress: false

jobs:
  lint:
    name: Validate Python script and prompts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and JSON validation
        run: |
          python -m py_compile scripts/compare_caption_models.py
          python -m json.tool prompts/prompts.json > /dev/null
          python -c "import json; p=json.load(open('prompts/prompts.json',encoding='utf-8'))['prompts']; assert len(p)==5 and all('id' in x and 'text' in x for x in p)"

  preflight:
    name: Verify NVIDIA self-hosted runner
    needs: lint
    runs-on: [self-hosted, Windows, X64, m5-gpu]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Detect GPU and runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          $smi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if (-not $smi) { throw 'nvidia-smi.exe not found on self-hosted runner' }
          $gpu = & $smi.Source --query-gpu=name,memory.total,memory.free,driver_version --format=csv,noheader
          if ($LASTEXITCODE -ne 0 -or -not $gpu) { throw 'NVIDIA GPU query failed' }
          $result = [pscustomobject]@{
            runner = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            gpu = ($gpu -join '; ')
            python = ((Get-Command python -ErrorAction SilentlyContinue).Source)
            checked_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $result | ConvertTo-Json -Depth 4 | Out-File outputs/preflight.json -Encoding utf8
          "## Self-hosted NVIDIA GPU preflight" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $result | ConvertTo-Json -Compress | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Write-Host ($result | ConvertTo-Json -Depth 4)
      - name: Upload preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-gpu-preflight
          path: outputs/preflight.json
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: Run three caption models (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: [self-hosted, Windows, X64, m5-gpu]
    timeout-minutes: 240
    env:
      CAPTION_MODELS: "${{ inputs.models }}"
      MAX_IMAGES: "${{ inputs.max_images }}"
      PROMPT_IDS: "${{ inputs.prompt_ids }}"
      MAX_NEW_TOKENS: "${{ inputs.max_new_tokens }}"
    steps:
      - uses: actions/checkout@v4
      - name: Check input images before downloading models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $photos = @(Get-ChildItem inputs -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.jpg','.jpeg','.png','.webp') })
          if ($photos.Count -eq 0) {
            throw 'No photos in inputs/. Add JPG/PNG/WebP files, or supply your own private input workflow, before manual comparison.'
          }
          if ([int]$env:MAX_IMAGES -lt 1 -or [int]$env:MAX_NEW_TOKENS -lt 1) {
            throw 'max_images and max_new_tokens must be positive integers'
          }
          Write-Host "Found $($photos.Count) images; models: $env:CAPTION_MODELS"
          $cacheRoot = Join-Path $env:USERPROFILE '.cache\huggingface'
          "HF_HOME=$cacheRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-caption.txt
      - name: Install CUDA 12.8 PyTorch (Blackwell/RTX 50 support)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
          if ($LASTEXITCODE -ne 0) { throw 'CUDA 12.8 PyTorch install failed' }
          python -m pip install -r scripts/requirements-caption.txt
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark dependencies install failed' }
      - name: Confirm CUDA kernels
        shell: pwsh
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA unavailable'; x=torch.randn(128,128,device='cuda'); print('Torch',torch.__version__,'GPU',torch.cuda.get_device_name(0),'CUDA',torch.version.cuda,'GPU compute',torch.cuda.get_device_capability(0),'matmul',float((x@x).sum()))"
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch CUDA operation failed' }
      - name: Download and infer (sequential models)
        shell: pwsh
        run: |
          python scripts/compare_caption_models.py --mode compare --models "$env:CAPTION_MODELS" --max-images "$env:MAX_IMAGES" --prompt-ids "$env:PROMPT_IDS" --max-new-tokens "$env:MAX_NEW_TOKENS" --output-dir outputs
          if ($LASTEXITCODE -ne 0) { throw 'One or more model comparisons failed; see uploaded artifacts' }
      - name: Upload captions, prompts, logs, metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-comparison-results
          path: |
            outputs/**
            prompts/prompts.json
          if-no-files-found: warn
          retention-days: 14
