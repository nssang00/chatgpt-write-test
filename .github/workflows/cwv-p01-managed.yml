name: CompanyWebView P0-1 / Managed Windows source integration
on:
  push:
    branches: [verify/cwv-p01-windows-20261029]
    paths:
      - 'companywebview-p01/source-bundle.txt'
      - 'companywebview-p01/Validation/**'
      - '.github/workflows/cwv-p01-managed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-source:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract original P0-1 managed source archive
        shell: pwsh
        run: |
          @'
          import base64,hashlib,io,lzma,tarfile,pathlib
          bundle=pathlib.Path('companywebview-p01/source-bundle.txt')
          data=bundle.read_bytes().replace(b'\r\n',b'\n').strip()
          expected='1bbf91d9907fe61a2733f023990c8b4861c08e721da0bbdea3703a78f47bc850'
          actual=hashlib.sha256(data).hexdigest()
          print('PUBLIC_BUNDLE_SHA256_OBSERVED',actual,'length',len(data))
          if actual!=expected:
              raise SystemExit('P0-1 public source bundle checksum mismatch')
          raw=lzma.decompress(base64.b64decode(data))
          tar=tarfile.open(fileobj=io.BytesIO(raw))
          root=pathlib.Path('companywebview-p01/FullManagedSource')
          root.mkdir(parents=True,exist_ok=True)
          members=tar.getmembers()
          if len(members)!=80: raise SystemExit('P0-1 source list count mismatch')
          for m in members:
              p=pathlib.PurePosixPath(m.name)
              if not m.isfile() or p.is_absolute() or '..' in p.parts:
                  raise SystemExit('unsafe file in P0-1 source archive')
              dest=root.joinpath(*p.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(tar.extractfile(m).read())
          print('EXACT_P01_MANAGED_SOURCE_BUNDLE_PASS',len(members))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
      - name: Actual C# Roslyn compile of Unity Editor build source
        shell: pwsh
        run: |
          dotnet build companywebview-p01/FullManagedSource/Validation/AutoBuildCompile.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Auto-build source compilation failed' }
      - name: Restore exact original CEF managed facade into source tree
        shell: pwsh
        run: |
          @'
          import base64,lzma,hashlib,pathlib
          p=pathlib.Path('companywebview-p01/cef-webviewruntime.xz.b64')
          b=lzma.decompress(base64.b64decode(p.read_text().strip()))
          expected='0b12e7c1967db4b1a10034a6e88a7f897cf4d3800107ba0062cc3fa064dc5fac'
          if hashlib.sha256(b).hexdigest()!=expected:
              raise SystemExit('Original CEF managed facade checksum mismatch')
          target=pathlib.Path('companywebview-p01/FullManagedSource/NativeSource/oneclick_bundle/Package/com.company.webview/Runtime/Backends/CEF/WebViewRuntime.cs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(b)
          print('ORIGINAL_CEF_MANAGED_FACADE_SHA256_PASS')
          src=pathlib.Path('companywebview-p01/CEFWebView.cs')
          dest=pathlib.Path('companywebview-p01/FullManagedSource/NativeSource/oneclick_bundle/Package/com.company.webview/Runtime/WebView.cs')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(src.read_bytes())
          print('ORIGINAL_CEF_WEBVIEW_WRAPPER_PRESENT')
          patched=pathlib.Path('companywebview-p01/Validation/ProductPanelCompile.csproj')
          targetproj=pathlib.Path('companywebview-p01/FullManagedSource/Validation/ProductPanelCompile.csproj')
          targetproj.write_bytes(patched.read_bytes())
          print('PRODUCT_PANEL_COMPILE_PROJECT_FIX_APPLIED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'CEF managed facade restoration failed' }
      - name: Apply reviewed source fixes for real CEF RPC and Unity stub
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path('companywebview-p01/FullManagedSource')
          changes=[
           ('ExistingRuntime/CefRpcDispatcher.cs','private static void Complete(Active item, string result, bool isError)','private void Complete(Active item, string result, bool isError)'),
           ('Validation/ProductPanelCompileStub.cs','public static void LogError(object s,Object o) {}','public static void LogError(object s) {} public static void LogError(object s,Object o) {}')
          ]
          for name,before,after in changes:
              path=root/name
              text=path.read_text(encoding='utf-8')
              if text.count(before)!=1: raise SystemExit('P0-1 source fix no longer matches '+name)
              path.write_text(text.replace(before,after),encoding='utf-8')
              print('P0-1_COMPILER_SOURCE_FIX_APPLIED',name)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Managed source fix validation failed' }
      - name: Actual C# Roslyn compile of full C# panel with Unity stubs
        shell: pwsh
        run: |
          $root='companywebview-p01/FullManagedSource'
          $facade=Join-Path $root 'NativeSource/oneclick_bundle/Package/com.company.webview/Runtime/Backends/CEF/WebViewRuntime.cs'
          if(-not(Test-Path $facade)){throw 'Exact CEF WebViewRuntime.cs missing from published source subset (not a code failure)'}
          dotnet build (Join-Path $root 'Validation/ProductPanelCompile.csproj') -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Panel source Roslyn compilation failed' }
