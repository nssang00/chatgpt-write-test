name: Round18 Best Candidate RTX Full ABBA Gate
on:
  push:
    paths:
      - .github/workflows/m5-round18-full-abba-rtx.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-abba:
    runs-on: self-hosted
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physical RTX and prepare final Round18 candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare'
          if(-not (Test-Path (Join-Path $source 'tests\round14_gpu_compare\oneclick.mjs'))){throw 'Round14 benchmark source missing'}
          $g=Get-CimInstance Win32_VideoController|Where-Object{$_.Name -match 'NVIDIA.*RTX'}
          if(-not $g){throw 'NVIDIA RTX GPU missing'}
          $g|Select-Object Name,DriverVersion|Format-Table
          $dest=Join-Path $env:GITHUB_WORKSPACE 'r18-best'
          New-Item -ItemType Directory -Path $dest -Force|Out-Null
          Copy-Item (Join-Path $source '*') $dest -Recurse -Force
          if(Test-Path (Join-Path $dest 'RESULTS')){Remove-Item (Join-Path $dest 'RESULTS') -Recurse -Force}
          foreach($patch in @('round14_apply_capture_fix.mjs','apply_backend_msaa_optin.mjs','apply_ol_stroke_defaults_variant.mjs','apply_no_line_discard_variant.mjs','apply_round18_tile_scissor.mjs','apply_round18_layer_fbo.mjs','apply_round18_polygon_stroke_noclip.mjs')){
            node --check (Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch))
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $patch"}
            node (Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch)) $dest
            if($LASTEXITCODE -ne 0){throw "Patch failed: $patch"}
          }
          "R18_PROJECT=$dest"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Round18 Node regression gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:R18_PROJECT
          foreach($file in @('tests/verify_round14_loop_and_style.mjs','tests/verify_direct_feature_gpu_draw.mjs','tests/verify_tile_clipping.mjs','tests/round8/verify_ol_render_contract.mjs')){
            node $file
            if($LASTEXITCODE -ne 0){throw "Regression failed: $file"}
          }
          node tests/round14_gpu_compare/oneclick.mjs --self-test
          if($LASTEXITCODE -ne 0){throw 'Comparator selftest failed'}
      - name: Full Windows RTX A/B/A/B 5 cold samples each campaign
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:R18_PROJECT
          node tests/round14_gpu_compare/oneclick.mjs --rounds=5 --headless
          if($LASTEXITCODE -ne 0){throw 'RTX A/B campaign incomplete'}
      - name: Upload screenshots, metrics and RGBA8 diff even if pixel gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round18-best-5cold-rtx
          retention-days: 30
          if-no-files-found: warn
          path: r18-best/RESULTS/**
      - name: Fail closed if exact OL↔M5 pixels or renderer stability fails
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:R18_PROJECT 'RESULTS'
          $file=Get-ChildItem $dir -Recurse -Filter manifest.json|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if(-not $file){throw 'Measured manifest missing'}
          $m=Get-Content $file.FullName -Raw|ConvertFrom-Json
          $m.rows|Format-Table scene,olMedianMs,m5MedianMs,m5ChangePercent,pixelDiffRuns
          if(-not $m.complete){throw 'Incomplete GPU measurement'}
          if(-not $m.withinRendererStable){throw 'Renderer nondeterminism'}
          if(-not $m.pixelParityAll){throw 'Exact RGBA8 parity not achieved; performance results are diagnostic only'}
          if(@($m.rows|Where-Object{$_.m5ChangePercent -gt -50}).Count -gt 0){throw 'OL cold frame improvement under 50%'}
