name: Cito Discovery Namespace Scale
on:
  push:
    branches: [cito-discovery-scale]
    paths:
      - 'cito/tools/discovery_scale.py'
      - '.github/workflows/cito-discovery-scale.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 ninja-build
          python3 -m py_compile cito/tools/discovery_scale.py
          sudo -n ip netns list
      - name: Build runtime UDP node
        run: |
          cmake -S cito -B build-scale -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-scale --target cito_runtime_udp_node -j2
      - name: Run scale
        run: |
          python3 cito/tools/discovery_scale.py \
            --binary build-scale/cito_runtime_udp_node \
            --counts 3,10,30,50,100,200,300,400 \
            --repeats 2 --timeout 35 --lifetime-ms 22000 \
            --output discovery-scale-results
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cito-discovery-scale
          path: discovery-scale-results/
          if-no-files-found: warn
