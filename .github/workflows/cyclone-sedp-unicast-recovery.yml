name: Cyclone 33-40 SPDP Only Unicast SEDP Recovery
on:
  push:
    branches: [diagnostic/cyclone-30-40-spdp-only-20261029]
    paths: [.github/workflows/cyclone-sedp-unicast-recovery.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  protocol-mode:
    name: 'N=${{ matrix.nodes }} ${{ matrix.config }} buffer=${{ matrix.buffer }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {nodes: 33, config: spdp-only, buffer: default}
          - {nodes: 35, config: spdp-only, buffer: default}
          - {nodes: 40, config: spdp-only, buffer: default}
          - {nodes: 35, config: spdp-only, buffer: large}
          - {nodes: 40, config: spdp-only, buffer: large}
          - {nodes: 35, config: default, buffer: large}
          - {nodes: 40, config: default, buffer: large}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Cyclone
        run: python -m pip install cyclonedds==11.0.1
      - name: Adjust UDP receive buffer defaults if requested
        run: |
          if [ '${{ matrix.buffer }}' = 'large' ]; then
            sudo sysctl -w net.core.rmem_max=16777216
            sudo sysctl -w net.core.rmem_default=4194304
            sudo sysctl -w net.core.wmem_max=16777216
          fi
      - name: Test multicast SPDP versus forced unicast SEDP without user messages
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/discovery_only_run.py \
            --nodes '${{ matrix.nodes }}' --seed 1 \
            --config '${{ matrix.config }}' --timeout 27 \
            --output sedp-unicast
          cat sedp-unicast/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'unicast-n${{ matrix.nodes }}-${{ matrix.config }}-${{ matrix.buffer }}'
          path: sedp-unicast/
          if-no-files-found: warn
