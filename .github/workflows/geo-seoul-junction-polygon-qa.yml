name: Seoul polygon junctions visual QA with filtered terrain
on:
  push:
    branches:
      - fix/seoul-road-junction-polygon-20261120
    paths:
      - .github/workflows/geo-seoul-junction-polygon-qa.yml
      - geobench/run-native-smoke.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seoul-polygons-visual-quality
  cancel-in-progress: true
jobs:
  package-real-seoul-road-joins:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: geobench
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:roads
      - run: npm run test:terrain
      - run: npm run data
      - name: Reject extreme terrain slopes and triangle spikes
        run: npm run audit:terrain-roads
      - run: npm run pack-tiles
      - run: npm run pack-native-tiles
      - name: Stage actual 3D Tiles + metadata
        uses: actions/upload-artifact@v4
        with:
          name: seoul-polygon-junction-native-tiles
          path: |
            geobench/public/native-3dtiles/
            geobench/public/stream-manifest.json
            geobench/results/terrain-road-geometry-audit.json
          retention-days: 7
          if-no-files-found: error
  hosted-roadview-qa:
    needs: package-real-seoul-road-joins
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: geobench
    env:
      GEO_TEST_KIND: software
      GEO_ROAD_VIEW: '1'
      GEO_BROWSER_CHANNEL: chrome
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: seoul-polygon-junction-native-tiles
          path: geobench
      - run: google-chrome --version
      - run: npm install --no-audit --no-fund
      - name: Capture real Chrome native Cesium 3D Tiles roadview
        run: npm run native-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seoul-polygon-junction-chrome-screenshot
          path: geobench/results/
          retention-days: 14
          if-no-files-found: warn
  actual-rtx-road-visual:
    needs: package-real-seoul-road-joins
    runs-on: [self-hosted, Windows, X64, m5-gpu]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: geobench
    env:
      GEO_TEST_KIND: hardware
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: seoul-polygon-junction-native-tiles
          path: geobench
      - name: Install dependencies
        shell: powershell
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm failed' }
      - name: Select hardware browser
        shell: powershell
        run: |
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            (Join-Path $pf86 'Google\Chrome\Application\chrome.exe'),
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $edge = @(
            (Join-Path $pf86 'Microsoft\Edge\Application\msedge.exe'),
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($chrome) { "GEO_BROWSER_CHANNEL=chrome" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          elseif ($edge) { "GEO_BROWSER_CHANNEL=msedge" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          else { throw 'No Chrome/Edge found' }
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion | Format-Table
      - name: Capture close roadway camera in native Cesium 3D Tiles
        shell: powershell
        run: |
          $env:GEO_ROAD_VIEW='1'
          npm run native-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Roadview native screenshot failed' }
      - name: Capture same original city overview camera
        shell: powershell
        run: |
          Remove-Item Env:GEO_ROAD_VIEW -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          npm run native-smoke
          if ($LASTEXITCODE -ne 0) { throw 'City overview native screenshot failed' }
      - name: Upload original RTX screenshots (never AI-generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-polygon-junction-rtx-screenshots
          path: geobench/results/
          retention-days: 14
          if-no-files-found: warn
