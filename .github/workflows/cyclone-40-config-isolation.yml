name: Cyclone 40 Node Interface and Delay Isolation
on:
  push:
    branches: [diagnostic/cyclone-30-40-spdp-only-20261029]
    paths: [.github/workflows/cyclone-40-config-isolation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    name: 'N=${{ matrix.nodes }} config=${{ matrix.config }} delay=${{ matrix.delay }}ms'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {nodes: 40, config: default, delay: 2}
          - {nodes: 40, config: eth0, delay: 0}
          - {nodes: 40, config: spdp-only, delay: 0}
          - {nodes: 35, config: default, delay: 2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Cyclone and iproute2
        run: |
          python -m pip install cyclonedds==11.0.1
          ip -V
          tc -V
      - name: Compare physical interface and delay without user messages
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/discovery_only_run.py \
            --nodes '${{ matrix.nodes }}' --seed 1 \
            --config '${{ matrix.config }}' \
            --delay-ms '${{ matrix.delay }}' --timeout 25 \
            --trace --output config-results
          cat config-results/summary.json
      - name: Upload raw per-node timelines and DDS traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'config-N${{ matrix.nodes }}-${{ matrix.config }}-delay${{ matrix.delay }}'
          path: config-results/
          if-no-files-found: warn
