name: OneClick v58.3 Release Candidate Packaging Gate

on:
  workflow_dispatch:
  push:
    branches:
      - ci/oneclick-v58-3
    paths:
      - '.github/workflows/oneclick-v57-9-native.yml'
      - 'ci/v58.2-runtime/**'
      - 'ci/v58.2.1-harness/**'
      - 'ci/v58.2.2-harness/**'
      - 'ci/v58.2.3-harness/**'
      - 'ci/v58.2.4-managed/**'
      - 'ci/v58.3-release/**'
      - 'ci/v58-release/**'

permissions:
  contents: read

jobs:
  windows-native-cef:
    name: Windows Native + CEF Gate
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      CEF_VERSION: 154.0.28+g564dd6c+chromium-154.0.8037.58
      CEF_PLATFORM: windows64
      PAYLOAD_SHA256: 80453dc4c58e8ff8bc6fa62867aad08f033cb55550ff2e3b4e761ff9fc8218fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify v58.2 runtime promotion policy
        shell: pwsh
        run: |
          $audit = Get-Content ci/v58-release/release_readiness_check.py -Raw
          foreach ($token in @('BLOCKED_RELEASE_METADATA','RUNTIME_CEF_BACKEND_IMPLEMENTED','PUBLIC_WEBVIEW_API_IMPLEMENTED','VALIDATED_IMPLEMENTATION_PROMOTED_FROM_PROTOTYPES','LICENSE_NOTICE_PRESENT')) {
            if ($audit -notlike "*$token*") { throw "Missing release audit policy token: $token" }
          }

      - name: Record inherited validated native baseline
        shell: pwsh
        run: |
          "targetHarnessVersion=57.9.0" | Set-Content v579-harness-baseline.txt
          "nativeSourceSha256=3c752da814aabb4224c4ed84cd19c9fdf223cfef6def3691908c339e1b344382" | Add-Content v579-harness-baseline.txt
          "nativeBaseline=v57.8 (byte-identical Native tree)" | Add-Content v579-harness-baseline.txt

      - name: Verify v58.2.1 stale overlay cleanup contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'overlay-cleanup-contract'
          $pkg = Join-Path $base 'Package\com.company.webview'
          $promoted = Join-Path $pkg 'Runtime\Backends\CEF\Native\Host'
          $stale = Join-Path $pkg 'Prototypes\CefTexture\Native\Host'
          New-Item -ItemType Directory -Force -Path $promoted,$stale | Out-Null
          'runtime' | Set-Content (Join-Path $promoted 'CefRuntime.cpp')
          'stale' | Set-Content (Join-Path $stale 'CefRuntime.cpp')
          $json = & .\ci\v58.2.1-harness\overlay_cleanup_contract.ps1 -PackageRoot $pkg
          $r = $json | ConvertFrom-Json
          if (-not $r.removed -or $r.staleExists -or -not $r.promotedExists) { throw "Overlay cleanup did not remove only the stale prototype tree: $json" }
          $protected = Join-Path $base 'protected\Package\com.company.webview'
          New-Item -ItemType Directory -Force -Path (Join-Path $protected 'Prototypes\CefTexture') | Out-Null
          $failed = $false
          try { & .\ci\v58.2.1-harness\overlay_cleanup_contract.ps1 -PackageRoot $protected | Out-Host } catch { $failed = $true }
          if (-not $failed) { throw 'Cleanup must refuse to delete stale prototype tree when promoted Runtime marker is missing.' }

      - name: Verify v58.2.2 bundle-root build path contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'build-path-contract'
          $tools = Join-Path $base 'Tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          'Write-Host contract' | Set-Content (Join-Path $tools 'Build-CefWindowsX64.ps1')
          $json = & .\ci\v58.2.2-harness\build_path_contract.ps1 -BundleRoot $base
          $r = $json | ConvertFrom-Json
          if (-not $r.bundleRootTools -or $r.packageInternalTools) { throw "Unexpected build path contract result: $json" }

      - name: Verify v58.2.3 non-gating refresh diagnostic contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & .\ci\v58.2.3-harness\refresh_diagnostic_contract.ps1 -ExitCode 33 -GpuCrash $true
          $r = $json | ConvertFrom-Json
          if ($r.gating -ne $false -or $r.continuedToFullSuite -ne $true -or $r.shouldAbort -ne $false -or $r.status -ne 'WARN') {
            throw "Refresh diagnostic contract regressed: $json"
          }
          if ($r.failureCode -ne 'REFRESH_GPU_PROCESS_CRASH') { throw "Unexpected refresh failure code: $json" }

      - name: Verify v58.2.4 managed API consistency contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = Get-Content 'ci/v58.2.4-managed/managed-api-contract.json' -Raw | ConvertFrom-Json
          if ($contract.harnessVersion -ne '58.2.4') { throw "Unexpected managed contract version: $($contract.harnessVersion)" }
          if (@($contract.missing).Count -ne 0) { throw "Managed API contract has unresolved facade calls: $($contract.missing -join ', ')" }
          foreach ($required in @('CefTextureSurface_GetGpuAdapterDiagnostics','CefTextureSurface_GetStats','CefTextureSurface_GetUnityTexture')) {
            if (@($contract.requiredForwarders) -notcontains $required) { throw "Missing required managed forwarder: $required" }
          }
          if ($contract.webViewRuntimeSha256 -ne 'f568ba150a2ab87b0bb6298f0364597a6c53e668774b8d74e24b19b2387b8134') {
            throw "Managed facade source hash mismatch."
          }

      - name: Verify v58.3 release candidate packaging contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = Get-Content 'ci/v58.3-release/release-contract.json' -Raw | ConvertFrom-Json
          if ($contract.harnessVersion -ne '58.3.0') { throw "Unexpected release contract version: $($contract.harnessVersion)" }
          if ($contract.packageVersion -ne '1.0.0-rc.1') { throw "Unexpected package version: $($contract.packageVersion)" }
          if ($contract.readinessStatus -ne 'READY_FOR_RC_PACKAGING' -or $contract.shippingStatus -ne 'READY_RC') { throw "Unexpected release readiness/shipping status." }
          $expectedExclusions = @('Tests','Validation','Tools','Prototypes')
          if (@($contract.releaseExcludes).Count -ne 4) { throw "Release exclusion count mismatch." }
          foreach ($x in $expectedExclusions) { if (@($contract.releaseExcludes) -notcontains $x) { throw "Missing release exclusion: $x" } }
          foreach ($x in @('LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','ThirdParty/CEF-LICENSE.txt')) { if (@($contract.requiredMetadata) -notcontains $x) { throw "Missing release metadata contract: $x" } }
          foreach ($x in @('Runtime/Plugins/x86_64/CompanyWebViewCefTextureProbe.dll','Runtime/Plugins/x86_64/CompanyWebViewCefSubprocess.exe','Runtime/Plugins/x86_64/libcef.dll')) { if (@($contract.requiredRuntimeFiles) -notcontains $x) { throw "Missing runtime payload contract: $x" } }
          if ($contract.cefLicenseSha256 -ne 'a7bf389f9975ac4e56c850708124c210bd52965f5cf22a3be06254dbab1fbc78') { throw "CEF license hash mismatch." }

      - name: Reconstruct exact v58.2 Runtime source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'ci\v58.2-runtime\source-part*.b64' | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Expected 3 payload parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'v582_runtime_ci.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "payloadSha256=$hash" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\payload-sha256.txt"
          if ($hash -ne $env:PAYLOAD_SHA256) { throw "Payload SHA-256 mismatch. Expected $env:PAYLOAD_SHA256, got $hash" }
          $source = Join-Path $env:GITHUB_WORKSPACE 'ci-source'
          $unpack = Join-Path $env:RUNNER_TEMP 'v582-payload-unpack'
          New-Item -ItemType Directory -Force -Path $source,$unpack | Out-Null
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          & $seven x $archive "-o$unpack" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "payload xz extraction failed: $LASTEXITCODE" }
          $tarFile = Get-ChildItem $unpack -Filter '*.tar' | Select-Object -First 1
          if (-not $tarFile) { throw 'payload xz extraction did not produce a tar file.' }
          & $seven x $tarFile.FullName "-o$source" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "payload tar extraction failed: $LASTEXITCODE" }
          $runtimeNative = Join-Path $source 'Package\com.company.webview\Runtime\Backends\CEF\Native'
          $validationSmoke = Join-Path $source 'Package\com.company.webview\Validation\CefTexture\NativeSmoke'
          if (-not (Test-Path (Join-Path $runtimeNative 'Host\CefRuntime.cpp'))) { throw 'Exact Runtime native source missing.' }
          if (-not (Test-Path (Join-Path $validationSmoke 'export_check.cpp'))) { throw 'Exact Validation smoke source missing.' }
          if (Test-Path (Join-Path $source 'Package\com.company.webview\Prototypes')) { throw 'Prototype tree unexpectedly present.' }
          "harnessVersion=58.2.0" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\harness-version.txt"
          "runtimePromotionLayout=PASS" | Set-Content "$env:GITHUB_WORKSPACE\runtime-promotion-layout.txt"

      - name: Download pinned CEF 154
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "cef_binary_$($env:CEF_VERSION)_$($env:CEF_PLATFORM)"
          $archive = Join-Path $env:RUNNER_TEMP "$base.tar.bz2"
          $url = "https://cef-builds.spotifycdn.com/$base.tar.bz2"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $info = Get-Item $archive
          if ($info.Length -lt 10MB) { throw "CEF archive unexpectedly small: $($info.Length) bytes" }
          $fs = [IO.File]::OpenRead($archive)
          try {
            $magic = New-Object byte[] 3
            [void]$fs.Read($magic,0,3)
          } finally { $fs.Dispose() }
          if ($magic[0] -ne 0x42 -or $magic[1] -ne 0x5A -or $magic[2] -ne 0x68) { throw 'CEF archive does not have BZh signature.' }
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { throw "7-Zip not found: $seven" }
          $tmp = Join-Path $env:RUNNER_TEMP 'cef-unpack'
          $root = Join-Path $env:RUNNER_TEMP 'cef-root'
          New-Item -ItemType Directory -Force -Path $tmp,$root | Out-Null
          & $seven x $archive "-o$tmp" -y
          if ($LASTEXITCODE -ne 0) { throw "CEF bzip2 extraction failed: $LASTEXITCODE" }
          $tarFile = Get-ChildItem $tmp -Filter '*.tar' | Select-Object -First 1
          if (-not $tarFile) { throw 'CEF extraction did not produce a tar file.' }
          & $seven x $tarFile.FullName "-o$root" -y
          if ($LASTEXITCODE -ne 0) { throw "CEF tar extraction failed: $LASTEXITCODE" }
          $cefRoot = Join-Path $root $base
          if (-not (Test-Path (Join-Path $cefRoot 'CMakeLists.txt'))) { throw "CEF root missing after extraction: $cefRoot" }
          "CEF_ROOT=$cefRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure native x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $native = Join-Path $env:GITHUB_WORKSPACE 'ci-source\Package\com.company.webview\Runtime\Backends\CEF\Native'
          $build = Join-Path $env:RUNNER_TEMP 'v578-native-build'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'results\native-stage'
          cmake -S $native -B $build -G "Visual Studio 17 2022" -A x64 "-DCEF_ROOT=$env:CEF_ROOT" "-DWEBVIEW_STAGE_DIR=$stage" -DUSE_SANDBOX=OFF 2>&1 | Tee-Object -FilePath results\cmake-configure.log
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          "BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build native clean Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build $env:BUILD_DIR --config Release --target CefRuntimeStage --parallel 4 2>&1 | Tee-Object -FilePath results\cmake-build.log
          if ($LASTEXITCODE -ne 0) { throw "Native build failed: $LASTEXITCODE" }
          $runtime = Join-Path $env:STAGE_DIR 'runtime\Release'
          $native = Join-Path $env:STAGE_DIR 'native\Release'
          if (-not (Test-Path (Join-Path $runtime 'CompanyWebViewCefInitSmoke.exe'))) { throw 'CEF init smoke executable missing.' }
          if (-not (Test-Path (Join-Path $runtime 'CompanyWebViewCefExportCheck.exe'))) { throw 'Export checker missing.' }
          if (-not (Test-Path (Join-Path $native 'CompanyWebViewCefTextureProbe.dll'))) { throw 'Native plugin DLL missing.' }

      - name: Verify public C ABI exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:STAGE_DIR 'runtime\Release'
          $native = Join-Path $env:STAGE_DIR 'native\Release'
          $checker = Join-Path $runtime 'CompanyWebViewCefExportCheck.exe'
          $plugin = Join-Path $native 'CompanyWebViewCefTextureProbe.dll'
          & $checker $plugin 2>&1 | Tee-Object -FilePath results\native-export-check.log
          if ($LASTEXITCODE -ne 0) { throw "Native C ABI export check failed: $LASTEXITCODE" }
          $text = Get-Content results\native-export-check.log -Raw
          if ($text -notmatch 'CefPrototype_SendExternalBeginFrame=FOUND') { throw 'CefPrototype_SendExternalBeginFrame export missing.' }

      - name: Run standalone CEF initialize smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:STAGE_DIR 'runtime\Release'
          $exe = Join-Path $runtime 'CompanyWebViewCefInitSmoke.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory $runtime -Wait -PassThru
          foreach ($name in @('cef-smoke.log','cef-smoke-cef.log')) {
            $src = Join-Path $runtime $name
            if (Test-Path $src) { Copy-Item -Force $src results }
          }
          "exitCode=$($p.ExitCode)" | Set-Content results\cef-smoke-run.log
          if ($p.ExitCode -ne 0) { throw "CEF native smoke failed: $($p.ExitCode)" }

      - name: Run refresh and D3D11 diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $runtime = Join-Path $env:STAGE_DIR 'runtime\Release'
          $refresh = Join-Path $runtime 'CompanyWebViewCefNativeRefreshControl.exe'
          if (Test-Path $refresh) {
            $p = Start-Process -FilePath $refresh -WorkingDirectory $runtime -Wait -PassThru
            "exitCode=$($p.ExitCode)" | Set-Content results\native-refresh-ci-exit.txt
            foreach ($name in @('native-refresh-result.json','native-refresh-cef.log')) {
              $src = Join-Path $runtime $name
              if (Test-Path $src) { Copy-Item -Force $src results }
            }
          }
          $bench = Join-Path $runtime 'CompanyWebViewD3D11CopyBenchmark.exe'
          if (Test-Path $bench) {
            $p = Start-Process -FilePath $bench -WorkingDirectory $runtime -Wait -PassThru
            "exitCode=$($p.ExitCode)" | Set-Content results\d3d11-copy-ci-exit.txt
            $src = Join-Path $runtime 'd3d11-copy-result.json'
            if (Test-Path $src) { Copy-Item -Force $src results }
          }

      - name: Check leftover CEF processes
        if: ${{ always() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $names = @('CompanyWebViewCefSubprocess','CompanyWebViewCefInitSmoke','CompanyWebViewCefNativeRefreshControl')
          $left = @()
          foreach ($name in $names) { $left += @(Get-Process $name -ErrorAction SilentlyContinue) }
          "leftoverCount=$($left.Count)" | Set-Content results\orphan-check.txt
          if ($left.Count -gt 0) {
            $left | Format-Table Id,ProcessName,StartTime -AutoSize | Out-String | Add-Content results\orphan-check.txt
            $left | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "Leftover CEF processes detected: $($left.Count)"
          }

      - name: Write CI summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          "## v58.3 Release Candidate Packaging + Runtime exact-source gate" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Payload SHA-256 verified" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Native x64 clean build" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Public C ABI export verification" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Standalone CefInitialize/CefShutdown smoke" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- Refresh/D3D11 results collected as hosted-runner diagnostics" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload first-pass artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneclick-v58-3-release-candidate-gate
          path: |
            results/
            payload-sha256.txt
            harness-version.txt
            v579-harness-baseline.txt
            runtime-promotion-layout.txt
          if-no-files-found: warn
