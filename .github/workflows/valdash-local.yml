name: VAL DASH Local (Windows + Frontend)

on:
  push:
    paths:
      - 'valdash-local-source.tar.xz'
      - '.github/workflows/valdash-local.yml'
      - 'VALDASH_CI.md'
  pull_request:
    paths:
      - 'valdash-local-source.tar.xz'
      - '.github/workflows/valdash-local.yml'
      - 'VALDASH_CI.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-batch:
    name: install.bat / run.bat / security tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract VAL DASH source bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path valdash-local | Out-Null
          tar -xf valdash-local-source.tar.xz -C valdash-local
          if (-not (Test-Path valdash-local/install.bat) -or -not (Test-Path valdash-local/run.bat)) {
            throw 'Expected Windows batch files are missing from source archive'
          }
      - name: Install application using install.bat
        shell: cmd
        working-directory: valdash-local
        run: call install.bat
      - name: Install test dependencies and run backend tests
        shell: cmd
        working-directory: valdash-local
        run: |
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          .venv\Scripts\python.exe -m pytest -q backend\tests
      - name: Run run.bat and verify loopback API
        shell: pwsh
        working-directory: valdash-local
        run: |
          $proc = Start-Process -FilePath $env:ComSpec -ArgumentList '/c', 'run.bat' -WorkingDirectory (Get-Location).Path -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($response.ok -and $response.mode -eq 'demo' -and $response.live -eq $false) {
                  $healthy = $true
                  break
                }
              } catch { }
            }
            if (-not $healthy) { throw 'run.bat did not start the demo API' }
            $blocked = $false
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/overview' -TimeoutSec 4 | Out-Null
            } catch {
              $blocked = $_.Exception.Response.StatusCode -eq 401
            }
            if (-not $blocked) { throw 'Unauthenticated overview request was not blocked' }
            Write-Host '[OK] run.bat started server; health endpoint and unauthorized access verified.'
          } finally {
            & taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          }

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract VAL DASH source bundle
        run: |
          mkdir -p valdash-local
          tar -xf valdash-local-source.tar.xz -C valdash-local
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        working-directory: valdash-local/frontend
        run: npm install --no-audit --no-fund
      - name: Build React + TypeScript
        working-directory: valdash-local/frontend
        run: npm run build
