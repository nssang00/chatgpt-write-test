name: WebView2 Overlay v58.5.0 Phase1B Build
on:
  push:
    branches: [feature/webview2-overlay-v58-5-0]
    paths:
      - 'Prototypes/WebView2Overlay/**'
      - '.github/workflows/webview2-overlay-v58-5-0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static isolation contract
        shell: pwsh
        run: python Prototypes/WebView2Overlay/Validation/verify_contract.py
      - name: Install pinned stable SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:RUNNER_TEMP/wv2sdk" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet failed' }
      - name: Configure x64
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'wv2sdk/Microsoft.Web.WebView2.1.0.4258.31'
          cmake -S Prototypes/WebView2Overlay/Native -B build-wv2 -G 'Visual Studio 17 2022' -A x64 "-DWEBVIEW2_SDK_ROOT=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'CMake failed' }
      - name: MSVC Release build
        shell: pwsh
        run: |
          cmake --build build-wv2 --config Release --clean-first
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path build-wv2/Release/CompanyWebView2OverlayProbe.exe)) { throw 'Missing EXE' }
      - name: Record build-only scope
        shell: pwsh
        run: |
          "WebView2 v58.5.0 Phase1B: compiled only. Windows interactive/Unity/IME verification pending." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: webview2-overlay-v58-5-0-win-x64-probe
          path: build-wv2/Release/CompanyWebView2OverlayProbe.exe
