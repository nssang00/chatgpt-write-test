name: Unity Dual CEF readonly-stage regression (no Player claim)
on:
  push:
    branches:
      - feature/unified-unity-v58-6-0-readonly-stage-fix
      - feature/unified-unity-v58-6-0-dual-utf16-uv-fix
      - feature/unified-unity-v58-6-0-cef-3d-cube-proof
      - feature/unified-unity-v58-6-0-front-uv-css-pixel-proof
      - feature/unified-unity-v58-6-0-cube-uv-orientation-fix
      - feature/unified-unity-v58-6-0-manual-ime-dpi-zorder
      - feature/unified-unity-v58-6-0-dpi-evidence-integrity
      - feature/unified-unity-v58-6-0-ime-monitor-scale-diag
      - feature/unified-unity-v58-6-0-persistent-player-cache
      - feature/unified-unity-v58-7-0-upm-product-preview
      - feature/unified-unity-v58-7-0-upm-psscriptroot-fix
      - feature/unified-unity-v58-7-0-upm-reuse-cef-stage
      - feature/unified-unity-v58-7-1-oneclick-upm-autobuild
      - fix/upm-unity2022-packageinfo-cs0104
      - fix/upm-v58-7-3-rectint-cs0019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Managed WebView2 UTF-16 import ABI regression
        shell: pwsh
        run: |
          dotnet run --configuration Release --project Integration/UnityUnified-v58.6.0-preview/Tests/UnifiedContract.Tests.csproj
          if($LASTEXITCODE -ne 0){throw 'Managed ABI contract failed'}
          dotnet build --configuration Release Integration/UnityUnified-v58.6.0-preview/Validation/UnityHostCompile.csproj
          if($LASTEXITCODE -ne 0){throw 'Unity scene host C# compilation failed'}
          dotnet build --configuration Release Integration/UnityUnified-v58.6.0-preview/UnityProduct/Validation/ProductPanelCompile.csproj
          if($LASTEXITCODE -ne 0){throw 'Unity UPM product panel C# compilation failed'}
          dotnet build --configuration Release Integration/UnityUnified-v58.6.0-preview/UnityProduct/Validation/AutoBuildCompile.csproj
          if($LASTEXITCODE -ne 0){throw 'Product Unity batch build method C# compilation failed'}
          dotnet build --configuration Release Integration/UnityUnified-v58.6.0-preview/UnityProduct/Validation/BuildCopyCompile.csproj
          if($LASTEXITCODE -ne 0){throw 'Unity 2022 PackageInfo ambiguity regression failed'}
      - name: Contract and PowerShell 5.1 syntax checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r='Integration/UnityUnified-v58.6.0-preview'
          foreach($name in @('verify_dual_player.py','verify_cef_bootstrap.py','verify_integration.py','verify_screen_automation_contract.py','verify_cube_3d.py','verify_front_uv_css.py','verify_manual_compatibility.py')){
            python "$r/Validation/$name"
            if($LASTEXITCODE -ne 0){throw "Python contract failed: $name"}
          }
          python "$r/UnityProduct/Validation/verify_upm_product.py"
          if($LASTEXITCODE -ne 0){throw 'Unity UPM product static contract failed'}
          python "$r/UnityProduct/Validation/verify_auto_product.py"
          if($LASTEXITCODE -ne 0){throw 'Unity one-click automation source contract failed'}
          # Simulate a prior CS0019 failure without launching Unity: the resolver
          # must patch the embedded panel and preserve the existing project.
          $recover="$r/UnityProduct/Recover-CS0104.ps1"
          $rt=$null;$re=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $recover).Path,[ref]$rt,[ref]$re)|Out-Null
          if(@($re).Count -gt 0){throw 'Cached Unity CS0019 recovery PowerShell parser failed'}
          $originalAppData=$env:LOCALAPPDATA
          $fakeRoot=Join-Path $env:RUNNER_TEMP 'upm-cs0019-fake-user'
          $fakeWork=Join-Path $fakeRoot 'CWV58\\upm-product\\aaaaaaaaaaaaaaaaaaaaaaaa'
          $fakeProject=Join-Path $fakeWork 'UnityProject'
          $fakePackage=Join-Path $fakeProject 'Packages\\com.company.webview'
          New-Item -ItemType Directory -Path (Join-Path $fakePackage 'Runtime\\UnifiedExperimental') -Force|Out-Null
          New-Item -ItemType Directory -Path (Join-Path $fakePackage 'Editor') -Force|Out-Null
          $realPanel=Get-Content "$r/UnityProduct/Runtime/UnifiedWebViewPanel.cs" -Raw
          $newRect='if (bounds.x != lastBounds.x || bounds.y != lastBounds.y ||' + [Environment]::NewLine + '                            bounds.width != lastBounds.width || bounds.height != lastBounds.height)'
          if(-not $realPanel.Contains($newRect)){throw 'RectInt regression fixture source changed unexpectedly'}
          $oldPanel=$realPanel.Replace($newRect,'if (bounds != lastBounds)')
          Set-Content -LiteralPath (Join-Path $fakePackage 'Runtime\\UnifiedExperimental\\UnifiedWebViewPanel.cs') -Value $oldPanel -Encoding UTF8
          Copy-Item "$r/UnityProduct/Editor/UnifiedWebViewBuildCopy.cs" (Join-Path $fakePackage 'Editor\\UnifiedWebViewBuildCopy.cs')
          Set-Content -LiteralPath (Join-Path $fakePackage 'Editor\\UnifiedWebViewAutoBuild.cs') -Value '// fixture builder' -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $fakeWork 'UnityEditorAutoBuild.log') -Value "Packages/com.company.webview/Runtime/UnifiedExperimental/UnifiedWebViewPanel.cs(141,29): error CS0019: Operator '!=' cannot be applied to operands of type 'RectInt' and 'RectInt'" -Encoding UTF8
          $env:LOCALAPPDATA=$fakeRoot
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $recover -UnityExe (Join-Path $fakeRoot 'missing-Unity.exe')
            if($LASTEXITCODE -ne 1){throw 'Expected fake recovery to stop before launching nonexistent Unity'}
            $fixedPanel=Get-Content (Join-Path $fakePackage 'Runtime\\UnifiedExperimental\\UnifiedWebViewPanel.cs') -Raw
            if($fixedPanel.Contains('if (bounds != lastBounds)') -or -not $fixedPanel.Contains('bounds.width != lastBounds.width')){throw 'CS0019 recovery failed to patch old Unity project'}
            if(-not (Test-Path -LiteralPath (Join-Path $fakePackage 'Runtime\\UnifiedExperimental\\UnifiedWebViewPanel.cs.before-cs0019-fix.bak'))){throw 'CS0019 source backup missing'}
            $recoverSummary=Get-Content "$r/UnityProduct/AutoResults/product-auto-summary.json" -Raw|ConvertFrom-Json
            if(-not $recoverSummary.fixedCS0019 -or -not $recoverSummary.reusedExistingProject -or $recoverSummary.unityProjectRecreated){throw 'CS0019 recovery summary is wrong'}
            Write-Host 'UPM Unity CS0019 reuse/recovery fixture PASS'
          } finally {
            $env:LOCALAPPDATA=$originalAppData
          }

          & "$r/UnityProduct/Validation/Test-CefRuntimeFinder.ps1"
          if(-not $?){throw 'Offline CEF runtime layout resolver failed'}
          $finder="$r/UnityProduct/Find-CefRuntime.ps1"
          $ft=$null;$fe=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $finder).Path,[ref]$ft,[ref]$fe)|Out-Null
          if(@($fe).Count -gt 0){throw 'CEF reuse helper PowerShell parser failed'}
          $src="$r/UnityProduct/Build-UnityProduct.ps1"
          $t=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $src).Path,[ref]$t,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw 'Unity UPM packager PowerShell parser failed'}
          $auto="$r/UnityProduct/Run-Auto.ps1"
          $at=$null;$ae=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $auto).Path,[ref]$at,[ref]$ae)|Out-Null
          if(@($ae).Count -gt 0){throw 'Unity auto UPM PowerShell parser failed'}
          # Verify default path binding reaches explicit missing-input validation.
          # This catches PSScriptRoot being empty while param() is evaluated.
          $fake=Join-Path $env:RUNNER_TEMP 'intentionally-missing-verified-cef-source.zip'
          try {
            & $src -CefArchive $fake -WebView2Dll $fake -OutputRoot (Join-Path $env:RUNNER_TEMP 'upm-path-smoke')
            throw 'UPM assembler unexpectedly succeeded with nonexistent assets'
          } catch {
            if($_.Exception.Message -notmatch 'Required validated file missing:'){
              throw ('UPM assembler failed before path resolution: '+$_.Exception.Message)
            }
            Write-Host 'UPM PowerShell parameter binding and default paths PASS'
          }
          foreach($name in @('Run-Dual.ps1','Ensure-CefRuntime.ps1','Install-UnifiedManagedSources.ps1','Screen-Automation.ps1','Verify-TextureUvMarkers.ps1','UnityPlayerCache.ps1')){
            $file=(Resolve-Path "$r/DualPlayer/$name").Path
            $tokens=$null;$errs=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errs)|Out-Null
            if(@($errs).Count -gt 0){throw "PowerShell parser failed: $name"}
          }
          $run=Get-Content "$r/DualPlayer/Run-Dual.ps1" -Raw
          if($run -match '& \$importer' -or $run -notmatch '\$source=\$legacySource'){
            throw 'Runner must use legacy native stage read-only and must not auto-import into deep kit root'
          }
          if($run -notmatch 'StageCef \$CefRuntimeDir \$dest'){
            throw 'Runner no longer stages CEF into short scratch Unity Assets'
          }
          $bootstrap=Get-Content "$r/DualPlayer/Ensure-CefRuntime.ps1" -Raw
          if($bootstrap -match 'Expand-Archive' -or $bootstrap -notmatch 'ZipFileExtensions'){
            throw 'Pinned source extraction must filter out long documentation paths'
          }
      - name: Persistent Unity Player cache HIT/MISS and invalidation fixtures
        shell: powershell
        run: |
          & 'Integration/UnityUnified-v58.6.0-preview/Validation/Test-UnityPlayerCache.ps1'
          if(-not $?){throw 'Unity Player cache fixture failed'}
      - name: Front-face screenshot marker scanner positive and negative fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $base=Join-Path $env:RUNNER_TEMP 'uv-screen-fixture'
          $script=(Resolve-Path 'Integration/UnityUnified-v58.6.0-preview/DualPlayer/Verify-TextureUvMarkers.ps1').Path
          foreach($test in @('upright','inverted')){
            $dir=Join-Path $base $test
            $shots=Join-Path $dir 'screenshots'
            New-Item -ItemType Directory -Force -Path $shots | Out-Null
            foreach($name in @('01_initial','03_restored')){
              $bitmap=[Drawing.Bitmap]::new(800,600)
              $gfx=[Drawing.Graphics]::FromImage($bitmap)
              $blue=[Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(40,77,255))
              $red=[Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(229,59,85))
              try {
                $gfx.Clear([Drawing.Color]::White)
                $blueY=if($test -eq 'upright'){130}else{410}
                $redY=if($test -eq 'upright'){410}else{130}
                $gfx.FillRectangle($blue,50,$blueY,300,70)
                $gfx.FillRectangle($red,50,$redY,300,70)
                $bitmap.Save((Join-Path $shots ($name+'.png')),[Drawing.Imaging.ImageFormat]::Png)
              } finally {$red.Dispose();$blue.Dispose();$gfx.Dispose();$bitmap.Dispose()}
            }
            & $script -EvidenceFolder $dir
            $result=Get-Content (Join-Path $dir 'uv-visual-evidence.json') -Raw | ConvertFrom-Json
            $expected=if($test -eq 'upright'){'PASS'}else{'FAIL'}
            if($result.status -ne $expected){throw "UV screenshot fixture $test expected $expected, got $($result.status)"}
          }
      - name: Offline CEF discovery and runtime-only Unity installation fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=(Resolve-Path 'Integration/UnityUnified-v58.6.0-preview').Path
          $test=Join-Path $env:RUNNER_TEMP 'readonly-oneclick-한글'
          $legacy=Join-Path $test 'oneclick_bundle'
          $native=Join-Path $legacy 'Build/cef-native/stage/native/Release'
          $runtime=Join-Path $legacy 'Build/cef-native/stage/runtime/Release'
          $managed=Join-Path $legacy 'Package/com.company.webview/Runtime'
          $docs=Join-Path $legacy 'Package/com.company.webview/Documentation~'
          New-Item -ItemType Directory -Force -Path $native,(Join-Path $runtime 'locales'),$managed,$docs | Out-Null
          foreach($n in @('CompanyWebViewCefTextureProbe.dll')){
            New-Item -ItemType File -Force -Path (Join-Path $native $n) | Out-Null
          }
          foreach($n in @('libcef.dll','CompanyWebViewCefSubprocess.exe','icudtl.dat','resources.pak','chrome_100_percent.pak','locales/en-US.pak')){
            New-Item -ItemType File -Force -Path (Join-Path $runtime $n) | Out-Null
          }
          Set-Content -LiteralPath (Join-Path $managed 'WebView.cs') -Value '// protected managed fixture'
          Set-Content -LiteralPath (Join-Path $docs 'PHASE1_CEF_INTERACTION_REAL_INPUT_IME_AUDIT.md') -Value 'protected documentation fixture'
          $kit=Join-Path $test 'CompanyWebView_Dual_OneClick_v58_6_0/oneclick_bundle'
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          $helper=(Resolve-Path "$r/DualPlayer/Ensure-CefRuntime.ps1").Path
          $result=@(& $helper -BundleRoot $kit -UnityExe 'not-needed-offline' -NoAutoDownload)
          $expected=Join-Path $legacy 'Build/cef-native/stage'
          if($result.Count -ne 1 -or $result[0] -ne [IO.Path]::GetFullPath($expected)){
            throw 'Existing sibling CEF compiled stage not found'
          }
          $assets=Join-Path $env:RUNNER_TEMP 'CWV58/dual-regression/UnityProject/Assets'
          $install=(Resolve-Path "$r/DualPlayer/Install-UnifiedManagedSources.ps1").Path
          & $install -CefPackagePath (Split-Path $managed -Parent) -UnityAssetsDir $assets -KitRoot $r
          if(-not (Test-Path -LiteralPath (Join-Path $assets 'CompanyWebView/Runtime/UnifiedExperimental/UnifiedWebView.cs'))){
            throw 'Missing unified facade in short scratch Unity Assets'
          }
          if(Test-Path -LiteralPath (Join-Path $assets 'CompanyWebView/Documentation~')){
            throw 'Long documentation was copied to Unity Assets'
          }
          if((Get-Content (Join-Path $managed 'WebView.cs') -Raw) -notmatch 'protected managed fixture'){
            throw 'Validated original CEF managed source was modified'
          }
          Write-Host 'Offline fixture PASS: readonly source, CEF discovery, runtime-only Assets. NO UNITY PLAYER EXECUTED.'
