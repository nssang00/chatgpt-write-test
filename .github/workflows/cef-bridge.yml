name: NativeWeb CEF Bridge

on:
  push:
    branches: [main]
    paths:
      - "src/browser/cef/**"
      - "src/core/**"
      - "include/nativeweb/**"
      - "tests/integration/cef/**"
      - ".github/workflows/cef-bridge.yml"
      - "tools/cef/**"
  workflow_dispatch:

env:
  CEF_CACHE_DIR: ${{ github.workspace }}/.cache/cef/archive
  CEF_EXTRACT_DIR: ${{ github.workspace }}/.cache/cef/extracted

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CEF build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libnss3-dev \
            libxss-dev \
            libasound2-dev \
            libdrm-dev \
            libgbm-dev \
            libxkbcommon-dev \
            xvfb

      - name: Cache pinned CEF archive
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_CACHE_DIR }}
          key: cef-linux64-144.0.36-g78619fd

      - name: Bootstrap pinned CEF
        shell: bash
        run: |
          CEF_ROOT="$(bash tools/cef/bootstrap_linux.sh "$CEF_CACHE_DIR" "$CEF_EXTRACT_DIR" | tail -n 1)"
          echo "CEF_ROOT=$CEF_ROOT" >> "$GITHUB_ENV"

      - name: Configure NativeWeb CEF integration
        shell: bash
        run: |
          cmake \
            -S tests/integration/cef \
            -B cef-nativeweb-build \
            -DCEF_ROOT="$CEF_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SANDBOX=OFF

      - name: Build NativeWeb CEF integration
        shell: bash
        run: |
          cmake --build cef-nativeweb-build \
            --config Release \
            --target nativeweb_cef_bridge_integration \
            --parallel 2

      - name: Run real JS to C++ Promise bridge
        shell: bash
        run: |
          TEST_HTML="$(realpath tests/integration/cef/bridge_test.html)"
          TEST_URL="file://$TEST_HTML"

          set +e
          timeout 30s xvfb-run -a \
            cef-nativeweb-build/bin/nativeweb_cef_bridge_integration \
            --no-sandbox \
            --url="$TEST_URL"
          rc=$?
          set -e

          if [[ "$rc" -eq 124 ]]; then
            echo "NativeWeb CEF bridge timed out" >&2
            exit 1
          fi

          exit "$rc"
