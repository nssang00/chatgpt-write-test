name: Cyclone DDS Corrected Vendor Baseline
on:
  push:
    branches: [diagnostic/cyclone-wire-timing-20261029]
    paths: [.github/workflows/cyclone-corrected-baseline.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  corrected:
    name: 'N=${{ matrix.nodes }} loss=${{ matrix.loss }} warmup=${{ matrix.warmup }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {nodes: 10, loss: 0, warmup: 17}
          - {nodes: 30, loss: 0, warmup: 17}
          - {nodes: 40, loss: 0, warmup: 17}
          - {nodes: 30, loss: 10, warmup: 38}
          - {nodes: 40, loss: 0, warmup: 38}
          - {nodes: 40, loss: 10, warmup: 38}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Cyclone DDS with matched configuration
        run: |
          python -m pip install cyclonedds==11.0.1
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Re-run vendor comparison with batched DataReader and KeepAll
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/vendor_threshold_run.py \
            --backend cyclone --nodes '${{ matrix.nodes }}' \
            --loss '${{ matrix.loss }}' \
            --warmup '${{ matrix.warmup }}' --spread 4 \
            --timeout 75 --messages 2 --seed 1 \
            --output corrected-cyclone
          cat corrected-cyclone/results.csv
      - name: Upload all node logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'cyclone-corrected-${{ matrix.nodes }}-${{ matrix.loss }}-${{ matrix.warmup }}'
          path: corrected-cyclone/
          if-no-files-found: warn
