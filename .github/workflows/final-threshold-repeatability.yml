name: Final Threshold Repeatability Gate
on:
  push:
    branches: [benchmark/vendor-threshold-matched-20261029]
    paths: [.github/workflows/final-threshold-repeatability.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: '${{ matrix.backend }} N=40 loss=${{ matrix.loss }} seed=${{ matrix.seed }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {backend: multicast, loss: 0, seed: 2}
          - {backend: multicast, loss: 0, seed: 3}
          - {backend: hybrid, loss: 0, seed: 2}
          - {backend: hybrid, loss: 0, seed: 3}
          - {backend: zenoh, loss: 0, seed: 2}
          - {backend: cyclone, loss: 0, seed: 2}
          - {backend: multicast, loss: 10, seed: 1}
          - {backend: multicast, loss: 10, seed: 2}
          - {backend: hybrid, loss: 10, seed: 1}
          - {backend: hybrid, loss: 10, seed: 2}
          - {backend: zenoh, loss: 10, seed: 1}
          - {backend: cyclone, loss: 10, seed: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native bindings and configure buffers
        run: |
          python -m pip install eclipse-zenoh==1.10.1 cyclonedds==11.0.1
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Measure reliable delivery with fair late publication
        run: |
          set -euo pipefail
          case '${{ matrix.backend }}' in
            zenoh|cyclone)
              sudo -E "$(which python)" bench/discovery/vendor_threshold_run.py \
                --backend '${{ matrix.backend }}' --nodes 40 \
                --loss '${{ matrix.loss }}' --seed '${{ matrix.seed }}' \
                --warmup 38 --spread 4 --timeout 75 --messages 2 \
                --output final-40-evidence
              ;;
            multicast|hybrid)
              sudo -E "$(which python)" bench/discovery/pubsub_run.py \
                --sizes 40 --modes '${{ matrix.backend }}' \
                --losses '${{ matrix.loss }}' \
                --discovery 38 --timeout 37 \
                --messages 2 --publishers 40 --publish-spread 4 \
                --seeds '${{ matrix.seed }}' \
                --repair-fanout 4 --repair-interval 1.2 \
                --output final-40-evidence
              ;;
          esac
          cat final-40-evidence/results.csv
      - name: Keep reproducible raw node measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'final40-${{ matrix.backend }}-loss${{ matrix.loss }}-seed${{ matrix.seed }}'
          path: final-40-evidence/
          if-no-files-found: warn
