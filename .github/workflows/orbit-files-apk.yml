name: Orbit Files Android APK
on:
  push:
    branches:
      - feat/orbit-files-apk
    paths:
      - 'android/orbit-files-source/**'
      - 'android/ORBIT_FILES.md'
      - '.github/workflows/orbit-files-apk.yml'
  pull_request:
    paths:
      - 'android/orbit-files-source/**'
      - 'android/ORBIT_FILES.md'
      - '.github/workflows/orbit-files-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    name: Build debug APK (Android 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify Orbit Files source
        shell: bash
        run: |
          set -euo pipefail
          cat android/orbit-files-source/part-*.b64 | base64 --decode > orbit-files-source.tar.xz
          echo "b60b69d8949d4b5209109fac740cba971db4f117d92653a56775e943b1bd3254  orbit-files-source.tar.xz" | sha256sum -c -
          tar -xJf orbit-files-source.tar.xz
          test -f OrbitFiles/app/src/main/AndroidManifest.xml
          test -f OrbitFiles/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and assemble Android APK
        working-directory: OrbitFiles
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK=OrbitFiles/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitFiles-0.1.0-debug-apk
          path: OrbitFiles/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
