name: Xytron CLI Bootstrap
on:
  pull_request:
  workflow_dispatch:
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cli -DNATIVEWEB_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build native CLI separately
        run: cmake --build build-cli --config Release --target xytron
      - name: Scaffold regression
        run: ctest --test-dir build-cli -C Release -R "^cli.scaffold$" --output-on-failure
      - name: Build NativeWeb Core SDK for generated plugin
        run: cmake --build build-cli --config Release --target nativeweb_core
      - name: Install generated SDK
        run: cmake --install build-cli --config Release --prefix "${{ github.workspace }}/build-cli/sdk"
      - name: Verify installed Core SDK through xytron doctor
        run: |
          cmake -E chdir . "${{ github.workspace }}/build-cli/${{ matrix.os == 'windows-latest' && 'Release/xytron.exe' || 'xytron' }}" doctor --sdk "${{ github.workspace }}/build-cli/sdk"
      - name: Compile generated plugin through native xytron CLI
        run: cmake -E chdir build-cli/xytron-cli-smoke "${{ github.workspace }}/build-cli/${{ matrix.os == 'windows-latest' && 'Release/xytron.exe' || 'xytron' }}" plugin build camera --sdk "${{ github.workspace }}/build-cli/sdk"
      - name: Configure plugin from xytron scaffold
        run: cmake -S build-cli/xytron-cli-smoke/plugins/camera -B build-cli/generated-camera -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-cli/sdk"
      - name: Build real plugin DLL or SO from generated template
        run: cmake --build build-cli/generated-camera --config Release

      - name: Compile generated plugin loader regression
        run: cmake --build build-cli --config Release --target nativeweb_generated_xytron_plugin_regression
      - name: Load CLI generated DLL or SO and invoke real C ABI
        run: |
          cmake -E chdir . "${{ github.workspace }}/build-cli/tests/plugin/${{ matrix.os == 'windows-latest' && 'Release/nativeweb_generated_xytron_plugin_regression.exe' || 'nativeweb_generated_xytron_plugin_regression' }}" "${{ github.workspace }}/build-cli/xytron-cli-smoke/plugins/camera/build/${{ matrix.os == 'windows-latest' && 'Release/camera.dll' || 'libcamera.so' }}"
