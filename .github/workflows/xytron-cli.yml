name: Xytron CLI Bootstrap
on:
  pull_request:
  workflow_dispatch:
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cli -DNATIVEWEB_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build native CLI separately
        run: cmake --build build-cli --config Release --target xytron
      - name: Scaffold regression
        run: ctest --test-dir build-cli -C Release -R "^cli.scaffold$" --output-on-failure
      - name: Build NativeWeb Core SDK for generated plugin
        run: cmake --build build-cli --config Release --target nativeweb_core
      - name: Install generated SDK
        run: cmake --install build-cli --config Release --prefix "${{ github.workspace }}/build-cli/sdk"
      - name: Configure plugin from xytron scaffold
        run: cmake -S build-cli/xytron-cli-smoke/plugins/camera -B build-cli/generated-camera -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build-cli/sdk"
      - name: Build real plugin DLL or SO from generated template
        run: cmake --build build-cli/generated-camera --config Release
