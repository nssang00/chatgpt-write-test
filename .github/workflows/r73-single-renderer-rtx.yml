name: R73 Candidate Single Renderer RTX 12 Oracle Fallback
on:
  push:
    branches: [ci/r73-exclusive-renderer-rtx]
    paths:
      - '.github/workflows/r73-single-renderer-rtx.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r73-single-renderer-rtx
  cancel-in-progress: true
jobs:
  self-contained-rtx:
    runs-on: self-hosted
    timeout-minutes: 55
    steps:
      - name: Checkout NEW repository, no old harness
        uses: actions/checkout@v4
        with:
          repository: rydolabs/ol-vt-gl-boost
          ref: e26436d0cfed8467908d9d0afd717126e857d16a
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require physical GPU, locked source and 17 CPU/Worker regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $g=@(Get-CimInstance Win32_VideoController|Select-Object Name,DriverVersion)
          if(-not ($g|Where-Object {$_.Name -match 'NVIDIA.*RTX 5060 Ti'})){throw 'NVIDIA RTX 5060 Ti required'}
          $sha=(git -C candidate rev-parse HEAD).Trim()
          if($sha -ne 'e26436d0cfed8467908d9d0afd717126e857d16a'){throw 'Source drift'}
          New-Item -ItemType Directory -Force candidate\artifacts\r69 | Out-Null
          $g | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 candidate\artifacts\r69\GPU.json
          $sha | Set-Content candidate\artifacts\r69\PINNED_SHA.txt
          Push-Location candidate
          try{
            npm ci --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'Pinned npm/vendor installation failed'}
            npm test
            if($LASTEXITCODE -ne 0){throw '17 tests failed'}
            npm run test:contract
            if($LASTEXITCODE -ne 0){throw 'Source bytes/default OFF failed'}
            npm run test:examples
            if($LASTEXITCODE -ne 0){throw 'Comparison example contract failed'}
            npm run test:facade
            if($LASTEXITCODE -ne 0){throw 'Unified facade test failed'}
            npm run test:compat
            if($LASTEXITCODE -ne 0){throw 'R69 legacy compat regression failed'}
            npm run test:r73
            if($LASTEXITCODE -ne 0){throw 'R73 gate test failed'}
            npm run test:vendor
            if($LASTEXITCODE -ne 0){throw 'R69 vendor npm/patch contract failed'}
          }finally{Pop-Location}
      - name: Install Playwright and download independent MVT fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location candidate
          try{
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
            if($LASTEXITCODE -ne 0){throw 'Playwright install failed'}
            npm run test:rtx:prepare
            if($LASTEXITCODE -ne 0){throw 'R46 32 distinct MVT fixture failed'}
          }finally{Pop-Location}
      - name: Fully independent migrated RTX test harness DPR1/2 12-case
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location candidate
          try{
            npm run test:rtx
            if($LASTEXITCODE -ne 0){throw 'R69 self-contained RTX pixel/tile oracle failed'}
            $r=Get-Content artifacts\rtx-r61\summary.json -Raw | ConvertFrom-Json
            if(-not $r.pass -or $r.checked -ne 12){throw 'R69 12 matrix incomplete'}
            Write-Host 'R73_SOURCE_ONLY_12_RTX_PIXEL_ORACLES_PASS'
          }finally{Pop-Location}
      - name: Full stock OL recovery after real input
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location candidate
          try{
            npm run test:rtx:rollback
            if($LASTEXITCODE -ne 0){throw 'R69 self-contained stock OL recovery failed'}
            $r=Get-Content artifacts\rtx-rollback\result.json -Raw | ConvertFrom-Json
            if(-not $r.pass -or @($r.checks).Count -lt 8){throw 'Recovery evidence invalid'}
            Write-Host 'R73_SOURCE_ONLY_OL_FALLBACK_PASS'
          }finally{Pop-Location}
      - name: Preserve self-contained raw GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r73-source-only-rtx-raw
          path: candidate/artifacts/**
          retention-days: 30
          if-no-files-found: warn
