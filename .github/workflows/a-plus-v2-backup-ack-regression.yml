name: Aplus V2 Confirmed Backup ACK Regression
on:
  push:
    branches: [experiment/a-plus-v2-peer-assisted-repair-20261030]
    paths: [.github/workflows/a-plus-v2-backup-ack-regression.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {n: 20, loss: 10, seed: 1}
          - {n: 50, loss: 10, seed: 1}
          - {n: 100, loss: 10, seed: 1}
          - {n: 200, loss: 10, seed: 1}
          - {n: 100, loss: 10, seed: 2}
    name: 'N=${{ matrix.n }} loss=${{ matrix.loss }} seed=${{ matrix.seed }} confirmed-kill'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Preflight
        run: |
          python -m py_compile bench/discovery/pubsub_node.py bench/discovery/pubsub_run.py
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Wait for true backup quorum then SIGKILL publisher
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.n }}' in
            20) disc=6; timeout=55; spread=3 ;;
            50) disc=12; timeout=85; spread=7 ;;
            100) disc=18; timeout=115; spread=12 ;;
            200) disc=27; timeout=145; spread=18 ;;
          esac
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes '${{ matrix.n }}' --modes multicast --losses '${{ matrix.loss }}' \
            --v4 --messages 20 --publishers '${{ matrix.n }}' \
            --payload-bytes 128 --publish-interval 0.08 \
            --discovery "$disc" --timeout "$timeout" --publish-spread "$spread" \
            --repair-fanout 6 --repair-interval 0.9 --seeds '${{ matrix.seed }}' \
            --fault crash_confirmed --peer-repair --peer-replicas 6 \
            --peer-cache-limit 2048 --backup-quorum 2 \
            --output backup-results
          python - <<'PY'
          import json
          r=json.load(open('backup-results/results.json'))[0]
          print('REPLICA_ACK_RESULT '+json.dumps(r))
          assert r['crashed_nodes']==[0],r
          assert r['backup_confirmed_origins']>=1,r
          assert r['reported']==r['nodes']-1,r
          assert r['discovery_success'] and r['pubsub_success'],r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'backup-N${{ matrix.n }}-loss${{ matrix.loss }}-seed${{ matrix.seed }}'
          path: backup-results/
