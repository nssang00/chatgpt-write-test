name: Round19 CPU Join versus GPU Join RTX
on:
  push:
    paths:
      - .github/workflows/m5-round19-cpu-join-rtx.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  join-comparison:
    runs-on: self-hosted
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare original Round18 and CPU-Join variants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare'
          if(-not (Test-Path (Join-Path $source 'tests\round14_gpu_compare\oneclick.mjs'))){throw 'Round14 fixture missing'}
          $gpu=Get-CimInstance Win32_VideoController | Where-Object {$_.Name -match 'NVIDIA.*RTX'}
          if(-not $gpu){throw 'RTX missing'}
          $patches=@('round14_apply_capture_fix.mjs','apply_backend_msaa_optin.mjs','apply_ol_stroke_defaults_variant.mjs','apply_no_line_discard_variant.mjs','apply_round18_tile_scissor.mjs','apply_round18_layer_fbo.mjs','apply_round18_polygon_stroke_noclip.mjs','apply_round18_flat_stroke_direct.mjs')
          foreach($variant in @('gpu','cpu')){
            $dest=Join-Path $env:GITHUB_WORKSPACE ('r19-join-'+$variant)
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item (Join-Path $source '*') $dest -Recurse -Force
            if(Test-Path (Join-Path $dest 'RESULTS')){Remove-Item (Join-Path $dest 'RESULTS') -Recurse -Force}
            foreach($patch in $patches){
              $file=Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch)
              node --check $file
              if($LASTEXITCODE -ne 0){throw "Syntax error $patch"}
              node $file $dest
              if($LASTEXITCODE -ne 0){throw "Apply error $patch"}
            }
            if($variant -eq 'cpu'){
              node m5-gpu/apply_round19_cpu_join.mjs $dest
              if($LASTEXITCODE -ne 0){throw 'CPU join switch failed'}
            }
            Push-Location $dest
            node tests/verify_round14_loop_and_style.mjs
            if($LASTEXITCODE -ne 0){throw "$variant CPU 68-parity failed"}
            node tests/verify_direct_feature_gpu_draw.mjs
            if($LASTEXITCODE -ne 0){throw "$variant FakeGL regression"}
            node tests/round14_gpu_compare/oneclick.mjs --self-test
            if($LASTEXITCODE -ne 0){throw "$variant self test"}
            Pop-Location
          }
      - name: RTX verified original and CPU Join A/B
        shell: powershell
        run: |
          foreach($variant in @('gpu','cpu')){
            Push-Location (Join-Path $env:GITHUB_WORKSPACE ('r19-join-'+$variant))
            node tests/round14_gpu_compare/oneclick.mjs --rounds=2 --headless
            $code=$LASTEXITCODE
            Pop-Location
            if($code -ne 0){throw "RTX join variant $variant incomplete"}
          }
      - name: Upload RGBA8 and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r19-cpu-join-rtx
          retention-days: 30
          if-no-files-found: warn
          path: |
            r19-join-gpu/RESULTS/**
            r19-join-cpu/RESULTS/**
      - name: Exact pixel equality acceptance
        shell: powershell
        run: |
          $dir=Join-Path $env:GITHUB_WORKSPACE 'r19-join-cpu\RESULTS'
          $file=Get-ChildItem $dir -Filter manifest.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $file){throw 'No actual result'}
          $m=Get-Content $file.FullName -Raw | ConvertFrom-Json
          $m.rows | Format-Table scene,pixelDiffRuns,pixelExact,m5ChangePercent
          if(-not $m.complete -or -not $m.pixelParityAll -or -not $m.withinRendererStable){throw 'CPU-JOIN_PIXEL_PARITY_NOT_EXACT'}
