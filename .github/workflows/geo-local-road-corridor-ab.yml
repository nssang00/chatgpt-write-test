name: Seoul exact-footprint local road corridor controlled A-B
on:
  push:
    branches:
      - experiment/seoul-local-road-corridor-20261123
    paths:
      - .github/workflows/geo-local-road-corridor-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: geobench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Legacy road and OSM-tag regressions
        run: |
          npm run test:roads
          node test_road_profile.mjs
          node test_roadbed_integrated.mjs
          node test_road_render_shape.mjs
          node test_osm_3d_tags.mjs
      - name: Exact asphalt polygon footprint and 3m local roadbed budget
        run: node test_local_road_corridor.mjs
  frozen-source-seoul:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: geobench
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GEO_VISUAL_TERRAIN_SMOOTH: '1'
      GEO_ROADBED_INTEGRATED: '1'
      GEO_ROAD_RENDER_SMOOTH: '1'
      GEO_LOW_LOD_NO_ROAD_EDGE: '1'
      GEO_OSM_SNAPSHOT_PATH: public/osm-snapshot.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Freeze OSM snapshot and DEM precisely once
        run: GEO_CAPTURE_OSM_SNAPSHOT=1 node generate.mjs
      - name: Baseline 50m centerline Roadbed, no grade modification
        run: |
          node enhance.mjs
          node validate_roadbed_integrated.mjs
          node validate_road_render_shape.mjs
          mkdir -p results
          cp results/roadbed-integrated-validation.json results/local-road-baseline-validation.json
          npm run pack-tiles
          node validate_low_road_edge_lod.mjs
          npm run pack-native-tiles
          cp public/stream-manifest.json results/local-road-baseline-manifest.json
      - name: Save baseline 3D Tiles
        uses: actions/upload-artifact@v4
        with:
          name: seoul-local-corridor-baseline-3dtiles
          path: |
            geobench/public/native-3dtiles/
            geobench/public/stream-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: New exact-footprint corridor, capped 3m vertical deformation
        run: |
          rm -rf public/native-3dtiles
          GEO_ROAD_LOCAL_CORRIDOR=1 node enhance.mjs
          node validate_roadbed_integrated.mjs
          node validate_road_render_shape.mjs
          cp results/roadbed-integrated-validation.json results/local-road-variant-validation.json
          npm run pack-tiles
          node validate_low_road_edge_lod.mjs
          node --input-type=module -e "import fs from 'node:fs';const p='public/stream-manifest.json',a=JSON.parse(fs.readFileSync('results/local-road-baseline-manifest.json')),b=JSON.parse(fs.readFileSync(p));b.focus=a.focus;b.roadDebugFocus=a.roadDebugFocus;fs.writeFileSync(p,JSON.stringify(b));"
          npm run pack-native-tiles
          node validate_local_road_ab.mjs
      - name: Save local corridor 3D Tiles for same-camera visual QA
        uses: actions/upload-artifact@v4
        with:
          name: seoul-local-corridor-variant-3dtiles
          path: |
            geobench/public/native-3dtiles/
            geobench/public/stream-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Save measured footprint, terrain and slope comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-local-corridor-measurements
          path: |
            geobench/results/local-road-baseline-validation.json
            geobench/results/local-road-variant-validation.json
            geobench/results/local-road-corridor-ab.json
          retention-days: 14
          if-no-files-found: warn
