name: UI Studio v0.16 — Canvas Hierarchy Full CI
on:
  push:
    branches:
      - ci/ui-studio-v016-canvas-20261024
    paths:
      - 'experiments/ui-studio-v0.16/ci/**'
      - '.github/workflows/ui-studio-v016-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-first-full-validation:
    name: 195 Core + React Build + 15 Chrome Studio/Consumer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v0.16 pinned assembly from v0.15 and Canvas delta
        run: |
          set -euo pipefail
          echo '9999d896fe4378a87c611724ce469cda98cd54f61ce53addbd2a3ae93ba408de  experiments/ui-studio-v0.13/ui-studio-source.zip' | sha256sum -c -
          echo '62c55278694646a5bbbafa1fd8f9f43da50bf29bb80d0252d8c23295a68fd81c  experiments/ui-studio-v0.14/ci/delta.patch.xz.b64' | sha256sum -c -
          mkdir -p experiments/ui-studio-v0.16/app
          unzip -q experiments/ui-studio-v0.13/ui-studio-source.zip -d experiments/ui-studio-v0.16/app
          base64 -d experiments/ui-studio-v0.14/ci/delta.patch.xz.b64 > /tmp/ui-studio-v014.patch.xz
          echo 'daa08bfbfda1b6ab9704ae40491adf281939d4f7682759dfba03134383d10739  /tmp/ui-studio-v014.patch.xz' | sha256sum -c -
          xz -dc /tmp/ui-studio-v014.patch.xz | (cd experiments/ui-studio-v0.16/app && patch --batch -p1)
          python3 experiments/ui-studio-v0.14/ci/fix-v014-inspector.py experiments/ui-studio-v0.16/app/src/framework/UnifiedStudio.jsx
          python3 experiments/ui-studio-v0.14/ci/fix-v014-e2e-selectors.py experiments/ui-studio-v0.16/app/e2e/visual-authoring-v014.spec.js
          echo '22b33f0d5623fe56e7a2da33ee46a02c858826f50ac2d9169c614264c9f1e7cb  experiments/ui-studio-v0.16/app/src/framework/UnifiedStudio.jsx' | sha256sum -c -
          echo 'e89b70e39ba7971be5aa3e6dc84f66f924e78fa6ce47ae76f049f2b1eb84d89b  experiments/ui-studio-v0.15/ci/v015-upgrade.patch' | sha256sum -c -
          (cd experiments/ui-studio-v0.16/app && awk '/^diff --git / {skip=(index($0,"diff --git a/README.md b/README.md")==1)} !skip{print}' ../ci/v015-upgrade.patch | patch --batch --forward -p1)
          python3 experiments/ui-studio-v0.15/ci/fix-v015-e2e.py experiments/ui-studio-v0.16/app
          cat experiments/ui-studio-v0.16/ci/patch.part{1,2,3,4,5} > /tmp/v016.patch.xz.b64
          echo 'd01a1d40ebd09edab0c7e3060b1ac847a4ec223aad3ee9a22eb7e97baf2b8ffd  /tmp/v016.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/v016.patch.xz.b64 | xz -dc > /tmp/v016.patch
          echo '3838da094c5943cb4f9819773776f5b4ed1c7dbd069c372dafed17773f78e390  /tmp/v016.patch' | sha256sum -c -
          (cd experiments/ui-studio-v0.16/app && patch --batch --forward -p1 < /tmp/v016.patch)
          cd experiments/ui-studio-v0.16/app
          echo '7decb58bd4792d34095018877d92fd8bdb030cfd291a434535173775605196d0  package.json' | sha256sum -c -
          echo 'aed08c4a9dc9ec7b73f4cf8cbef6da96905cc2b5129f443196c2841c7bc23348  packages/core/visual.js' | sha256sum -c -
          echo 'c246ea532550d76594d378810dfac734492a3126cc607054d0f2a871dd5f80e9  tests/visual-v014.test.js' | sha256sum -c -
          echo '1f937cd46887ab87df39b1760ac0ae8e5484d7aaab8053599dc84830a1408526  e2e/visual-authoring-v014.spec.js' | sha256sum -c -
          echo 'c685fcccc03e0778c214f2d70ff167abb6b4c3e7f4d5a89f0118dd995139da7a  packages/core/editor.js' | sha256sum -c -
          echo 'c869cc71c196754e7662f545a6b1fd399683efc9afded30b2907d6a84c8fee74  src/framework/UnifiedStudio.jsx' | sha256sum -c -
          echo '8b422e43354152511b241aea9d2e4825bd71052b363c780ce3c3b90b4c6c2f53  e2e/editing-v015.spec.js' | sha256sum -c -
          echo 'c5a022257daeded448521c6e2523d22d27c5287763c304910f796c1515ac9ebc  tests/editing-v015.test.js' | sha256sum -c -
          echo 'c2675f9fb3fc6caf2ca6727a11090a12a338e049c532d970a01ca3c0a7bdcd83  e2e/component-authoring-v013.spec.js' | sha256sum -c -
          echo 'd6582c2643fa40158114165d1ae3e4ace172d677f64676b5053a03b12a729365  packages/core/shortcuts.js' | sha256sum -c -
          echo '6c199a48e1a302b067f2b9a10047e13ab8844b26fa6fcca4866b41d9b8ab7c65  src/framework/unified.css' | sha256sum -c -
          echo '1ffe9c5dc8803cf9387c45e4bbc3d4e50673041c85297d05763d34029ec899ee  tests/canvas-v016.test.js' | sha256sum -c -
          echo 'd52ecb556d4ca8354ec91ac8c43ab6c91cceffaef5cbef02bb1fa70e04919c06  e2e/canvas-v016.spec.js' | sha256sum -c -
          test -f tests/consumer-v013/package.json
          node --version
          npm --version
      - name: npm install
        working-directory: experiments/ui-studio-v0.16/app
        run: npm install --no-audit --no-fund
      - name: Core regression and visual authoring tests
        working-directory: experiments/ui-studio-v0.16/app
        run: npm test
      - name: Source syntax and React Runtime integration
        working-directory: experiments/ui-studio-v0.16/app
        run: |
          node tools/verify-syntax.mjs
          npm run verify:runtime
      - name: Production Vite build
        working-directory: experiments/ui-studio-v0.16/app
        run: npm run build
      - name: Build independently consumable React component
        working-directory: experiments/ui-studio-v0.16/app
        run: |
          npm run export:v014
          test -s examples/CustomerBrowser-react-component-v0.13.zip
          mkdir -p tests/component-v014
          unzip -q -o examples/CustomerBrowser-react-component-v0.13.zip -d tests/component-v014
          (cd tests/component-v014 && npm install --no-audit --no-fund && npm run build && test -s dist/index.js && npm pack --pack-destination ../consumer-v013)
          (cd tests/consumer-v013 && npm install --no-audit --no-fund && npm run build && test -s dist/index.html)
          test -s tests/consumer-v013/node_modules/ui-studio-customer-browser/dist/index.js
      - name: Verify real system Google Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Real Chrome Studio visual authoring E2E
        working-directory: experiments/ui-studio-v0.16/app
        env:
          CI: 'true'
          UI_STUDIO_USE_SYSTEM_CHROME: '1'
        run: npm run test:e2e
      - name: Real Chrome exported React consumer E2E
        working-directory: experiments/ui-studio-v0.16/app
        env:
          CI: 'true'
          UI_STUDIO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test --config=e2e/consumer-v013.config.js
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-studio-v016-real-chrome-evidence
          path: |
            experiments/ui-studio-v0.16/app/test-results/
            experiments/ui-studio-v0.16/app/playwright-report/
            experiments/ui-studio-v0.16/app/playwright-report-consumer/
          if-no-files-found: ignore
          retention-days: 14
