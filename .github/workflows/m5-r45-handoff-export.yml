name: M5 R45 Handoff Export
on:
  push:
    branches: [m5/r34-shared-decode-workerpool-20261022]
    paths: [.github/workflows/m5-r45-handoff-export.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export precise tested M5 experiment sources and workflows
        shell: bash
        run: |
          set -euo pipefail
          base=HANDOFF_R35_R44
          mkdir -p "$base/source/m5-gpu" "$base/source/.github/workflows"
          for r in {36..44}; do
            test -d "m5-gpu/r$r"
            cp -a "m5-gpu/r$r" "$base/source/m5-gpu/"
          done
          cp m5-gpu/R43_RTX_EVIDENCE_AND_RELEASE_GATE_KO.md "$base/source/m5-gpu/"
          find .github/workflows -maxdepth 1 -type f -name '*.yml' |
            grep -E '/(m5-|self-hosted)' |
            while read -r f; do cp "$f" "$base/source/.github/workflows/"; done
          {
            echo 'repo=nssang00/chatgpt-write-test'
            echo 'branch=m5/r34-shared-decode-workerpool-20261022'
            echo "commit=$(git rev-parse HEAD)"
          } > "$base/CHECKOUT.txt"
          (cd "$base"; find source -type f -print0 | sort -z | xargs -0 sha256sum) > "$base/SOURCE_SHA256.txt"
          echo "M5_HANDOFF_EXPORT_READY commit=$(git rev-parse HEAD) files=$(find "$base/source" -type f | wc -l)"
      - name: Upload M5 source report and workflows
        uses: actions/upload-artifact@v4
        with:
          name: m5-r45-handoff-source-${{ github.run_id }}
          path: HANDOFF_R35_R44/**
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
