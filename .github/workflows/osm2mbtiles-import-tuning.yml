name: osm2mbtiles PostGIS Import Tuning (Seoul)
on:
  workflow_dispatch:
  push:
    branches: [ci/osm2mbtiles-native-test]
    paths:
      - experiments/osm2mbtiles/prototype/benchmarks/import_tuning.sh
      - .github/workflows/osm2mbtiles-import-tuning.yml
permissions:
  contents: read
jobs:
  test-import-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PostGIS / osm2pgsql / MVT decoder
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql python3-psycopg2 \
            python3-pip time curl ca-certificates
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
      - name: Compare 5 import strategies and assert exact MVT feature parity
        shell: bash
        run: |
          TUNING_ORDER=reverse bash experiments/osm2mbtiles/prototype/benchmarks/import_tuning.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm2mbtiles-seoul-import-tuning
          path: import-tuning-artifacts/
          if-no-files-found: warn
          retention-days: 14