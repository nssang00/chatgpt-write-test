name: Aplus V2 Durability Gate - Must Actually Kill Publisher
on:
  push:
    branches: [experiment/a-plus-v2-selective-backup-ack-20261030]
    paths: [.github/workflows/a-plus-v2-source-crash-required.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  must-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {n: 50, loss: 10, seed: 1}
          - {n: 100, loss: 10, seed: 1}
          - {n: 100, loss: 10, seed: 2}
          - {n: 200, loss: 10, seed: 1}
    name: 'Strict publisher-death N=${{ matrix.n }} loss=${{ matrix.loss }} seed=${{ matrix.seed }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check implementation
        run: |
          python -m py_compile bench/discovery/pubsub_node.py bench/discovery/pubsub_run.py
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
      - name: Crash after confirmation regardless of earlier subscriber completion
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.n }}' in
            50) disc=12; timeout=85; spread=7 ;;
            100) disc=18; timeout=115; spread=12 ;;
            200) disc=27; timeout=145; spread=18 ;;
          esac
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes '${{ matrix.n }}' --modes multicast --losses '${{ matrix.loss }}' \
            --v4 --messages 20 --publishers '${{ matrix.n }}' \
            --payload-bytes 128 --publish-interval 0.08 \
            --discovery "$disc" --timeout "$timeout" --publish-spread "$spread" \
            --repair-fanout 6 --repair-interval 0.9 --seeds '${{ matrix.seed }}' \
            --fault crash_confirmed --peer-repair --peer-replicas 6 \
            --peer-cache-limit 2048 --backup-quorum 2 --output must-crash-results
          python - <<'PY'
          import json
          r=json.load(open('must-crash-results/results.json'))[0]
          print('MUST_CRASH_RESULT '+json.dumps(r))
          assert r['backup_confirmed_origins']>=1,r
          assert r['crashed_nodes']==[0],r
          assert r['reported']==r['nodes']-1,r
          assert r['discovery_success'] and r['pubsub_success'],r
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'mustcrash-N${{ matrix.n }}-S${{ matrix.seed }}'
          path: must-crash-results/
