name: M5 R47 Cancel Stalled Diagnostic
on:
  push:
    branches: [m5/r46-distinct-mvt-32-20261023]
    paths: ['.github/workflows/m5-r47-unblock-stale-run.yml']
permissions:
  actions: write
  contents: read
jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only R47 stalled earlier build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GH_REPO}/actions/runs/40078886201" --jq '.status')
          echo "Stalled R47 run: $status"
          if [ "$status" = "in_progress" ]; then
            gh api -X POST "repos/${GH_REPO}/actions/runs/40078886201/force-cancel"
            echo 'R47 stale diagnostic force-cancellation requested'
          fi
