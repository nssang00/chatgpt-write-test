name: Cyclone DDS Receiver-Side RTPS Packet Forensics
on:
  push:
    branches: [diagnostic/cyclone-wire-timing-20261029]
    paths: [.github/workflows/cyclone-wire-deep.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: '10 nodes ${{ matrix.mode }} seed=${{ matrix.seed }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {mode: default, seed: 1}
          - {mode: default, seed: 2}
          - {mode: default, seed: 3}
          - {mode: data-multicast, seed: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Cyclone DDS and pcap tools
        run: |
          python -m pip install cyclonedds==11.0.1
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump iproute2
      - name: Capture bridge and Cyclone socket-side packets
        run: |
          set -euo pipefail
          sudo -E "$(which python)" bench/discovery/cyclone_wire_run.py \
            --nodes 10 --mode '${{ matrix.mode }}' \
            --seed '${{ matrix.seed }}' --duration 20 \
            --capture-all --internal-capture \
            --output wire-deep
          cat wire-deep/summary.json
          find wire-deep -type f -name '*.pcap' -printf '%f %s bytes\n' | sort
      - name: Upload all per-node timelines and PCAPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'cyclone-deep-${{ matrix.mode }}-seed${{ matrix.seed }}'
          path: wire-deep/
          if-no-files-found: warn
