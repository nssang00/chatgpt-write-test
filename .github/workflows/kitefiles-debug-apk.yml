name: KiteFiles Android Debug APK

on:
  pull_request:
    paths:
      - 'kitefiles/**'
      - '.github/workflows/kitefiles-debug-apk.yml'
  push:
    branches: [main]
    paths:
      - 'kitefiles/**'
      - '.github/workflows/kitefiles-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: kitefiles
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned project sources and check SHA-256
        run: |
          echo "dd378dbd9dd679c78f19058d4aadb1397f4c413d758dc23c1a7e0c4b04c595ba  kitefiles.tar.xz" | sha256sum --check
          tar -xJf kitefiles.tar.xz
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/kitefiles/android/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up pinned Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile core engine independently
        run: |
          mkdir -p .build/core
          javac -encoding UTF-8 --release 17 -d .build/core app/src/main/java/com/kitefiles/core/*.java

      - name: Assemble debuggable Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify package metadata and signing
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee .build/apk-badging.txt
          grep -q "package: name='com.kitefiles.android'" .build/apk-badging.txt
          grep -q "sdkVersion:'26'" .build/apk-badging.txt
          grep -q "targetSdkVersion:'35'" .build/apk-badging.txt
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KiteFiles-debug-apk
          path: kitefiles/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
