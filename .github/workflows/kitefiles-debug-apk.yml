name: KiteFiles 2.3 Compact Folders and Safe Path Navigation APK

on:
  pull_request:
    paths:
      - 'kitefiles/**'
      - '.github/workflows/kitefiles-debug-apk.yml'
  push:
    branches: [main]
    paths:
      - 'kitefiles/**'
      - '.github/workflows/kitefiles-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + unit/integration + verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: kitefiles
    steps:
      - uses: actions/checkout@v4
      - name: Unpack pinned KiteFiles sources and upgrade patch
        run: |
          set -euo pipefail
          echo "dd378dbd9dd679c78f19058d4aadb1397f4c413d758dc23c1a7e0c4b04c595ba  kitefiles.tar.xz" | sha256sum --check
          echo "e57cd3d7bca4238f950effd229429a699f7763759e13dcac6bcaaa18872aa13d  kitefiles-es-next-patch.tar.xz" | sha256sum --check
          tar -xJf kitefiles.tar.xz
          tar -xJf kitefiles-es-next-patch.tar.xz
          echo "a454eab5265fa7ec2467963f43674ef156caf84844907f8f288f89a0ce11eea5  kitefiles-navigation-v2.1.patch.gz" | sha256sum --check
          if ! gzip -dc kitefiles-navigation-v2.1.patch.gz | patch --batch -p1; then
            # The bundled UI smoke script already contains equivalent navigation checks.
            # Reject ONLY its optional second hunk; core sources must patch cleanly.
            test -f tests/android-ui-smoke.sh.rej
            test "$(find . -name '*.rej' | wc -l)" -eq 1
            rm tests/android-ui-smoke.sh.rej
          fi
          # Override Android Java UI and version with complete validated v2.2 source files.
          echo "4c905673ac4063931dec5909a3b771c2b539744de187f7a2bb3b87471f9e570f  ui-v2.2-files.tar.xz" | sha256sum --check
          tar -xJf ui-v2.2-files.tar.xz
          echo "cb800a6588f2e24f5b6376f6a8a7b9a368e199571d3940564505a32f4178b6d5  ui-v2.3-main.diff.xz" | sha256sum --check
          xz -dc ui-v2.3-main.diff.xz | patch --batch -p1
          sed -i "s/versionCode 4/versionCode 5/; s/versionName '2.2.0'/versionName '2.3.0'/" app/build.gradle
          grep -q 'navigateAtomically' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -q 'folderAccessError' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -q 'actualPath(folder)' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -q 'showTopOptions' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -q 'FileItemIcon' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -qi 'drawer' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -Eq 'Swipe|swipe|translationX' app/src/main/java/com/kitefiles/android/MainActivity.java
          grep -q "versionName '2.3.0'" app/build.gradle
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'jcifs-ng:2.1.10' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run 34 core tests, 9 disk tests and 9 local-store tests
        run: |
          set -euo pipefail
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          mkdir -p .build/core
          javac -encoding UTF-8 --release 17 -d .build/core app/src/main/java/com/kitefiles/core/*.java tests/CoreTests.java tests/RealFilesystemTests.java
          java -cp .build/core CoreTests
          java -cp .build/core RealFilesystemTests
          bash tests/local-store.sh

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Start test-only Samba SMB2/3 share
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba smbclient
          sudo useradd --no-create-home --shell /usr/sbin/nologin kfsci || true
          printf 'KiteCI!2026\nKiteCI!2026\n' | sudo smbpasswd -s -a kfsci
          sudo install -d -m 770 -o kfsci -g kfsci /tmp/kitefiles-samba
          cat <<'CONF' | sudo tee /tmp/kitefiles-smb.conf >/dev/null
          [global]
              workgroup = WORKGROUP
              security = user
              server min protocol = SMB2_02
              server max protocol = SMB3_11
              interfaces = lo
              bind interfaces only = yes
          [share]
              path = /tmp/kitefiles-samba
              read only = no
              browsable = yes
              valid users = kfsci
          CONF
          sudo cp /tmp/kitefiles-smb.conf /etc/samba/smb.conf
          sudo testparm -s /etc/samba/smb.conf
          sudo systemctl restart smbd
          sleep 2
          sudo ss -ltn | grep ':445'
          smbclient -L //127.0.0.1 -U 'kfsci%KiteCI!2026' -m SMB3 | tee .build/samba-shares.txt
          grep -Eq '^\s*share\s+Disk\s+' .build/samba-shares.txt
          smbclient //127.0.0.1/share -U 'kfsci%KiteCI!2026' -m SMB3 -c ls

      - name: Run authenticated SMB2 integration regression
        env:
          KITE_SMB_CI: '1'
        run: |
          if ! gradle --no-daemon :app:testDebugUnitTest --tests com.kitefiles.android.SmbFileStoreIntegrationTest; then
            echo "===== SMB TEST XML ====="
            find app/build/test-results -name '*.xml' -exec cat {} \; || true
            echo "===== SAMBA STATUS ====="
            sudo smbstatus || true
            exit 1
          fi

      - name: Verify package, permission, signing and APK hash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee .build/apk-badging.txt
          grep -q "package: name='com.kitefiles.android'" .build/apk-badging.txt
          grep -q "versionName='2.2.0'" .build/apk-badging.txt
          grep -q "targetSdkVersion:'35'" .build/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee .build/apk-permissions.txt
          grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' .build/apk-permissions.txt
          grep -q 'android.permission.INTERNET' .build/apk-permissions.txt
          sha256sum "$APK" | tee .build/apk-sha256.txt

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KiteFiles-v2.3-compact-path-debug-apk
          path: kitefiles/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ui-smoke:
    name: Android emulator drawer, swipe, overflow and folder rows
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KiteFiles-v2.3-compact-path-debug-apk
          path: apk
      - name: Enable KVM accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kinsmod"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch Android 35 emulator and test UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash kitefiles/tests/android-ui-smoke.sh apk/app-debug.apk && bash kitefiles/tests/v22-ui-smoke.sh && bash kitefiles/tests/v23-ui-smoke.sh
      - name: Upload test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiteFiles-v2.3-Android-UI-screenshots
          path: |
            kitefiles-ui-smoke.png
            kitefiles-options-menu.png
            kitefiles-v23-compact-path.png
          if-no-files-found: ignore
          retention-days: 7
