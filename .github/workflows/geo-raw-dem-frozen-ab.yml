name: Seoul frozen source raw-DEM vs integrated-roadbed A-B
on:
  push:
    branches:
      - fix/seoul-road-dem-drape-audit-20261123
    paths:
      - .github/workflows/geo-raw-dem-frozen-ab.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  same-osm-dem-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GEO_VISUAL_TERRAIN_SMOOTH: '0'
    steps:
      - name: Checkout current raw-DEM drape viewer
        uses: actions/checkout@v4
      - name: Checkout independent prior integrated roadbed
        uses: actions/checkout@v4
        with:
          ref: fix/seoul-road-roadbed-integrated-20261120
          path: old
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current viewer
        working-directory: geobench
        run: npm install --no-audit --no-fund
      - name: Install old integrated roadbed generator
        working-directory: old/geobench
        run: npm install --no-audit --no-fund
      - name: Download EXACT raw DEM and OSM XML from new geometry CI
        uses: actions/download-artifact@v4
        with:
          name: seoul-raw-dem-drape-sources
          run-id: 45141523301
          github-token: ${{ github.token }}
          path: old/geobench/public
      - name: Download raw-drape tiles and original camera manifest
        uses: actions/download-artifact@v4
        with:
          name: seoul-raw-dem-drape-native-tiles
          run-id: 45141523301
          github-token: ${{ github.token }}
          path: geobench/public
      - name: Force old roadbed enhancer to use SAME saved OSM snapshot
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const p='old/geobench/enhance.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old=`const res=await fetch(osmUrl,{headers:{'User-Agent':'geo-renderer-benchmark/1.0 (noncommercial single-area experiment)'}});
          if(!res.ok)throw new Error('OSM '+res.status);
          const parsed=new XMLParser({ignoreAttributes:false,attributeNamePrefix:'@_',isArray:tag=>['node','way','nd','tag'].includes(tag)})
            .parse(await res.text()).osm;`;
          const patch=`const osmXml=await fs.readFile('public/osm-snapshot.xml','utf8');
          const parsed=new XMLParser({ignoreAttributes:false,attributeNamePrefix:'@_',isArray:tag=>['node','way','nd','tag'].includes(tag)})
            .parse(osmXml).osm;`;
          if(!s.includes(old))throw Error('Old source OSM fetch unexpectedly changed; comparison must not use live input');
          s=s.replace(old,patch);
          fs.writeFileSync(p,s);
          console.log('OLD_BASELINE_FROZEN_OSM_PATCHED');
          EOF
      - name: Generate old integrated Roadbed from exact same source DEM/OSM
        working-directory: old/geobench
        env:
          GEO_ROADBED_INTEGRATED: '1'
        run: |
          node enhance.mjs
          node validate_roadbed_integrated.mjs
          npm run pack-tiles
          npm run pack-native-tiles
      - name: Extract same exact OSM junction from previous Roadbed
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const input='geobench/extract_road_debug.mjs';
          const target='old/geobench/extract_road_debug.mjs';
          let s=fs.readFileSync(input,'utf8');
          const anchor='const focus=fixture.metadata.roadDebugFocus;';
          if(!s.includes(anchor))throw Error('Unexpected debug extractor; refuse nonidentical viewport');
          s=s.replace(anchor,"const focus=JSON.parse(await fs.readFile('../../geobench/public/road-debug-geometry.json','utf8')).focus;");
          fs.writeFileSync(target,s);
          EOF
          cd old/geobench
          node extract_road_debug.mjs
      - name: Freeze raw DEM subset while rendering OLD 50m Roadbed
        run: |
          mkdir -p geobench/results
          cp geobench/public/road-debug-geometry.json geobench/results/frozen-raw-dem-debug-source.json
          cp old/geobench/public/road-debug-geometry.json geobench/public/road-debug-geometry.json
      - name: Install lightweight Chromium for fixed local junction views
        working-directory: geobench
        run: npx playwright install --with-deps chromium
      - name: Capture OLD Roadbed terrain, road wireframe, and combined
        working-directory: geobench
        run: |
          node run-road-debug.mjs
          for mode in terrain road combined; do
            mv "results/raw-dem-debug-$mode.png" "results/frozen-old-roadbed-$mode.png"
          done
      - name: Swap back to the SAME original DEM / draped road subset
        run: cp geobench/results/frozen-raw-dem-debug-source.json geobench/public/road-debug-geometry.json
      - name: Capture NEW raw DEM terrain, road wireframe, and combined
        working-directory: geobench
        run: |
          node run-road-debug.mjs
          for mode in terrain road combined; do
            mv "results/raw-dem-debug-$mode.png" "results/frozen-raw-drape-$mode.png"
          done
      - name: Build same-camera A-B pairs and pixel metrics
        working-directory: geobench
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {PNG} from 'pngjs';
          const report={camera:'identical source-ground junction target in shared 200m square',
            sources:'exactly one frozen raw DEM fixture.json and OSM XML; old integrated Roadbed vs new raw drape',
            renderer:'Chromium SwiftShader software WebGL, not RTX',modes:{}};
          for(const mode of ['terrain','road','combined']){
            const old=PNG.sync.read(fs.readFileSync('results/frozen-old-roadbed-'+mode+'.png'));
            const newer=PNG.sync.read(fs.readFileSync('results/frozen-raw-drape-'+mode+'.png'));
            if(old.width!==newer.width||old.height!==newer.height)throw Error('Mismatch '+mode);
            const w=old.width,h=old.height,out=new PNG({width:w*2,height:h});
            let sum=0,changed=0;
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){
              const k=(y*w+x)*4,l=(y*2*w+x)*4,r=(y*2*w+w+x)*4;
              let max=0;
              for(let c=0;c<4;c++){out.data[l+c]=old.data[k+c];out.data[r+c]=newer.data[k+c];}
              for(let c=0;c<3;c++){
                const d=Math.abs(old.data[k+c]-newer.data[k+c]);sum+=d;max=Math.max(max,d);
              }
              if(max>15)changed++;
            }
            fs.writeFileSync('results/frozen-'+mode+'-ab.png',PNG.sync.write(out));
            report.modes[mode]={resolution:[w,h],meanAbsRGB255:sum/(w*h*3),
              changedOver15Pct:100*changed/(w*h)};
          }
          fs.writeFileSync('results/frozen-dem-drape-vs-roadbed.json',JSON.stringify(report,null,2));
          console.log('FROZEN_DEM_DRAPE_VS_ROADBED_PIXEL_AB',JSON.stringify(report));
          EOF
      - name: Upload all six original frames, three pairs and old QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-frozen-raw-dem-vs-roadbed-debug-screenshots
          path: |
            geobench/results/frozen-*.png
            geobench/results/frozen-dem-drape-vs-roadbed.json
            old/geobench/results/roadbed-integrated-validation.json
          retention-days: 14
          if-no-files-found: warn
