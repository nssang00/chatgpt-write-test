name: OneClick v58.0 Release Readiness Gate\n# audit-path-fix: location-independent

on:
  workflow_dispatch:
  push:
    branches:
      - ci/oneclick-v58-0
    paths:
      - '.github/workflows/oneclick-v58-0-release.yml'
      - 'ci/v58-release/**'

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release Readiness Audit
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare current package snapshot
        shell: pwsh
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'Package/com.company.webview'
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'Runtime/Backends/CEF') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'Prototypes/CefTexture/Native/Host') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'Prototypes/CefTexture/Managed') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'Tests') | Out-Null
          Set-Content -Path (Join-Path $pkg 'package.json') -Value '{"name":"com.company.webview","version":"0.0.1","displayName":"Company WebView","unity":"2022.3"}' -Encoding UTF8
          Set-Content -Path (Join-Path $pkg 'Runtime/Backends/CEF/CefBackend.cs') -Value 'namespace Company.WebView.Internal.Cef { internal sealed class CefBackend { } }' -Encoding UTF8
          Set-Content -Path (Join-Path $pkg 'Prototypes/CefTexture/Native/Host/CefRuntime.cpp') -Value 'validated native implementation marker'
          Set-Content -Path (Join-Path $pkg 'Prototypes/CefTexture/Managed/CefTextureProbeNative.cs') -Value 'validated managed implementation marker'

      - name: Run release readiness audit
        shell: pwsh
        run: |
          python ci/v58-release/release_readiness_check.py
          $report = Get-Content release-readiness-report.json -Raw | ConvertFrom-Json
          if ($report.status -ne 'BLOCKED_RUNTIME_PROMOTION') { throw "Unexpected release status: $($report.status)" }
          $codes = @($report.blockers | ForEach-Object { $_.code })
          $required = @('PACKAGE_VERSION_RELEASE_CANDIDATE','RUNTIME_CEF_BACKEND_IMPLEMENTED','PUBLIC_WEBVIEW_API_IMPLEMENTED','VALIDATED_IMPLEMENTATION_PROMOTED_FROM_PROTOTYPES','LICENSE_NOTICE_PRESENT')
          foreach ($code in $required) {
            if ($codes -notcontains $code) { throw "Missing expected blocker: $code" }
          }

      - name: Record inherited native baseline
        shell: pwsh
        run: |
          "nativeBaseline=v57.9 GitHub Actions PASS" | Set-Content native-baseline.txt
          "nativeSourceSha256=3c752da814aabb4224c4ed84cd19c9fdf223cfef6def3691908c339e1b344382" | Add-Content native-baseline.txt
          "v57.9RunId=37708072876" | Add-Content native-baseline.txt

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneclick-v58-0-release-readiness
          path: |
            release-readiness-report.json
            native-baseline.txt
          if-no-files-found: error
