name: UI Studio v0.15 — Editing UX Full CI
on:
  push:
    branches:
      - ci/ui-studio-v015-editing-ux-20261024
    paths:
      - 'experiments/ui-studio-v0.15/ci/**'
      - '.github/workflows/ui-studio-v015-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-first-full-validation:
    name: 188 Core + React Build + Chrome Studio/Consumer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and construct v0.15 from verified v0.14 plus patch
        run: |
          set -euo pipefail
          echo '9999d896fe4378a87c611724ce469cda98cd54f61ce53addbd2a3ae93ba408de  experiments/ui-studio-v0.13/ui-studio-source.zip' | sha256sum -c -
          echo '62c55278694646a5bbbafa1fd8f9f43da50bf29bb80d0252d8c23295a68fd81c  experiments/ui-studio-v0.14/ci/delta.patch.xz.b64' | sha256sum -c -
          mkdir -p experiments/ui-studio-v0.15/app
          unzip -q experiments/ui-studio-v0.13/ui-studio-source.zip -d experiments/ui-studio-v0.15/app
          base64 -d experiments/ui-studio-v0.14/ci/delta.patch.xz.b64 > /tmp/ui-studio-v014.patch.xz
          echo 'daa08bfbfda1b6ab9704ae40491adf281939d4f7682759dfba03134383d10739  /tmp/ui-studio-v014.patch.xz' | sha256sum -c -
          xz -dc /tmp/ui-studio-v014.patch.xz | (cd experiments/ui-studio-v0.15/app && patch --batch -p1)
          python3 experiments/ui-studio-v0.14/ci/fix-v014-inspector.py experiments/ui-studio-v0.15/app/src/framework/UnifiedStudio.jsx
          python3 experiments/ui-studio-v0.14/ci/fix-v014-e2e-selectors.py experiments/ui-studio-v0.15/app/e2e/visual-authoring-v014.spec.js
          echo '22b33f0d5623fe56e7a2da33ee46a02c858826f50ac2d9169c614264c9f1e7cb  experiments/ui-studio-v0.15/app/src/framework/UnifiedStudio.jsx' | sha256sum -c -
          sha256sum experiments/ui-studio-v0.15/ci/v015-upgrade.patch
          (cd experiments/ui-studio-v0.15/app && git apply ../ci/v015-upgrade.patch)
          cd experiments/ui-studio-v0.15/app
          echo '66771bcfd171f04c2a4115c7fb3c717e37700002a42779ad67a0b3d090154661  package.json' | sha256sum -c -
          echo 'aed08c4a9dc9ec7b73f4cf8cbef6da96905cc2b5129f443196c2841c7bc23348  packages/core/visual.js' | sha256sum -c -
          echo 'c246ea532550d76594d378810dfac734492a3126cc607054d0f2a871dd5f80e9  tests/visual-v014.test.js' | sha256sum -c -
          echo '1f937cd46887ab87df39b1760ac0ae8e5484d7aaab8053599dc84830a1408526  e2e/visual-authoring-v014.spec.js' | sha256sum -c -
          echo '6d745379c870c2acacaffc288aaf646f457652fe51b6c0b647f9be96791b3c71  packages/core/editor.js' | sha256sum -c -
          echo '10ee279c85611fe50a07ad659293f80e512614483f0fad85301375427fc04f96  src/framework/UnifiedStudio.jsx' | sha256sum -c -
          echo 'bf0de8c0d1fe0825be50e7ecf58f3b40f46c6c95ff762f9f426531ab868e52d0  e2e/editing-v015.spec.js' | sha256sum -c -
          echo 'c5a022257daeded448521c6e2523d22d27c5287763c304910f796c1515ac9ebc  tests/editing-v015.test.js' | sha256sum -c -
          test -f tests/consumer-v013/package.json
          node --version
          npm --version
      - name: npm install
        working-directory: experiments/ui-studio-v0.15/app
        run: npm install --no-audit --no-fund
      - name: Core regression and visual authoring tests
        working-directory: experiments/ui-studio-v0.15/app
        run: npm test
      - name: Source syntax and React Runtime integration
        working-directory: experiments/ui-studio-v0.15/app
        run: |
          node tools/verify-syntax.mjs
          npm run verify:runtime
      - name: Production Vite build
        working-directory: experiments/ui-studio-v0.15/app
        run: npm run build
      - name: Build independently consumable React component
        working-directory: experiments/ui-studio-v0.15/app
        run: |
          npm run export:v014
          test -s examples/CustomerBrowser-react-component-v0.13.zip
          mkdir -p tests/component-v014
          unzip -q -o examples/CustomerBrowser-react-component-v0.13.zip -d tests/component-v014
          (cd tests/component-v014 && npm install --no-audit --no-fund && npm run build && test -s dist/index.js && npm pack --pack-destination ../consumer-v013)
          (cd tests/consumer-v013 && npm install --no-audit --no-fund && npm run build && test -s dist/index.html)
          test -s tests/consumer-v013/node_modules/ui-studio-customer-browser/dist/index.js
      - name: Verify real system Google Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Real Chrome Studio visual authoring E2E
        working-directory: experiments/ui-studio-v0.15/app
        env:
          CI: 'true'
          UI_STUDIO_USE_SYSTEM_CHROME: '1'
        run: npm run test:e2e
      - name: Real Chrome exported React consumer E2E
        working-directory: experiments/ui-studio-v0.15/app
        env:
          CI: 'true'
          UI_STUDIO_USE_SYSTEM_CHROME: '1'
        run: npx playwright test --config=e2e/consumer-v013.config.js
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-studio-v015-real-chrome-evidence
          path: |
            experiments/ui-studio-v0.15/app/test-results/
            experiments/ui-studio-v0.15/app/playwright-report/
            experiments/ui-studio-v0.15/app/playwright-report-consumer/
          if-no-files-found: ignore
          retention-days: 14
