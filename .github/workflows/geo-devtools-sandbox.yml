name: Geo DevTools — Node-only isolated E2E
on:
  push:
    branches:
      - sandbox/geo-devtools-ci-20261012
    paths:
      - 'sandbox/geo-devtools-ci/**'
      - '.github/workflows/geo-devtools-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geo-devtools-sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geo-devtools-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: sandbox/geo-devtools-ci/project
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack isolated Geo DevTools source
        working-directory: .
        run: |
          mkdir -p sandbox/geo-devtools-ci/project
          unzip -q sandbox/geo-devtools-ci/source.zip -d sandbox/geo-devtools-ci/project
          test -f sandbox/geo-devtools-ci/project/package.json
      - name: Install Node dependencies (OL, esbuild, Playwright)
        run: npm install
      - name: Node unit and real OpenLayers class tests
        run: |
          set -o pipefail
          node -e "import('ol/Map.js').then(() => console.log('real ol package available'))"
          npm test 2>&1 | tee node-tests.log
      - name: Install Chromium via Node Playwright
        run: npx playwright install --with-deps chromium
      - name: Bundle real OL browser fixtures
        run: |
          mkdir -p artifacts
          ./node_modules/.bin/esbuild tests/real-ol/entry.js --bundle --format=iife --platform=browser --outfile=artifacts/real-ol-browser.js
          ./node_modules/.bin/esbuild tests/zero-touch/entry.js --bundle --format=iife --platform=browser --outfile=artifacts/zero-touch-browser.js
      - name: Node Playwright UI panel E2E and screenshots
        run: node tests/e2e/visual.js
      - name: Node Playwright real OpenLayers E2E and screenshots
        run: node tests/e2e/real-ol.js
      - name: Node Playwright zero-touch real OL scan and screenshots
        run: node tests/e2e/zero-touch.js
      - name: Verify Node-only and report evidence
        run: |
          test -f artifacts/zero-touch/01-basic-healthy.png
          test -f artifacts/zero-touch/02-basic-tile-404.png
          test -f artifacts/zero-touch/03-basic-diagnosis-report.png
          test -f artifacts/real-ol/01-real-openlayers.png
          node -e "const r=require('./artifacts/zero-touch/results.json'); if(!r.passed || r.broken.findings.every(f=>f.rule!=='tile-http-error') || r.healthy.findings.some(f=>f.rule==='tile-http-error')) process.exit(1)"
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-devtools-node-playwright-evidence
          path: |
            sandbox/geo-devtools-ci/project/artifacts/browser/
            sandbox/geo-devtools-ci/project/artifacts/real-ol/
            sandbox/geo-devtools-ci/project/artifacts/zero-touch/
            sandbox/geo-devtools-ci/project/node-tests.log
          if-no-files-found: warn
          retention-days: 14
