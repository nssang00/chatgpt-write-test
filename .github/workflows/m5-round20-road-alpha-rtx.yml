name: Round20 Road Alpha Causality RTX
on:
  push:
    paths:
      - .github/workflows/m5-round20-road-alpha-rtx.yml
      - m5-gpu/apply_round20_road_alpha_diagnostic.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alpha-causality:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble equal-style OL/M5 alpha variants on RTX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\Users\user\Downloads\M5_GPU_COMPARE_UNPACKED\M5_Round14_OL_GPU_Compare'
          if(-not (Test-Path (Join-Path $source 'tests\round14_gpu_compare\oneclick.mjs'))){throw 'Original fixture missing'}
          $gpu=Get-CimInstance Win32_VideoController|Where-Object{$_.Name -match 'NVIDIA.*RTX'}
          if(-not $gpu){throw 'RTX absent'}
          foreach($alpha in @('1.0','0.5')){
            $root=Join-Path $env:GITHUB_WORKSPACE ('r20-road-alpha-'+$alpha)
            New-Item -ItemType Directory -Path $root -Force|Out-Null
            Copy-Item (Join-Path $source '*') $root -Recurse -Force
            if(Test-Path (Join-Path $root 'RESULTS')){Remove-Item (Join-Path $root 'RESULTS') -Recurse -Force}
            foreach($patch in @('round14_apply_capture_fix.mjs','apply_backend_msaa_optin.mjs','apply_ol_stroke_defaults_variant.mjs','apply_no_line_discard_variant.mjs','apply_round18_tile_scissor.mjs','apply_round18_layer_fbo.mjs','apply_round18_polygon_stroke_noclip.mjs','apply_round18_flat_stroke_direct.mjs')){
              $p=Join-Path $env:GITHUB_WORKSPACE ('m5-gpu\'+$patch)
              node --check $p
              if($LASTEXITCODE -ne 0){throw "Script syntax $patch"}
              node $p $root
              if($LASTEXITCODE -ne 0){throw "Patch error $patch"}
            }
            node m5-gpu/apply_round20_road_alpha_diagnostic.mjs $root $alpha
            if($LASTEXITCODE -ne 0){throw "Alpha variant $alpha failed"}
            Push-Location $root
            node tests/verify_round14_loop_and_style.mjs
            if($LASTEXITCODE -ne 0){throw "CPU geometry parity failed $alpha"}
            node tests/round14_gpu_compare/oneclick.mjs --self-test
            if($LASTEXITCODE -ne 0){throw "Comparator self-test failed $alpha"}
            Pop-Location
          }
      - name: Independent physical RTX alpha 1.0 and 0.5 A/B
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($alpha in @('1.0','0.5')){
            Push-Location (Join-Path $env:GITHUB_WORKSPACE ('r20-road-alpha-'+$alpha))
            node tests/round14_gpu_compare/oneclick.mjs --rounds=1 --headless
            $code=$LASTEXITCODE
            Pop-Location
            if($code -ne 0){throw "Alpha diagnostic $alpha failed"}
          }
      - name: Preserve compared PNG files and channel metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-road-alpha-causality-rtx
          retention-days: 30
          if-no-files-found: warn
          path: |
            r20-road-alpha-1.0/RESULTS/**
            r20-road-alpha-0.5/RESULTS/**
      - name: Print causal experiment exact RGBA8 differences
        shell: powershell
        run: |
          foreach($alpha in @('1.0','0.5')){
            $dir=Join-Path $env:GITHUB_WORKSPACE ('r20-road-alpha-'+$alpha+'\RESULTS')
            $f=Get-ChildItem $dir -Recurse -Filter manifest.json|Select-Object -First 1
            if(-not $f){throw "No output $alpha"}
            $m=Get-Content $f.FullName -Raw|ConvertFrom-Json
            Write-Host "=== Road alpha = $alpha ==="
            $m.rows|Format-Table scene,pixelDiffRuns,pixelExact,m5ChangePercent
            if(-not $m.complete -or -not $m.withinRendererStable){throw "Missing reliable alpha comparison $alpha"}
          }
