name: osm2mbtiles Real Vector MVT E2E
on:
  workflow_dispatch:
  push:
    branches: [ci/osm2mbtiles-native-test]
    paths:
      - experiments/osm2mbtiles/prototype/vector/**
      - experiments/osm2mbtiles/prototype/src/osm2mbtiles/vector*.py
      - experiments/osm2mbtiles/prototype/src/osm2mbtiles/runtime.py
      - experiments/osm2mbtiles/prototype/src/osm2mbtiles/cli.py
      - experiments/osm2mbtiles/prototype/tests/test_vector.py
      - .github/workflows/osm2mbtiles-vector-e2e.yml
permissions:
  contents: read
jobs:
  vector-real-osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install real PostgreSQL PostGIS osm2pgsql Python dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql python3-psycopg2 \
            python3-pip python3-pytest curl
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
      - name: Real Monaco import and detailed MVT MBTiles encoding
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT="$PWD/experiments/osm2mbtiles/prototype"
          WORK="$RUNNER_TEMP/osm-vector"
          mkdir -p "$WORK/socket" "$GITHUB_WORKSPACE/vector-artifacts"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          export PGHOST="$WORK/socket" PGPORT=55437 PGUSER=osmvector PGDATABASE=gis
          export PGPASSWORD='temporary-test-password'
          export PYTHONPATH="$PROJECT/src"
          printf '%s\n' "$PGPASSWORD" > "$WORK/pw"
          initdb -D "$WORK/pgdata" -U "$PGUSER" --auth-local=scram-sha-256 --auth-host=scram-sha-256 --pwfile="$WORK/pw"
          pg_ctl -D "$WORK/pgdata" -l "$WORK/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$PGHOST -c port=$PGPORT -c shared_buffers=64MB -c work_mem=4MB -c max_parallel_maintenance_workers=0" start
          trap 'pg_ctl -D "$WORK/pgdata" -m immediate -w stop || true; tail -n 70 "$WORK/postgres.log" || true' EXIT
          createdb gis
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION postgis; CREATE EXTENSION hstore;'
          curl -fL --retry 3 --silent --show-error \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf -o "$WORK/monaco.osm.pbf"
          osm2pgsql --version
          osm2pgsql --slim --drop --cache=256 --number-processes=1 \
            --disable-parallel-indexing -O flex -S "$PROJECT/vector/vector-flex.lua" -d gis "$WORK/monaco.osm.pbf"
          psql -v ON_ERROR_STOP=1 -f "$PROJECT/vector/post-import.sql"
          for t in vector_points vector_lines vector_areas vector_relations vector_label_points; do
            psql -Atc "SELECT '$t',COUNT(*) FROM $t"
          done
          cat > "$WORK/job.json" <<EOF
          {"pbf":"$WORK/monaco.osm.pbf","output":"$GITHUB_WORKSPACE/vector-artifacts/monaco.vector.mbtiles","bbox":[7.40,43.71,7.46,43.75],"minzoom":0,"maxzoom":15,"processes":2}
          EOF
          /usr/bin/python3 "$PROJECT/src/osm2mbtiles/vector_worker.py" "$WORK/job.json"
          /usr/bin/python3 -m osm2mbtiles verify-vector "$GITHUB_WORKSPACE/vector-artifacts/monaco.vector.mbtiles"
          /usr/bin/python3 - <<'PY'
          import gzip,json,sqlite3,os
          import mapbox_vector_tile
          path='vector-artifacts/monaco.vector.mbtiles'
          with sqlite3.connect(path) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert db.execute("SELECT value FROM metadata WHERE name='format'").fetchone()[0]=='pbf'
              rows=db.execute('SELECT zoom_level,tile_data FROM tiles').fetchall()
              assert len(rows)>0, 'No nonempty real data tiles'
              found={}; samples=[]
              for z,blob in rows:
                  tile=mapbox_vector_tile.decode(gzip.decompress(blob))
                  for name,layer in tile.items():
                      if layer['features']:
                          found[name]=found.get(name,0)+len(layer['features'])
                          samples += [(name,feature['properties']) for feature in layer['features'][:2]]
              print('ACTUAL_MVT_LAYER_COUNTS',json.dumps(found,sort_keys=True))
              assert 'road' in found and 'building' in found and 'poi' in found, found
              assert len(found) >= 12, found
              # Verify rich OSM attributes survive the entire PBF -> flex -> MVT chain.
              actual_fields=set()
              for _,blob in rows:
                  for layer in mapbox_vector_tile.decode(gzip.decompress(blob)).values():
                      for feature in layer['features']:
                          actual_fields.update(feature['properties'])
              detail={'maxspeed','lanes','surface','height','building:levels','opening_hours','addr:housenumber','operator','brand'}
              assert len(actual_fields & detail) >= 3, actual_fields & detail
              assert 'name' in actual_fields and 'osm_id' in actual_fields
              print('REAL_OSM_DETAIL_FIELDS',sorted(actual_fields & detail))
              assert any('name' in p or 'name:ko' in p for _,p in samples)
              assert any('osm_id' in p for _,p in samples)
              assert all(isinstance(p,dict) for _,p in samples)
              print('REAL_MONACO_VECTOR_MBTILES_SUCCESS tiles=',len(rows),'layers=',len(found),'features=',sum(found.values()))
          PY
          # Test the end-user CLI, not only the standalone vector worker.
          RUNTIME="$WORK/runtime"
          mkdir -p "$RUNTIME/bin" "$RUNTIME/python/bin" "$RUNTIME/styles/osm-carto"
          for tool in initdb pg_ctl createdb psql osm2pgsql; do
            ln -s "$(command -v "$tool")" "$RUNTIME/bin/$tool"
          done
          ln -s /usr/bin/python3 "$RUNTIME/python/bin/python3"
          for file in project.xml openstreetmap-carto-flex.lua indexes.sql functions.sql common-values.sql; do
            printf 'vector CI runtime stub; not used for vector import\n' > "$RUNTIME/styles/osm-carto/$file"
          done
          /usr/bin/python3 -m osm2mbtiles "$WORK/monaco.osm.pbf" -z 12-14 \
            --bbox 7.40,43.71,7.46,43.75 --format vector \
            -o "$GITHUB_WORKSPACE/vector-artifacts/monaco.cli.vector.mbtiles" \
            --runtime "$RUNTIME" --workdir "$WORK/cli-work" --processes 2
          /usr/bin/python3 -m osm2mbtiles verify-vector \
            "$GITHUB_WORKSPACE/vector-artifacts/monaco.cli.vector.mbtiles"
          echo REAL_OSM2MBTILES_VECTOR_CLI_SUCCESS
          pg_ctl -D "$WORK/pgdata" -m fast -w stop
          trap - EXIT
      - name: Python unit regression tests
        run: |
          cd experiments/osm2mbtiles/prototype
          /usr/bin/python3 -m pytest -q tests/test_vector.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm2mbtiles-real-monaco-vector
          path: vector-artifacts/
          if-no-files-found: warn
          retention-days: 7