name: Single Publisher 300-Node Diagnostic
on:
  push:
    branches: [benchmark/pubsub-single-publisher-diagnostic-20261029]
    paths: [.github/workflows/pubsub-single-publisher-300.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  single-pub-300:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare one publisher with 299 remote subscribers
        run: |
          set -euxo pipefail
          sudo -E "$(which python)" bench/discovery/pubsub_run.py \
            --sizes 300 --modes multicast,hybrid --losses 0,10 \
            --discovery 16 --timeout 45 --messages 2 --publishers 1 \
            --publish-spread 3 --output one-publisher-300
          cat one-publisher-300/results.csv
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-publisher-300
          path: one-publisher-300/
          if-no-files-found: warn
