name: WebView2 Overlay v58.5.1 Unity HWND Pilot CI
on:
  push:
    branches: [feature/webview2-overlay-v58-5-1-unity-pilot]
    paths:
      - 'Prototypes/WebView2Overlay/UnityPilot/**'
      - '.github/workflows/webview2-overlay-v58-5-1-unity-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64-native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolation and exported API names
        shell: pwsh
        run: python Prototypes/WebView2Overlay/UnityPilot/Validation/verify_contract.py
      - name: Install pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$env:RUNNER_TEMP/wv2sdk" -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'NuGet failed'}
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          $sdk=Join-Path $env:RUNNER_TEMP 'wv2sdk/Microsoft.Web.WebView2.1.0.4258.31'
          cmake -S Prototypes/WebView2Overlay/UnityPilot/Native -B build-wv2-pilot -G 'Visual Studio 17 2022' -A x64 "-DWEBVIEW2_SDK_ROOT=$sdk"
          if($LASTEXITCODE -ne 0){throw 'CMake configure failed'}
      - name: Compile experimental DLL
        shell: pwsh
        run: |
          cmake --build build-wv2-pilot --config Release --clean-first
          if($LASTEXITCODE -ne 0){throw 'MSVC compile/link failed'}
          if(-not(Test-Path build-wv2-pilot/Release/CompanyWebView2OverlayPilot.dll)){throw 'Missing DLL'}
      - name: Verify C ABI export surface
        shell: pwsh
        run: |
          $dll='build-wv2-pilot/Release/CompanyWebView2OverlayPilot.dll'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if(-not $vs){throw 'Visual Studio installation missing'}
          $tools=(Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1)
          $dumpbin=Join-Path $tools.FullName 'bin/Hostx64/x64/dumpbin.exe'
          if(-not(Test-Path $dumpbin)){throw "dumpbin.exe missing: $dumpbin"}
          $exports=(& $dumpbin /exports $dll | Out-String)
          foreach($n in @('WV2Pilot_Open','WV2Pilot_SetBounds','WV2Pilot_SetVisible','WV2Pilot_NotifyParentMoved','WV2Pilot_GetState','WV2Pilot_GetLastError','WV2Pilot_GetPongCount','WV2Pilot_Close')) {
            if($exports -notmatch $n){throw "Missing export $n"}
          }
      - name: Record strict validation limits
        shell: pwsh
        run: |
          "## WebView2 v58.5.1 Unity HWND Pilot" >> $env:GITHUB_STEP_SUMMARY
          "- Native x64 DLL compiled and C ABI exports checked" >> $env:GITHUB_STEP_SUMMARY
          "- Unity C# API static contract only; Unity 2022.3 player execution NOT checked" >> $env:GITHUB_STEP_SUMMARY
          "- HWND cross-thread parenting, focus, IME, z-order, resize/DPI, reload and teardown need real Windows player Stage2" >> $env:GITHUB_STEP_SUMMARY
      - name: Prepare safe standalone Unity pilot drop-in
        shell: pwsh
        run: |
          $root='dist/WebView2UnityPilot-v58.5.1'
          New-Item -ItemType Directory -Force -Path "$root/Assets/Plugins/x86_64","$root/Assets/Scripts" | Out-Null
          Copy-Item 'build-wv2-pilot/Release/CompanyWebView2OverlayPilot.dll' "$root/Assets/Plugins/x86_64/"
          Copy-Item 'Prototypes/WebView2Overlay/UnityPilot/Unity/WebView2OverlayUnityPilot.cs' "$root/Assets/Scripts/"
          Copy-Item 'Prototypes/WebView2Overlay/UnityPilot/README.md' "$root/README_FIRST.md"
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\','/'))"
          } | Set-Content "$root/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: webview2-overlay-v58-5-1-unity-pilot-dropin
          path: dist/WebView2UnityPilot-v58.5.1/
          if-no-files-found: error
