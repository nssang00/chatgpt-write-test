name: NativeWeb Handoff Package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/handoff-package.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build curated handoff directory
        shell: bash
        run: |
          set -euo pipefail

          OUT="nativeweb-handoff"
          rm -rf "$OUT"
          mkdir -p "$OUT/.github/workflows"

          cp CMakeLists.txt "$OUT/"
          cp README.md "$OUT/"
          cp HANDOFF.md "$OUT/"
          cp CONTRIBUTING.md "$OUT/"

          cp -R docs "$OUT/"
          cp -R include "$OUT/"
          cp -R src "$OUT/"
          cp -R tests "$OUT/"
          cp -R ci "$OUT/"
          cp -R tools/cef "$OUT/tools/"

          for f in             platform-smoke.yml             core-regression.yml             cef-bridge.yml             cef-linux-smoke.yml             cef-probe.yml             cef-windows-bridge.yml             webview2-bridge.yml             handoff-package.yml
          do
            cp ".github/workflows/$f" "$OUT/.github/workflows/$f"
          done

          cat > "$OUT/HANDOFF_PACKAGE_README.md" <<EOF
          # NativeWeb / Xytron Handoff Package

          Repository: nssang00/chatgpt-write-test
          Snapshot commit: ${GITHUB_SHA}
          Generated by: .github/workflows/handoff-package.yml

          ## Start here

          Read in this order:

          1. HANDOFF.md
          2. README.md
          3. docs/ARCHITECTURE.md
          4. docs/DECISIONS.md
          5. docs/TESTING.md
          6. docs/ROADMAP.md
          7. docs/CALLABLE_PLUGIN_DESIGN.md
          8. docs/API_CONTRACT.md

          ## Current implementation focus

          The current repository already contains:

          - direct xytron.foo() JavaScript facade + invoke compatibility
          - worker-pool JS -> C++ dispatch
          - RequestId-correlated typed std::future completion
          - root/native object binding and object registry
          - Linux/Windows CEF + Windows WebView2 real-browser regressions
          - Callable/signature metadata + BindingRegistry
          - generation-safe RegistrationToken
          - cross-platform SharedLibrary
          - stable C ABI v1 PluginModule function registration
          - C++ Plugin/PluginApi/NATIVEWEB_PLUGIN convenience wrapper
          - plugin callable and queued/running task module lease
          - generic native-object owner-lease foundation

          Highest-priority unfinished plugin work is the real plugin-created
          native-object ABI/lifetime vertical slice, followed by conservative
          unload/plugin_busy semantics.

          ## Package scope

          This package intentionally excludes unrelated MapTiler/demo files.
          It contains project documentation, public headers, core/runtime,
          browser backends, plugin implementation, tests, CEF bootstrap tools,
          and relevant CI workflows.
          EOF

          printf "%s\n" "$GITHUB_SHA" > "$OUT/SNAPSHOT_SHA.txt"
          find "$OUT" -type f | sort > "$OUT/FILE_LIST.txt"

          echo "Handoff file count:"
          find "$OUT" -type f | wc -l

      - name: Upload handoff package
        uses: actions/upload-artifact@v4
        with:
          name: nativeweb-handoff-${{ github.sha }}
          path: nativeweb-handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
