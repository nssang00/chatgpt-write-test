name: NativeWeb Handoff Snapshot
# Refresh exact-source handoff snapshot for the 2026-10-17 transfer.

on:
  push:
    branches: ["nativeweb/autonomous-integration"]
    paths:
      - ".github/workflows/handoff-package.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact development commit
        uses: actions/checkout@v4

      - name: Assemble versioned source, docs, test and CI handoff
        shell: bash
        run: |
          set -euo pipefail
          OUT="nativeweb-handoff"
          mkdir -p "$OUT"

          for p in CMakeLists.txt README.md HANDOFF.md HANDOFF_PACKAGE_README.md CONTRIBUTING.md; do
            if [[ -f "$p" ]]; then cp "$p" "$OUT/"; fi
          done
          for d in docs include src bindings tests tools cmake examples ci .github/workflows; do
            if [[ -d "$d" ]]; then
              mkdir -p "$OUT/$(dirname "$d")"
              cp -R "$d" "$OUT/$d"
            fi
          done

          printf '%s\n' "$GITHUB_SHA" > "$OUT/SNAPSHOT_SHA.txt"
          find "$OUT" -type f -print | sed "s#^$OUT/##" | sort > "$OUT/FILE_LIST.txt"
          cat > "$OUT/README_FIRST_HANDOFF.md" <<EOF
          # NativeWeb / Xytron handoff source snapshot

          Repository: https://github.com/nssang00/chatgpt-write-test
          Branch: nativeweb/autonomous-integration
          Snapshot SHA: $GITHUB_SHA
          Draft PR: https://github.com/nssang00/chatgpt-write-test/pull/7

          ## Read first
          1. HANDOFF.md (most recent verified checkpoint is at the top)
          2. docs/PRODUCT_VISION.md and docs/PRODUCT_MODES_AND_BACKENDS.md
          3. docs/MODULE_ARCHITECTURE.md and docs/CROSS_LANGUAGE_BINDING.md
          4. docs/APP_RESOURCE_PROTOCOLS.md and docs/NATIVE_PERMISSION_POLICY.md
          5. docs/EXECUTION_PLAN.md and docs/RELEASE_TEST_MATRIX.md
          6. docs/ISSUE_LOG.md and docs/ACCEPTANCE_CRITERIA.md

          ## Latest verified state
          Packaged app:// UI resources work in Linux CEF, Windows CEF and
          Windows WebView2. Native C++11 Core and generated CLI/plugin
          scaffolds pass regression on both OS. Python/C# export metadata
          discovery passes on both OS but is not a live backend host.

          ## Blockers (do NOT claim product completion)
          NW-014: per-method/frame/native-object permission grants;
          standalone native app shell/OS menu; xytron restore/run/build/
          publish; Python/.NET real module runtime/JS IPC; PluginManager
          catalog/leases; embedded WPF/WinForms/MFC/GTK controls.
          app:// origins do not automatically grant native calls.
          Do not merge main or publish without owner approval.

          ## Source trust
          All repository files were taken from git checkout $GITHUB_SHA.
          This artifact intentionally excludes compiled CEF/WebView2
          distributions, generated binaries and unrelated user uploads.
          EOF

          echo "files: $(find "$OUT" -type f | wc -l)"
          test -f "$OUT/docs/CROSS_LANGUAGE_BINDING.md"
          test -f "$OUT/docs/APP_RESOURCE_PROTOCOLS.md"
          test -f "$OUT/src/core/app_resources.cpp"
          test -f "$OUT/include/xytron/plugin.hpp"
          test -f "$OUT/bindings/python/xytron/__init__.py"

      - name: Publish downloadable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nativeweb-handoff-${{ github.sha }}
          path: nativeweb-handoff/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 30
