name: M5 R58 32 MVT Three Cycle Worker Crash RTX
on:
  push:
    branches: [m5/r46-distinct-mvt-32-20261023]
    paths:
      - 'm5-gpu/r58/**'
      - '.github/workflows/m5-r58-32-worker-crash-rtx.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r58-32-worker-crash
  cancel-in-progress: true
jobs:
  actual-worker:
    runs-on: self-hosted
    timeout-minutes: 50
    env:
      R35_ZIP_PATH: 'C:\M5_R35\M5_R35_RTX_READY_SELF_CONTAINED_2026-10-22.zip'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert RTX and pinned R35
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force R58-EVIDENCE | Out-Null
          if($env:OS -ne 'Windows_NT'){throw 'Windows required'}
          $g=@(Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion)
          if(-not ($g | Where-Object {$_.Name -match 'NVIDIA.*RTX 5060 Ti'})){throw 'Physical RTX missing'}
          $g | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 R58-EVIDENCE\gpu.json
          $hash=(Get-FileHash -Algorithm SHA256 $env:R35_ZIP_PATH).Hash.ToLowerInvariant()
          if($hash -ne '3e5d3cb5d525b818a3b560731dac0ae17ce734ab5a96057c67c546c4b7cb2776'){throw 'R35 source SHA mismatch'}
          $hash | Set-Content -Encoding ascii R58-EVIDENCE\r35.txt
      - name: Reconstruct R48 and R51 experimental browser Worker build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R58-SOURCE'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive -LiteralPath $env:R35_ZIP_PATH -DestinationPath $dest -Force
          git -C $dest init -q
          if($LASTEXITCODE -ne 0){throw 'git init failed'}
          node m5-gpu/r45/apply_r45.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R45 apply failed'}
          node m5-gpu/r48/apply_cpu_join_fallback.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R48 apply failed'}
          node m5-gpu/r51/apply_worker_timeouts.mjs $dest
          if($LASTEXITCODE -ne 0){throw 'R51 apply failed'}
          New-Item -ItemType Directory -Force (Join-Path $dest 'm5-gpu\r58') | Out-Null
          Copy-Item .\m5-gpu\r58\real_worker_crash_32.html,.\m5-gpu\r58\run_worker_crash_32.mjs (Join-Path $dest 'm5-gpu\r58\')
          Push-Location $dest
          try{
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
            if($LASTEXITCODE -ne 0){throw 'Playwright install failed'}
          }finally{Pop-Location}
      - name: Fetch and identify all 32 unique real MVT PBF tiles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R58-SOURCE'
          New-Item -ItemType Directory -Force (Join-Path $dest 'm5-gpu\r46') | Out-Null
          Copy-Item .\m5-gpu\r46\download_unique_tiles.mjs (Join-Path $dest 'm5-gpu\r46\')
          node (Join-Path $dest 'm5-gpu\r46\download_unique_tiles.mjs') (Join-Path $dest 'tests\fixtures\r46-data')
          if($LASTEXITCODE -ne 0){throw 'R58 distinct PBF fixture download failed'}
      - name: Terminate real Chrome Worker in-flight then verify strict recovery
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'R58-SOURCE'
          $out=Join-Path $env:GITHUB_WORKSPACE 'R58-EVIDENCE\worker'
          node (Join-Path $dest 'm5-gpu\r58\run_worker_crash_32.mjs') $dest $out
          if($LASTEXITCODE -ne 0){throw 'R58 32-worker 3-cycle recovery failed'}
          $r=Get-Content (Join-Path $out 'result.json') -Raw | ConvertFrom-Json
          if(-not $r.pass -or $r.metrics.workerCount -ne 2 -or $r.metrics.streamsExact -lt 288 -or $r.metrics.abortCycles -ne 3 -or $r.metrics.recoveredTasks -ne 96){throw 'R58 evidence insufficient'}
      - name: Preserve real browser Worker recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r58-32-worker-crash
          path: R58-EVIDENCE/**
          retention-days: 30
          if-no-files-found: warn
