name: osm2mbtiles Seoul PostGIS Workers vs Planetiler Threads 4 8 16 32
on:
  workflow_dispatch:
  push:
    branches: [ci/osm2mbtiles-native-test]
    paths:
      - .github/workflows/osm2mbtiles-worker-scaling.yml
      - experiments/osm2mbtiles/prototype/ci/worker_scaling.py
permissions:
  contents: read
jobs:
  worker-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install real PostgreSQL 16 PostGIS osm2pgsql and metrics dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-client-16 postgresql-16-postgis-3 \
            postgresql-16-postgis-3-scripts osm2pgsql osmium-tool \
            python3-psycopg2 python3-psutil python3-pip ca-certificates curl
          /usr/bin/python3 -m pip install --break-system-packages mapbox-vector-tile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch matching Seoul PBF and pinned Planetiler jar
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/seoul-scaling"
          mkdir -p "$WORK" seoul-scaling-evidence
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            https://tiles.osm.kr/download/seoul-non-military.osm.pbf \
            -o "$WORK/seoul.osm.pbf"
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 200 \
            https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar \
            -o "$WORK/planetiler.jar"
          sha256sum "$WORK/seoul.osm.pbf" "$WORK/planetiler.jar"
          osmium fileinfo "$WORK/seoul.osm.pbf"
      - name: Repeat 4 8 16 32 worker comparisons with process-tree CPU and memory sampling
        run: |
          set -euxo pipefail
          PROJECT="$GITHUB_WORKSPACE/experiments/osm2mbtiles/prototype"
          /usr/bin/python3 "$PROJECT/ci/worker_scaling.py" \
            --project "$PROJECT" --work "$RUNNER_TEMP/seoul-scaling" \
            --evidence "$GITHUB_WORKSPACE/seoul-scaling-evidence" --repeats 2
          cat seoul-scaling-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full metrics including partial results on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seoul-postgis-planetiler-worker-scaling
          path: seoul-scaling-evidence/
          retention-days: 30
          if-no-files-found: warn