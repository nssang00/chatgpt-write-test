<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT GitHub Integration Lab</title>
  <desc id="desc">A banner for testing ChatGPT and GitHub integration capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="120" fill="#2ea043" opacity=".13"/>
  <circle cx="1120" cy="270" r="170" fill="#58a6ff" opacity=".08"/>
  <text x="72" y="116" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">ChatGPT × GitHub</text>
  <text x="72" y="172" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Integration Lab</text>
