<!doctype html>
<html><head><meta charset="utf-8"><title>Xytron bridge latency benchmark</title></head>
<body><script>
(async function() {
  'use strict';
  const records=[];
  const now=()=>performance.now();
  const ensure=(test,message)=>{if(!test)throw Error(message);};
  try {
    const config=await xytron.bench.config();
    const warmup=config.warmup;
    const count=config.samples;
    ensure(Number.isInteger(warmup)&&warmup>=0&&warmup<=5000&&
           Number.isInteger(count)&&count>=10&&count<=5000,'invalid sample config');

    async function series(id,fn,n=count,pre=warmup) {
      for(let i=0;i<pre;++i) await fn(i);
      const samples=[];
      for(let i=0;i<n;++i) {
        const start=now();
        await fn(i);
        samples.push(now()-start);
      }
      records.push({id,concurrency:1,samples_ms:samples,
                    elapsed_ms:samples.reduce((a,b)=>a+b,0)});
    }
    // First cold request is recorded separately, before any warm-up.
    const cold=now();
    ensure(await xytron.math.add(1,2)===3,'cold arithmetic mismatch');
    records.push({id:'LAT-08-cold',concurrency:1,
      samples_ms:[now()-cold],elapsed_ms:0});
    await series('LAT-01-direct',async()=> {
      ensure(await xytron.math.add(1,2)===3,'direct arithmetic mismatch');
    });
    await series('LAT-02-invoke',async()=> {
      ensure(await xytron.invoke('math.add',1,2)===3,'invoke arithmetic mismatch');
    });

    let nextAck=1;
    const pending=new Map();
    const subscription=xytron.onMessage('bench.pong',reply=>{
      const task=pending.get(reply);
      if(task) {pending.delete(reply);task.resolve();}
    });
    const ack=()=> {
      const id=nextAck++;
      return new Promise((resolve,reject)=>{
        pending.set(id,{resolve,reject});
        xytron.postMessage('bench.ping',id);
      });
    };
    await series('LAT-04-event-ack',ack);
    xytron.offMessage(subscription);
    ensure(pending.size===0,'event response lost');

    for(const bytes of [0,1024,65536]) {
      const payload=new Uint8Array(bytes);
      if(bytes) {payload[0]=7;payload[bytes-1]=251;}
      await series('LAT-05-binary-'+bytes,async()=>{
        const answer=await xytron.bench.echo(payload);
        ensure(answer instanceof ArrayBuffer&&answer.byteLength===bytes,
          'binary length mismatch '+bytes);
        if(bytes) {
          const view=new Uint8Array(answer);
          ensure(view[0]===7&&view[bytes-1]===251,'binary mismatch '+bytes);
        }
      },bytes>=65536?Math.min(count,40):count,bytes>=65536?10:warmup);
    }

    for(const concurrency of [8,32]) {
      const times=[],batchStart=now();
      let counter=0;
      const jobs=Array.from({length:concurrency},async()=>{
        while(true) {
          const i=counter++;
          if(i>=count) return;
          const start=now();
          ensure(await xytron.math.add(i,2)===i+2,'concurrent mismatch');
          times.push(now()-start);
        }
      });
      await Promise.all(jobs);
      const elapsed=now()-batchStart;
      ensure(times.length===count,'concurrency lost samples');
      records.push({id:'LAT-06-parallel-'+concurrency,
        concurrency,samples_ms:times,elapsed_ms:elapsed,
        throughput_ops_s:count*1000/elapsed});
    }
    const result={schema:1,clock:'JS performance.now',warmup,
      samples_per_small_scenario:count,records};
    // Native closes browser here, so an accepted Promise is not required.
    try {await xytron.bench.finish(JSON.stringify(result));}
    catch(_) { /* browser intentionally destroyed */ }
  } catch(error) {
    const message=error&&error.stack?error.stack:String(error);
    try {await xytron.bench.abort(message);}catch(_){}
  }
})();
</script></body></html>
