<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NativeWeb real plugin browser E2E</title></head>
<body>
<script>
(async function () {
  if (window !== window.top) {
    // Deliberately reload the SAME trusted entry in a child frame.
    // Its engine-supplied main-frame identity must differ, even when
    // its URL string and content are byte-for-byte identical.
    window.parent.postMessage({ kind: "nativeweb-security-probe-ready" }, "*");
    let outcome = "no-bridge";
    try {
      if (typeof xytron !== "undefined") {
        await xytron.test.checkpoint("security-UNTRUSTED-CALL-EXECUTED");
        outcome = "allowed";
      }
    } catch (error) {
      outcome = String(error).includes("permission_denied")
        ? "denied" : "unexpected-error:" + String(error);
    }
    window.parent.postMessage({
      kind: "nativeweb-security-probe",
      outcome: outcome
    }, "*");
    return;
  }
  async function fail(message) {
    try { await xytron.invoke("test.fail", String(message)); }
    catch (_) { /* the WebView may already be closing */ }
  }
  function ensure(condition, message) {
    if (!condition) throw new Error(message);
  }
  try {
  // The scheme itself must serve real bytes, enforce MIME, and return 404
  // for an undeclared resource. file:// legacy E2E bypasses these checks.
  if (location.protocol === "app:") {
    const child = await fetch("app://desktop/plugin_untrusted_child.html");
    ensure(child.ok && child.status === 200,
           "app:// child resource not served");
    ensure((child.headers.get("content-type") || "").includes("text/html"),
           "app:// HTML MIME missing");
    ensure((await child.text()).includes("nativeweb-security-probe-ready"),
           "app:// child resource bytes mismatch");
    const missing = await fetch("app://desktop/no-such-file.json");
    ensure(missing.status === 404,
           "app:// unknown resource must return 404");
  }
    // This is a real dynamically-loaded library factory, not camera.open's
    // host-side mock object from the generic bridge integration test.
    const counter = await xytron.plugin.open(77);
    ensure(counter && typeof counter.value === "function", "missing native proxy");
    ensure(await counter.value() === 77, "argument-aware factory did not receive 77");
    ensure(await counter.add(5) === 82, "C ABI object method returned wrong value");

    let objectError = false;
    try { await counter.fail(); }
    catch (error) { objectError = String(error).includes("counter_failure"); }
    ensure(objectError, "plugin object error did not reach Promise rejection");

    let factoryError = false;
    try { await xytron.plugin.open("invalid"); }
    catch (error) {
      factoryError = String(error).includes("invalid_factory_arguments");
    }
    ensure(factoryError, "invalid factory arguments did not reject");
    // Actual second local document (not the trusted entry). Try to call
    // the real native checkpoint from a child frame. There must be no
    // native-side side effect even if the engine injects the bridge API.
    async function probeChild(src) {
      const frame = document.createElement("iframe");
      frame.src = src;
      frame.style.display = "none";
      const childResult = new Promise(resolve => {
        let frameReady = false;
        const timer = setTimeout(() => {
          window.removeEventListener("message", onChildMessage);
          resolve(frameReady ? "no-response" : "frame-never-loaded");
        }, 7000);
        function onChildMessage(event) {
          if (event.source !== frame.contentWindow || !event.data)
            return;
          if (event.data.kind === "nativeweb-security-probe-ready") {
            frameReady = true;
            return;
          }
          if (event.data.kind !== "nativeweb-security-probe")
            return;
          clearTimeout(timer);
          window.removeEventListener("message", onChildMessage);
          resolve(frameReady ? event.data.outcome : "missing-probe-ready");
        }
        window.addEventListener("message", onChildMessage);
      });
      document.body.appendChild(frame);
      const outcome = await childResult;
      frame.remove();
      ensure(outcome === "denied" ||
             outcome === "no-bridge" ||
             outcome === "no-response",
             "untrusted child frame " + src + " reached native API: " + outcome);
    }
    // A different local file and the exact same trusted entry must both
    // fail to invoke a native-side method from a non-main frame.
    await probeChild("plugin_untrusted_child.html");
    await xytron.test.checkpoint("security-untrusted-frame-blocked");
    await probeChild("plugin_bridge_test.html");
    await xytron.test.checkpoint("security-same-entry-iframe-blocked");
    await xytron.test.checkpoint("plugin-js-verified");

    ensure(await xytron.test.plugin.busy() === true,
      "live plugin object did not block unload");
    ensure(await counter.value() === 82,
      "plugin object stopped working during unload quiesce");

    ensure(await counter.dispose() === true, "native dispose failed");
    let releasedError = false;
    try { await counter.value(); }
    catch (error) {
      releasedError = String(error).includes("native_object_not_found");
    }
    ensure(releasedError, "disposed object remained callable");

    ensure(await xytron.test.plugin.unload() === true,
      "plugin unload after dispose failed");
    // This callback closes the native browser. Its response need not survive.
    try { await xytron.test.plugin.done(); }
    catch (_) { /* expected if browser closes during response */ }
  } catch (error) {
    await fail(error && error.stack ? error.stack : String(error));
  }
})();
</script>
</body>
</html>
