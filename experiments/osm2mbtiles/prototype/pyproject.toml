[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm2mbtiles-local"
version = "0.1.0"
description = "Docker-free local OSM Carto raster MBTiles export orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
osm2mbtiles = "osm2mbtiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=10"]